# Vale prose linting (#1844). Vendored styles under .vale/styles/ -- no
# `vale sync` at CI time, no network. Base package is Google's style
# (vale-cli/Google v0.7.1, vendored verbatim under .vale/styles/Google/);
# pi-lens/ holds the house additions (em-dash density, sentence length, no
# "please"). Goal is a mechanical dogfooding pass, not a mass reformat --
# rules that would force rewriting the existing tree are disabled or
# downgraded below, each with a one-line reason (the markdownlint precedent
# from #1917/.markdownlint-cli2.jsonc).
StylesPath = .vale/styles
MinAlertLevel = suggestion

[{docs/**/*.md,AGENTS.md,CLAUDE.md,README.md,CONTRIBUTING.md,.claude/agents/*.md,.changelog/*.md}]
BasedOnStyles = Google, pi-lens

# --- error-level Google rules that would fail the CURRENT tree ---

# Repo convention is a spaced em dash throughout every doc (AGENTS.md's own
# heading, this file's own comment block above). Google's unspaced-dash
# rule fights that convention on 1000+ existing lines; the density concern
# we actually care about is pi-lens.EmDashDensity instead.
Google.EmDash = NO
# "NNs" duration literals (240s, 15s, 300s) are this codebase's idiom for
# timeouts/delays throughout AGENTS.md and the docs; inserting a
# nonbreaking space before every one is a mass rewrite, not a lint fix.
Google.Units = NO
# "e.g."/"i.e."/"etc." are established shorthand across every doc in this
# repo; spelling each one out is a mass rewrite out of scope here.
Google.Latin = NO
# Hyphenated -ly compounds ("fully-covered", "separately-gated") are this
# repo's established technical-compound-modifier style.
Google.LyHyphens = NO
# Docs routinely quote literal code/config strings and file names; moving
# trailing punctuation inside the quotes would corrupt the literal.
Google.Quotes = NO
# The abbreviation-spacing heuristic misfires on code identifiers and paths
# shaped like "letter.Letter" (e.g. inline references to methods/fields),
# which this repo's prose is full of.
Google.Spacing = NO
# Only 2 hits ("file(s)", "server(s)"); downgraded rather than editing
# prose in a lint-setup PR.
Google.OptionalPlurals = suggestion
# Only 1 hit ("TL;DR"); downgraded rather than editing prose in a
# lint-setup PR.
Google.Slang = suggestion
# Only 1 hit ("2nd"); downgraded rather than editing prose in a
# lint-setup PR.
Google.Ordinal = suggestion
# pi-lens docs write ISO dates (2026-11-04) on purpose. This rule asks for
# "July 31, 2016" style, and its one error hit on master (#5249) was a date
# no PR's own change could fix.
Google.DateFormat = NO

# --- non-blocking rules disabled to keep the advisory signal usable ---

# Parenthetical asides and issue refs like "(#1234)" are pervasive in this
# repo's prose; over 2000 hits would drown any real finding.
Google.Parens = NO
# The "define on first use" heuristic misfires on plain capitalized words
# (NOT, AND, MUST, ALL, ONE) and re-flags jargon (LSP, MCP, AST, WASM)
# already established once per doc and reused hundreds of times.
Google.Acronyms = NO
# 333 hits. Most are genuine, not false positives: "kill"/"abort"/
# "terminate" -> "stop"/"exit"/"cancel" (39), "app" -> "application" (96),
# "preceding" -> "above" (62), "regular expression" -> "regex" (5),
# "file path" -> "path" (6). Only "touch" -> "tap" (48) is a real false
# positive, misreading this repo's filesystem sense of "touch a file" as
# the UI term. Disabled here for volume in a lint-setup PR that isn't
# rewriting docs, not because the rule is wrong (#1933 review F4).
Google.WordListCase = NO
# "CLI" is this repo's own established term for its command-line tooling;
# Google's web-product substitution doesn't fit a dev-tool repo.
Google.WordList = NO
# The heuristic misfires on capitalized acronyms/proper nouns after a
# colon (flags "PR", "PID", "Python" as needing lowercase).
Google.Colons = NO
# Dense technical sentences in this repo's prose use semicolons throughout;
# over 300 hits is noise, not signal.
Google.Semicolons = NO
# Contraction use is mixed by design (formal spec sections vs. conversational
# notes); enforcing one direction would rewrite hundreds of existing lines.
Google.Contractions = NO
# Passive voice is often the clearest construction for describing system
# behavior ("diagnostics are deduped"), and it flags 700+ existing,
# intentional uses -- but it was already warning-level (never gated the
# exit code) and it's the prose contract's own first mechanic ("active
# voice, present tense"), so downgrade rather than delete (#1933 review F3).
Google.Passive = suggestion
