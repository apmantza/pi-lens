# Qodo (v2) repo config. Every key below is defined in the Qodo v2
# configuration and command reference:
# https://docs.qodo.ai/configuration/configuration-and-command-reference
# (fetched 2026-11-04). Keys the reference does not define are not set here.
# Label-only policy (maintainer decision 2026-11-04, #4685): no PR gets an
# automatic review, maintainer or contributor. A review runs only when someone
# posts a manual `/agentic_review` comment. .coderabbit.yaml and greptile.json
# carry the same policy.

[github_app]
# Automatic runs are off. The reference says "Commands run automatically when a
# PR is opened or updated" and "Remove a command to disable its trigger", so the
# empty list turns off the automatic `/agentic_review`. The reference does not
# say whether `[]` is accepted: check the Qodo dashboard after this lands. It
# also does not say whether a manual `/agentic_review` still runs with
# `pr_commands = []`: probe that after this lands.
pr_commands = []
# Drafts wait until the PR is ready.
feedback_on_draft_pr = false
# No per-push re-review; the orchestrator requests one review per final head.
handle_push_trigger = false

[review_agent]
issues_user_guidelines = """
Review the change against AGENTS.md, the numbered defect shapes in
docs/defect-shapes.md, and the invariants in docs/invariants/. Report only
findings that a code path or a test can demonstrate. Do not comment on style
that the lint gates enforce.
"""
