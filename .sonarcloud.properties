# SonarCloud automatic analysis settings (the project runs automatic analysis,
# which reads this file and ignores sonar-project.properties and
# sonar.issue.ignore.multicriteria). Only the keys below override the project's
# UI settings; sonar.exclusions stays as configured in the UI.
#
# vitest.config.ts is the unit-test harness config: it is not in the published
# package ("files" in package.json) and runs only under vitest. Classify it as
# a test file so main-source rules do not run on it. typescript:S5443
# (publicly writable directories, scope MAIN) flagged its win32-only block
# that re-spells TEMP/TMP as the long form of the SAME os.tmpdir() directory:
# the block creates and writes nothing and moves no directory (#4019). Only
# this one file is listed; product code keeps every rule, S5443 included.
sonar.test.inclusions=vitest.config.ts
