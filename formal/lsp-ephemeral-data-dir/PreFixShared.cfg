\* expect: violated NoCrossRootShare
\* module: LspEphemeralDataDir
\* Pre-#4127: every temporary checkout in one process shared the pid-only dir.
CONSTANTS
    ProcIds = {a, b}
    Pids = {1}
    Roots = {r1, r2}
    MaxStarts = 3
    UniqueToken = FALSE
    SafeSweep = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossRootShare ClassificationConsistent
CHECK_DEADLOCK FALSE
