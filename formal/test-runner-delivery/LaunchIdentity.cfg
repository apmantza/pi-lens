\* expect: violated NoLateDelivery
\* module: TestRunnerDelivery
\* Pre-fix #5259: delivery compared with testRunGeneration, so the pre-run write of a batch still in flight at agent_settled dropped the staged failure and it reached the model one agent run late.
CONSTANTS
    MaxGen = 3
    StageEligible = "idle"
    Identity = "launch"
SPECIFICATION Spec
INVARIANTS TypeOK NoLateDelivery NoStaleDelivery NoMidRunDelivery
CHECK_DEADLOCK FALSE
