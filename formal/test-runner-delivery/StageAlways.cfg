\* expect: violated NoMidRunDelivery
\* module: TestRunnerDelivery
\* Mutant: a publish marks its delivery eligible without reading the host's idle state, so a context build inside the run delivers it mid-work (#2366).
CONSTANTS
    MaxGen = 3
    StageEligible = "always"
    Identity = "content"
SPECIFICATION Spec
INVARIANTS TypeOK NoLateDelivery NoStaleDelivery NoMidRunDelivery
CHECK_DEADLOCK FALSE
