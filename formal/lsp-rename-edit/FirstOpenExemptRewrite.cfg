\* expect: pass
\* module: LspRenameEdit
\* Fix (#3827) over the #3747 boundary: an external write to the unopened file, with first opens of it before or after T. The first open does not excuse the write: the unopened mtime rule still holds, and the apply is never stale.
CONSTANTS
    Files = {t, u}
    Target = t
    Opened = {}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {}
    ExternalFiles = {u}
    TouchFiles = {u}
    KeepMtime = FALSE
    WatcherPrompt = TRUE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    FirstOpenExempt = "quiet"
    SyncBeforeCapture = FALSE
    ForceFirstOpen = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
