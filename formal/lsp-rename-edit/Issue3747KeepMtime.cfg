    Files = {t, u}
    Target = t
    Opened = {}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {}
    ExternalFiles = {u}
    TouchFiles = {}
    KeepMtime = TRUE
    WatcherPrompt = TRUE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    FirstOpenExempt = "off"
    SyncBeforeCapture = FALSE
    ForceFirstOpen = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
