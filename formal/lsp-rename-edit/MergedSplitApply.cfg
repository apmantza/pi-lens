\* expect: violated NoStaleApply
\* module: LspRenameEdit
\* Outside Merged's claim: an unqueued write between the apply's compare and its write is overwritten at stale offsets (LspEdit, lane L5).
CONSTANTS
    Files = {t, o, u}
    Target = t
    Opened = {o}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {t, o}
    ExternalFiles = {t, o}
    TouchFiles = {t, o}
    KeepMtime = TRUE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = TRUE
    StampedPrepare = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
