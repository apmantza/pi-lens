    Files = {o, u}
    Target = none
    Opened = {o}
    Flow = "renameFile"
    Rule = "merged"
    PiWriteFiles = {o}
    ExternalFiles = {o}
    TouchFiles = {}
    KeepMtime = TRUE
    WatcherPrompt = FALSE
    AbortAfterText = TRUE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
