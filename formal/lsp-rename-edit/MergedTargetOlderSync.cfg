\* expect: violated NoStaleApply
\* module: LspRenameEdit
\* Outside Merged's claim: a late pipeline sync carries older target bytes after openFileBestEffort's unstamped send, which #3481's stamped drop does not order. NoUnexplainedRefusal is left out: a stale sync after the request also gives safe false refusals.
CONSTANTS
    Files = {t, o, u}
    Target = t
    Opened = {o}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {t, o}
    ExternalFiles = {t, o}
    TouchFiles = {t, o}
    KeepMtime = TRUE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = TRUE
    SplitApply = FALSE
    StampedPrepare = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal
CHECK_DEADLOCK FALSE
