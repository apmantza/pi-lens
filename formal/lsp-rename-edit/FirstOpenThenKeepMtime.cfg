\* expect: pass
\* module: LspRenameEdit
\* #3827 r3 (verify r2 F4): u is first opened before the capture and every external write lands after that open, keeping the old mtime or not, with pi writes too. The shipped rule refuses a quiet first-opened file whose disk is not the last send or whose send record changed after its first send.
CONSTANTS
    Files = {t, u}
    Target = t
    Opened = {}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {u}
    ExternalFiles = {u}
    TouchFiles = {u}
    KeepMtime = TRUE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    FirstOpenExempt = "quiet"
    SyncBeforeCapture = TRUE
    ForceFirstOpen = TRUE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
