\* expect: violated NoStaleApply
\* module: LspRenameEdit
\* #3747 (open) on master: an external write to an unopened file older than the margin, missed by the server's watcher, is applied at stale offsets.
CONSTANTS
    Files = {t, u}
    Target = t
    Opened = {}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {}
    ExternalFiles = {u}
    TouchFiles = {}
    KeepMtime = FALSE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    FirstOpenExempt = "off"
    SyncBeforeCapture = FALSE
    ForceFirstOpen = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
