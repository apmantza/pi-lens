\* expect: pass
\* module: LspRenameEdit
\* Candidate (#3481 drop pinned): stamp openFileBestEffort's send with a readStamp, and the drop discards an older stamped sync of the target, so MergedTargetOlderSync's trace is gone. NoUnexplainedRefusal is left out: an older sync of an opened file after the request is still a safe false refusal.
CONSTANTS
    Files = {t, o, u}
    Target = t
    Opened = {o}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {t, o}
    ExternalFiles = {t, o}
    TouchFiles = {t, o}
    KeepMtime = TRUE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = TRUE
    SplitApply = FALSE
    StampedPrepare = TRUE
    FirstOpenExempt = "off"
    SyncBeforeCapture = FALSE
    ForceFirstOpen = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal
CHECK_DEADLOCK FALSE
