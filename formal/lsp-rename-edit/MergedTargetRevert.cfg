\* expect: violated NoStaleApply
\* module: LspRenameEdit
\* Outside Merged's claim: a write that restores the target's earlier bytes (A-B-A) after the server saw newer ones passes the target's byte check. NoUnexplainedRefusal is left out: A-B-A also gives safe false refusals of opened files.
CONSTANTS
    Files = {t, o, u}
    Target = t
    Opened = {o}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {t, o}
    ExternalFiles = {t, o}
    TouchFiles = {t, o}
    KeepMtime = TRUE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = TRUE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal
CHECK_DEADLOCK FALSE
