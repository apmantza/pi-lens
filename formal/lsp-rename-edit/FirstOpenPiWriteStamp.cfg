\* expect: violated NoStaleApply
\* module: LspRenameEdit
\* Review r1 F1 (probe P1) on the first #3827 rule: pi wrote the unopened file older than the margin before T, and its sync lands as the first open inside the request window. The unopened mtime rule accepts it and the server's load-time copy takes the edit at other bytes.
CONSTANTS
    Files = {t, u}
    Target = t
    Opened = {}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {u}
    ExternalFiles = {}
    TouchFiles = {u}
    KeepMtime = FALSE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    FirstOpenExempt = "stamp"
    SyncBeforeCapture = TRUE
    ForceFirstOpen = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
