\* expect: violated NoStaleApply
\* module: LspRenameEdit
\* Before #3736 (#3601): the rename applies with no expectedContent, so a write after the request is overwritten at stale offsets.
CONSTANTS
    Files = {t, o}
    Target = t
    Opened = {o}
    Flow = "rename"
    Rule = "none"
    PiWriteFiles = {t, o}
    ExternalFiles = {}
    TouchFiles = {}
    KeepMtime = FALSE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    FirstOpenExempt = "off"
    SyncBeforeCapture = FALSE
    ForceFirstOpen = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
