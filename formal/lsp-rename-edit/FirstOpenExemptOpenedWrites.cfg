\* expect: pass
\* module: LspRenameEdit
\* Fix (#3827) with the Merged writers: pi and external writes (mtime kept) to the target and the opened file, and first opens of the unopened file. The opened-file rule must hold exactly as in Merged.
CONSTANTS
    Files = {t, o, u}
    Target = t
    Opened = {o}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {t, o}
    ExternalFiles = {t, o}
    TouchFiles = {t, o, u}
    KeepMtime = TRUE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    FirstOpenExempt = "quiet"
    SyncBeforeCapture = FALSE
    ForceFirstOpen = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
