    Files = {t, u}
    Target = t
    Opened = {}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {u}
    ExternalFiles = {}
    TouchFiles = {u}
    KeepMtime = FALSE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    FirstOpenExempt = "quiet"
    SyncBeforeCapture = TRUE
    ForceFirstOpen = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
