    Files = {t, u}
    Target = t
    Opened = {}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {u}
    ExternalFiles = {u}
    TouchFiles = {u}
    KeepMtime = TRUE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    FirstOpenExempt = "off"
    SyncBeforeCapture = TRUE
    ForceFirstOpen = TRUE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal
CHECK_DEADLOCK FALSE
