\* expect: violated NoStaleApply
\* module: LspRenameEdit
\* #3747 boundary: with no prompt watcher an external write older than the margin is missed by the server and the mtime rule, as in Issue3747External; the exemption is not involved.
CONSTANTS
    Files = {t, u}
    Target = t
    Opened = {}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {u}
    ExternalFiles = {u}
    TouchFiles = {u}
    KeepMtime = FALSE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    FirstOpenExempt = "quiet"
    SyncBeforeCapture = TRUE
    ForceFirstOpen = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
