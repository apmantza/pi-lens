\* expect: pass
\* module: LspRenameEdit
\* Review r1 F1 baseline: master before #3827 refused the same shape by the send stamp, so NoStaleApply holds. NoUnexplainedRefusal is left out: master still refuses a benign first open (#3827, MergedFirstOpenTouch).
CONSTANTS
    Files = {t, u}
    Target = t
    Opened = {}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {u}
    ExternalFiles = {}
    TouchFiles = {u}
    KeepMtime = FALSE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    FirstOpenExempt = "off"
    SyncBeforeCapture = TRUE
    ForceFirstOpen = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal
CHECK_DEADLOCK FALSE
