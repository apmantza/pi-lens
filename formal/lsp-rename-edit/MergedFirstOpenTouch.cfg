\* expect: violated NoUnexplainedRefusal
\* module: LspRenameEdit
\* Model finding on master (safe): a read or cascade touch that first opens an unopened file after the request stamps it at or after T, and the rename is refused although no byte changed.
CONSTANTS
    Files = {t, o, u}
    Target = t
    Opened = {o}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {}
    ExternalFiles = {}
    TouchFiles = {u}
    KeepMtime = TRUE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
