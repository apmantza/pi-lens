\* expect: violated NoUnexplainedRefusal
\* module: LspRenameEdit
\* #3736 round 2 (92d14c0c6): an unopened touched file is always refused, so a quiet cross-file rename fails (round-3 decision).
CONSTANTS
    Files = {t, o, u}
    Target = t
    Opened = {o}
    Flow = "rename"
    Rule = "r2"
    PiWriteFiles = {t, o}
    ExternalFiles = {t, o}
    TouchFiles = {}
    KeepMtime = TRUE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Revert = FALSE
    SyncCarriesRead = FALSE
    SplitApply = FALSE
    StampedPrepare = FALSE
    FirstOpenExempt = "off"
    SyncBeforeCapture = FALSE
    ForceFirstOpen = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoStaleApply AtomicRefusal NoUnexplainedRefusal
CHECK_DEADLOCK FALSE
