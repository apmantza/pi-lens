\* expect: violated NoStaleCachedAtFull
\* module: FindingDelivery
\* Mutant (#1622, #1419): the cached store has no stale verdict, so a finding
\* whose file was written after the scan keeps its line and full authority.
CONSTANTS
    Kinds = {"cached"}
    OutsideKinds = {"write"}
    CanMark = TRUE
    MaxClk = 7
    MaxTurns = 3
    StampAt = "read"
    NeighbourGate = "freshness"
    Reserve = "record"
    Delta = "none"
    PolicyArms = "both"
    Anchor = "line"
    ClearOnClean = "clear"
    CachedGate = "noStale"
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleCachedAtFull
CHECK_DEADLOCK FALSE
