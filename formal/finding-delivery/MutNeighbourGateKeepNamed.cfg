\* expect: violated NamedOnce
\* module: FindingDelivery
\* Mutant (runtime-turn.ts, the changed line's delivery hold): the
\* "changed since checked" line does not forget its entry, so the neighbour is
\* named again on every turn.
CONSTANTS
    Kinds = {"pending"}
    OutsideKinds = {"write"}
    CanMark = TRUE
    MaxClk = 7
    MaxTurns = 3
    StampAt = "read"
    NeighbourGate = "keepNamed"
    Reserve = "record"
    Delta = "none"
    PolicyArms = "both"
    Anchor = "line"
    ClearOnClean = "clear"
    CachedGate = "freshness"
SPECIFICATION Spec
INVARIANTS TypeOK NamedOnce
CHECK_DEADLOCK FALSE
