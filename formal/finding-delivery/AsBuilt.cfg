\* expect: pass
\* module: FindingDelivery
\* The gate stack as built: the pending record stamped at the run's read and
\* gated by freshness (named once when written, forgotten silently when
\* deleted), every observed error listed on every run and kept on the
\* unresolved line and cleared by a newer clean observation, the cached store
\* gated by freshness (missing dropped, stale demoted), dispositions over both
\* freshness arms and anchored to the flagged line. Both stores, outside writes
\* and deletes, the agent's mark.
CONSTANTS
    Kinds = {"pending", "cached"}
    OutsideKinds = {"write", "delete"}
    CanMark = TRUE
    MaxClk = 7
    MaxTurns = 3
    StampAt = "read"
    NeighbourGate = "freshness"
    Reserve = "record"
    Delta = "none"
    PolicyArms = "both"
    Anchor = "line"
    ClearOnClean = "clear"
    CachedGate = "freshness"
SPECIFICATION Spec
INVARIANTS TypeOK NoUnresolvedAfterWrite NoUnresolvedAfterDelete NoSilentForget PersistentListed ListedWhenObserved NamedOnce NoNamedAfterDelete CleanClears MarkedNeverShown NoSuppressRewritten NoCachedAfterDelete NoStaleCachedAtFull NoCachedStaleDrop CachedDelivered
CHECK_DEADLOCK FALSE
