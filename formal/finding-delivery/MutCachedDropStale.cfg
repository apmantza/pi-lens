\* expect: violated NoCachedStaleDrop
\* module: FindingDelivery
\* Mutant (#1622): a stale cached finding is dropped, not demoted, so a
\* credential in an edited file can be hidden.
CONSTANTS
    Kinds = {"cached"}
    OutsideKinds = {"write"}
    CanMark = TRUE
    MaxClk = 7
    MaxTurns = 3
    StampAt = "read"
    NeighbourGate = "freshness"
    Reserve = "record"
    Delta = "none"
    PolicyArms = "both"
    Anchor = "line"
    ClearOnClean = "clear"
    CachedGate = "dropStale"
SPECIFICATION Spec
INVARIANTS TypeOK NoCachedStaleDrop
CHECK_DEADLOCK FALSE
