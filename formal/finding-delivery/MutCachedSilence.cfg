\* expect: violated CachedDelivered
\* module: FindingDelivery
\* Mutant: a live, unmarked cached finding is delivered nowhere, so a real
\* finding never reaches the agent and nothing says it was withheld.
CONSTANTS
    Kinds = {"cached"}
    OutsideKinds = {"write"}
    CanMark = TRUE
    MaxClk = 7
    MaxTurns = 3
    StampAt = "read"
    NeighbourGate = "freshness"
    Reserve = "record"
    Delta = "none"
    PolicyArms = "both"
    Anchor = "line"
    ClearOnClean = "clear"
    CachedGate = "silence"
SPECIFICATION Spec
INVARIANTS TypeOK CachedDelivered
CHECK_DEADLOCK FALSE
