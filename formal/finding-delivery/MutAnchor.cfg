\* expect: violated NoSuppressRewritten
\* module: FindingDelivery
\* Mutant: a false-positive mark does not anchor to the flagged line, so it
\* keeps suppressing a finding whose line was rewritten.
CONSTANTS
    Kinds = {"cached"}
    OutsideKinds = {"write"}
    CanMark = TRUE
    MaxClk = 7
    MaxTurns = 3
    StampAt = "read"
    NeighbourGate = "freshness"
    Reserve = "record"
    Delta = "none"
    PolicyArms = "both"
    Anchor = "none"
SPECIFICATION Spec
INVARIANTS TypeOK NoSuppressRewritten
CHECK_DEADLOCK FALSE
