\* expect: pass
\* module: SiblingRestore
\* The shape of the code (#3830): the restore takes pi's queue entry for S, starts once the pipeline has scanned the tool's changes, and the pipeline's release of the target F's entry does not wait for it (the pipeline holds F from Begin, an LSP multi-path edit takes S then F). No edit newer than the capture is overwritten, and TLC's deadlock check passes.
CONSTANTS
    SEdits = 2
    SReplacer = 0
    SReplaced = 0
    SConcurrent = TRUE
    SInOrderNotes = FALSE
    SAtomic = FALSE
    SRestore = TRUE
    SettleCapture = TRUE
    RestoreRecheck = TRUE
    RestoreQueue = TRUE
    SCallInRun = TRUE
    KeepCaptureHistory = FALSE
    CarryPreRunCalls = FALSE
    RestoreNoCapInFlight = FALSE
    RestoreInFlight = TRUE
    TargetHold = TRUE
    RestoreGatesHold = FALSE
    LspMulti = TRUE
SPECIFICATION Spec
INVARIANTS NoRestoreOverNewer NoNoopRestore
CHECK_DEADLOCK TRUE
