\* expect: violated NoRestoreOverNewer
\* module: SiblingRestore
\* Stated residual of #3741 (defect 2), isolated: the run stays registered through the restore (SettleCapture), so only the compare-then-write gap is left. An agent edit of S that lands between the re-stat and the write is overwritten by the older capture, and the report says the file was restored.
CONSTANTS
    SEdits = 2
    SConcurrent = TRUE
    SAtomic = TRUE
    SRestore = TRUE
    SettleCapture = TRUE
    RestoreRecheck = TRUE
    RestoreQueue = FALSE
    SCallInRun = FALSE
    RestoreNoCapInFlight = FALSE
    RestoreInFlight = TRUE
SPECIFICATION Spec
INVARIANTS NoRestoreOverNewer
CHECK_DEADLOCK FALSE
