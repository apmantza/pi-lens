    SAtomic = FALSE
    SRestore = TRUE
    SettleCapture = TRUE
    RestoreRecheck = TRUE
    RestoreQueue = TRUE
    SCallInRun = TRUE
    KeepCaptureHistory = FALSE
    CarryPreRunCalls = FALSE
    RestoreNoCapInFlight = FALSE
    RestoreInFlight = TRUE
    TargetHold = FALSE
    RestoreGatesHold = FALSE
    LspMulti = FALSE
SPECIFICATION Spec
INVARIANTS NoRestoreOverNewer
CHECK_DEADLOCK FALSE
