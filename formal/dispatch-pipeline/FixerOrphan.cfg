\* expect: pass
\* module: DispatchPipeline
\* Fixed code (#3506 and its review round 1), sequential tools: the handler's 10 s bound abandons the pipeline and pi starts the next edit, which queues behind the orphaned autofix instead of being overwritten by it; the writer's own bound (WriterBound) may also give up on the writer, and the hold then waits for the abandoned child to write.
CONSTANTS
    Edits = 2
    Parallel = FALSE
    Orphan = TRUE
    ImmediateEdits = {1}
    ClaimGap = FALSE
    InFlightDedupe = TRUE
    WidgetGuard = TRUE
    FixRecord = FALSE
    FixClear = FALSE
    FixTomb = FALSE
    FixQueue = TRUE
    FixQueueRefresh = TRUE
    FixReToken = TRUE
    WriterBound = TRUE
    FixHoldWriter = TRUE
SPECIFICATION Spec
INVARIANTS NoLostEdit
CHECK_DEADLOCK FALSE
