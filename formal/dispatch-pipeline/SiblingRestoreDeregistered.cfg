\* expect: violated NoRestoreOverReadEdit
\* module: SiblingRestore
\* Merged behaviour, finding: finish() leaves the registry before settle reads S, so an agent edit whose tool_call comes after that is neither in flight nor captured, and the restore writes the older capture over it.
CONSTANTS
    SEdits = 2
    SConcurrent = TRUE
    SAtomic = TRUE
    SRestore = TRUE
    SettleCapture = FALSE
    RestoreRecheck = TRUE
    RestoreQueue = FALSE
    SCallInRun = FALSE
    RestoreNoCapInFlight = FALSE
    RestoreInFlight = TRUE
    TargetHold = FALSE
    RestoreGatesHold = FALSE
    LspMulti = FALSE
SPECIFICATION Spec
INVARIANTS NoRestoreOverReadEdit
CHECK_DEADLOCK FALSE
