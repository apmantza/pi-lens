\* expect: pass
\* module: SiblingRestore
\* The merged restore (#3598, #3741), one agent edit of S while the tool runs: the edit is captured, the tool erases it, the restore writes it back, and nothing newer than the only capture exists to be overwritten.
CONSTANTS
    SEdits = 1
    SConcurrent = TRUE
    SAtomic = TRUE
    SRestore = TRUE
    SettleCapture = FALSE
    RestoreRecheck = TRUE
    RestoreQueue = FALSE
    SCallInRun = FALSE
    RestoreNoCapInFlight = FALSE
    RestoreInFlight = TRUE
SPECIFICATION Spec
INVARIANTS NoSilentLoss NoRestoreOverNewer EveryEditSurvives
CHECK_DEADLOCK FALSE
