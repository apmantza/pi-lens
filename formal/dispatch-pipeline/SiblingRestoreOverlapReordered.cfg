\* expect: violated NoFalseAlarmUntouched
\* module: SiblingRestore
\* The round-4 residual (state table row 29): SiblingRestoreOverlap with SInOrderNotes = FALSE, so a note can arrive for an older edit after a NEWER own write already replaced both. Edit 2's write replaced edit 1's region and was captured; edit 3's write then replaced edit 2's; edit 1's late note now finds its own text gone and no single own write on the disk that names it as replaced, so the capture is `overwritten` and the next note names it "lost" -- a false alarm, because the tool never wrote. Attributing it needs the chain of own writes since the capture, which the module does not keep: one capture per file, no write history. The report direction is the safe one (the agent re-reads a file that holds every edit it owes), and rows 18, 21, 27 and 28 -- the shapes pi's in-order delivery produces -- are quiet (SiblingRestoreOverlap).
CONSTANTS
    SEdits = 3
    SReplacer = 2
    SReplaced = 1
    SConcurrent = TRUE
    SInOrderNotes = FALSE
    SAtomic = TRUE
    SRestore = TRUE
    SettleCapture = TRUE
    RestoreRecheck = TRUE
    RestoreQueue = TRUE
    SCallInRun = TRUE
    CarryPreRunCalls = TRUE
    RestoreNoCapInFlight = TRUE
    KeepCaptureHistory = TRUE
    RestoreInFlight = TRUE
    TargetHold = FALSE
    RestoreGatesHold = FALSE
    LspMulti = FALSE
SPECIFICATION Spec
INVARIANTS NoSilentLoss NoFalseAlarm NoFalseAlarmUntouched
CHECK_DEADLOCK FALSE
