CONSTANTS
    SEdits = 2
    SReplacer = 0
    SReplaced = 0
    SConcurrent = FALSE
    SInOrderNotes = FALSE
    SAtomic = FALSE
    SRestore = TRUE
    SettleCapture = FALSE
    RestoreRecheck = TRUE
    RestoreQueue = FALSE
    SCallInRun = FALSE
    KeepCaptureHistory = FALSE
    CarryPreRunCalls = FALSE
    RestoreNoCapInFlight = FALSE
    RestoreInFlight = TRUE
    TargetHold = FALSE
    RestoreGatesHold = FALSE
    LspMulti = FALSE
SPECIFICATION Spec
INVARIANTS NoSilentLoss NoRestoreOverNewer EveryEditSurvives
CHECK_DEADLOCK FALSE
