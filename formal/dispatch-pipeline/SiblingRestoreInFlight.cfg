\* expect: violated NoSilentLoss
\* module: SiblingRestore
\* Merged behaviour, finding: an agent edit whose tool_result has not arrived when the tool exits has no capture, and settle skips a file with no capture before it looks at the in-flight set, so the tool's erasure is neither restored nor reported.
CONSTANTS
    SEdits = 1
    SConcurrent = TRUE
    SAtomic = FALSE
    SRestore = TRUE
    SettleCapture = FALSE
    RestoreRecheck = TRUE
    RestoreQueue = FALSE
    SCallInRun = FALSE
    RestoreNoCapInFlight = FALSE
    RestoreInFlight = TRUE
SPECIFICATION Spec
INVARIANTS NoSilentLoss
CHECK_DEADLOCK FALSE
