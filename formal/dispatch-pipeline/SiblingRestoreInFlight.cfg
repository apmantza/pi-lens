    SEdits = 1
    SReplacer = 0
    SReplaced = 0
    SConcurrent = TRUE
    SInOrderNotes = FALSE
    SAtomic = FALSE
    SRestore = TRUE
    SettleCapture = FALSE
    RestoreRecheck = TRUE
    RestoreQueue = FALSE
    SCallInRun = TRUE
    KeepCaptureHistory = FALSE
    CarryPreRunCalls = FALSE
    RestoreNoCapInFlight = TRUE
    RestoreInFlight = TRUE
    TargetHold = FALSE
    RestoreGatesHold = FALSE
    LspMulti = FALSE
SPECIFICATION Spec
INVARIANTS NoSilentLoss
CHECK_DEADLOCK FALSE
