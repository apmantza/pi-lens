\* expect: violated HoldFencedToSession
\* module: TurnEndDeliveryHolds
\* The pre-round-2 park key of #4112: a lane is named for the part alone, so a
\* concurrent subagent turn on the shared runtime takes the primary session's
\* parked items and shows them (runtime-turn.ts carryLane).
CONSTANTS
    CapChars = 2
    Sep = 1
    SizeSet = {1, 3}
    MaxTurns = 2
    MaxGen = 2
    RearmMax = 1
    PeekCommit = "atCap"
    DrainAsk = "asked"
    ReOffer = "once"
    ParkKey = "lane"
    Lead = "leads"
    Recheck = "checked"
    Fence = "checked"
    OnReached = "none"
    DrainFence = "access"
SPECIFICATION Spec
INVARIANTS TypeOK NoLossByCap NoDoubleDelivery NoPin HoldFencedToSession
CHECK_DEADLOCK FALSE
