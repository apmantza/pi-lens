\* expect: violated NoLossByCap
\* module: TurnEndDeliveryHolds
\* The producer commits its state when it composes, before the cap runs (the
\* pre-#3813 shape: a latch, a retirement or a delivery counter marked at
\* compose time). A part the cap cuts is gone while its text never reached the
\* agent.
CONSTANTS
    CapChars = 2
    Sep = 1
    SizeSet = {1, 3}
    MaxTurns = 2
    MaxGen = 2
    RearmMax = 1
    PeekCommit = "atCompose"
    DrainAsk = "asked"
    ReOffer = "once"
    ParkKey = "session"
    Lead = "leads"
    Recheck = "checked"
    Fence = "checked"
    OnReached = "none"
    DrainFence = "access"
SPECIFICATION Spec
INVARIANTS TypeOK NoLossByCap NoDoubleDelivery NoPin HoldFencedToSession
CHECK_DEADLOCK FALSE
