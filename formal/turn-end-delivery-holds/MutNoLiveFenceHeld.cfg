\* expect: violated HoldFencedToSession
\* module: TurnEndDeliveryHolds
\* Mutant: the isCurrentSession skip guards the delivered branch only, so
\* onHeld (restore, park) still runs after a session replacement and writes
\* the old generation into the new session's store.
CONSTANTS
    CapChars = 2
    Sep = 1
    SizeSet = {1, 3}
    MaxTurns = 2
    MaxGen = 2
    RearmMax = 1
    PeekCommit = "atCap"
    DrainAsk = "asked"
    ReOffer = "once"
    ParkKey = "session"
    Lead = "leads"
    Recheck = "checked"
    Fence = "heldOnly"
    OnReached = "none"
    DrainFence = "access"
SPECIFICATION Spec
INVARIANTS TypeOK NoLossByCap NoDoubleDelivery NoPin HoldFencedToSession
CHECK_DEADLOCK FALSE
