\* expect: violated NoStrand
\* module: TurnEndDeliveryHolds
\* Pre-#4161: handleTurnEnd captures the scope at entry and only Settle
\* checks it. A session replaced between Start and Compose leaves the old
\* turn draining the successor's item; the cap cuts it and the skipped
\* Settle restores nothing, so the item is stranded (REVIEW_4155 F1).
CONSTANTS
    CapChars = 2
    Sep = 1
    SizeSet = {1, 3}
    MaxTurns = 2
    MaxGen = 2
    RearmMax = 1
    PeekCommit = "atCap"
    DrainAsk = "asked"
    ReOffer = "once"
    ParkKey = "session"
    Lead = "leads"
    Recheck = "checked"
    Fence = "checked"
    OnReached = "none"
    DrainFence = "entry"
SPECIFICATION Spec
INVARIANTS TypeOK NoLossByCap NoDoubleDelivery NoPin HoldFencedToSession NoStrand
CHECK_DEADLOCK FALSE
