\* expect: pass
\* module: TurnEndDeliveryHolds
\* Merged master (#3813 r1-r2, #3900, #3901, #4112, #4161): holds are judged per part
\* against what the cap kept, settle once after it, are fenced to the session,
\* every cut part stays pending or is dropped with a record, and a turn whose
\* session was replaced after its Start drains nothing.
CONSTANTS
    CapChars = 2
    Sep = 1
    SizeSet = {1, 3}
    MaxTurns = 2
    MaxGen = 2
    RearmMax = 1
    PeekCommit = "atCap"
    DrainAsk = "asked"
    ReOffer = "once"
    ParkKey = "session"
    Lead = "leads"
    Recheck = "checked"
    Fence = "checked"
    OnReached = "none"
    DrainFence = "access"
SPECIFICATION Spec
INVARIANTS TypeOK NoLossByCap NoDoubleDelivery NoPin HoldFencedToSession NoStrand
CHECK_DEADLOCK FALSE
