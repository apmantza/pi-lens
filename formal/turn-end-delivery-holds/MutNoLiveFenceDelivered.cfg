\* expect: violated HoldFencedToSession
\* module: TurnEndDeliveryHolds
\* Mutant: the isCurrentSession skip guards the held branch only, so
\* onDelivered (retire past-EOF, bump the drift count) still runs after a
\* session replacement and writes the new session's store.
CONSTANTS
    CapChars = 2
    Sep = 1
    SizeSet = {1, 3}
    MaxTurns = 2
    MaxGen = 2
    RearmMax = 1
    PeekCommit = "atCap"
    DrainAsk = "asked"
    ReOffer = "once"
    ParkKey = "session"
    Lead = "leads"
    Recheck = "checked"
    Fence = "reachedOnly"
    OnReached = "none"
    DrainFence = "access"
SPECIFICATION Spec
INVARIANTS TypeOK NoLossByCap NoDoubleDelivery NoPin HoldFencedToSession
CHECK_DEADLOCK FALSE
