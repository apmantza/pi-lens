\* expect: violated NoPin
\* module: TurnEndDeliveryHolds
\* A re-offered park item is held again (no canHold on a part that shows only
\* re-offers, runtime-turn.ts cutAdvisoryHold). A cut re-offer is parked a second time,
\* so a trailing oversize part rides every turn.
CONSTANTS
    CapChars = 2
    Sep = 1
    SizeSet = {1, 3}
    MaxTurns = 2
    MaxGen = 2
    RearmMax = 1
    PeekCommit = "atCap"
    DrainAsk = "asked"
    ReOffer = "unbounded"
    ParkKey = "session"
    Lead = "leads"
    Recheck = "checked"
    Fence = "checked"
    OnReached = "none"
    DrainFence = "access"
SPECIFICATION Spec
INVARIANTS TypeOK NoLossByCap NoDoubleDelivery NoPin HoldFencedToSession
CHECK_DEADLOCK FALSE
