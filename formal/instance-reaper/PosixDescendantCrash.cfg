\* expect: violated OrphanReachable
\* module: InstanceReaper
\* #5733, the accepted residual, POSIX. With the fix, a host SIGKILLed after
\* its leader exited but before the ladder's end leaves the group in no
\* record the reaper can act on: the reaper signals only a live leader pid,
\* and the group's leader is gone. Trace: Spawn, LeaderExit, Crash.
CONSTANTS
    Pids = {0, 1, 2, 3}
    Insts = {A, B}
    Mcp = {}
    Crashable = {A}
    NoKids = {}
    MaxBirth = 5
    Reapers = {r1}
    Backstops = {b1}
    Posix = TRUE
    PidReuse = FALSE
    OtherProcs = FALSE
    RecCmd = "node"
    LateRecord = FALSE
    FootprintPrune = FALSE
    ScanFail = FALSE
    StalePrune = FALSE
    Guards = {"parentDead", "identity", "ppid", "tracked", "lock"}
    FixParts = {"birth", "recheck", "tag", "ledger", "confirm"}
    Stubborn = TRUE
    Descendant = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongKill OrphanReachable
CHECK_DEADLOCK FALSE
