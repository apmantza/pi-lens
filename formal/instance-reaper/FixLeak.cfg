\* expect: pass
\* module: InstanceReaper
\* The fix (birth, recheck, tag): leak bound on POSIX under every
\* trace-losing path (health prune, failed identity query, stale entry, crash
\* before the record lands, a new instance on a dead instance's pid).
CONSTANTS
    Pids = {0, 1, 2, 3}
    Insts = {A, B}
    Mcp = {}
    Crashable = {A, B}
    NoKids = {}
    MaxBirth = 4
    Reapers = {r1}
    Backstops = {b1}
    Posix = TRUE
    PidReuse = TRUE
    OtherProcs = FALSE
    RecCmd = "ts"
    LateRecord = TRUE
    FootprintPrune = TRUE
    ScanFail = TRUE
    StalePrune = TRUE
    Guards = {"parentDead", "identity", "ppid", "tracked", "lock"}
    FixParts = {"birth", "recheck", "tag"}
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongKill OrphanReachable
CHECK_DEADLOCK FALSE
