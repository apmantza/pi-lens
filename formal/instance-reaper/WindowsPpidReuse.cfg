\* expect: pass
\* module: InstanceReaper
\* #3539, fixed code on Windows. Before the fix this violated OrphanReachable:
\* after the trace was lost, the dead host's pid was reused, and the backstop read
\* the orphan's ppid as alive.
CONSTANTS
    Pids = {0, 1, 2, 3}
    Insts = {A, B}
    Mcp = {}
    Crashable = {A}
    NoKids = {}
    MaxBirth = 5
    Reapers = {r1}
    Backstops = {b1}
    Posix = FALSE
    PidReuse = TRUE
    OtherProcs = TRUE
    RecCmd = "ts"
    LateRecord = FALSE
    FootprintPrune = TRUE
    ScanFail = FALSE
    StalePrune = FALSE
    Guards = {"parentDead", "identity", "ppid", "tracked", "lock"}
    FixParts = {"birth", "recheck", "tag"}
SPECIFICATION Spec
INVARIANTS TypeOK OrphanReachable
CHECK_DEADLOCK FALSE
