\* expect: pass
\* module: InstanceReaper
\* #3539, fixed code on POSIX. Before the fix this violated OrphanReachable: a
\* new instance started on a crashed instance's pid, adopted its lspChildren, and
\* removed them unkilled at its clean shutdown.
CONSTANTS
    Pids = {0, 1, 2, 3}
    Insts = {A, B}
    Mcp = {}
    Crashable = {A}
    NoKids = {}
    MaxBirth = 5
    Reapers = {r1}
    Backstops = {b1}
    Posix = TRUE
    PidReuse = TRUE
    OtherProcs = FALSE
    RecCmd = "ts"
    LateRecord = FALSE
    FootprintPrune = FALSE
    ScanFail = FALSE
    StalePrune = FALSE
    Guards = {"parentDead", "identity", "ppid", "tracked", "lock"}
    FixParts = {"birth", "recheck", "tag"}
SPECIFICATION Spec
INVARIANTS TypeOK OrphanReachable
CHECK_DEADLOCK FALSE
