\* expect: pass
\* module: InstanceReaper
\* #5699, the exit ledger, POSIX. A quitting host keeps its entry while it
\* holds children and SIGKILLs them at exit before dropping it, so a host
\* killed mid-quit leaves the entry the next sweep reaps from. Same scenario
\* as PosixQuitStubborn, which violated OrphanReachable before.
CONSTANTS
    Pids = {0, 1, 2, 3}
    Insts = {A, B}
    Mcp = {}
    Crashable = {A}
    NoKids = {}
    MaxBirth = 5
    Reapers = {r1}
    Backstops = {b1}
    Posix = TRUE
    PidReuse = FALSE
    OtherProcs = FALSE
    RecCmd = "node"
    LateRecord = FALSE
    FootprintPrune = FALSE
    ScanFail = FALSE
    StalePrune = FALSE
    Guards = {"parentDead", "identity", "ppid", "tracked", "lock"}
    FixParts = {"birth", "recheck", "tag", "ledger"}
    Stubborn = TRUE
    Descendant = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongKill OrphanReachable
CHECK_DEADLOCK FALSE
