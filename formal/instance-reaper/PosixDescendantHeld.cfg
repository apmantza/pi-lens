    MaxBirth = 5
    Reapers = {r1}
    Backstops = {b1}
    Posix = TRUE
    PidReuse = FALSE
    OtherProcs = FALSE
    RecCmd = "node"
    LateRecord = FALSE
    FootprintPrune = FALSE
    ScanFail = FALSE
    StalePrune = FALSE
    Guards = {"parentDead", "identity", "ppid", "tracked", "lock"}
    FixParts = {"birth", "recheck", "tag", "ledger"}
    Stubborn = TRUE
    Descendant = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongKill OrphanReachable
CHECK_DEADLOCK FALSE
