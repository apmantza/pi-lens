    Pids = {0, 1, 2, 3}
    Insts = {A, B}
    Mcp = {}
    Crashable = {A, B}
    NoKids = {}
    MaxBirth = 4
    Reapers = {r1, r2}
    Backstops = {b1}
    Posix = FALSE
    PidReuse = FALSE
    OtherProcs = TRUE
    RecCmd = "ts"
    LateRecord = TRUE
    FootprintPrune = TRUE
    ScanFail = TRUE
    StalePrune = TRUE
    Guards = {"parentDead", "identity", "ppid", "tracked", "lock"}
    FixParts = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongKill
CHECK_DEADLOCK FALSE
