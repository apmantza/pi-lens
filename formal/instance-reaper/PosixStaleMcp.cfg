\* expect: pass
\* module: InstanceReaper
\* #3539, fixed code on POSIX. Before the fix this violated OrphanReachable:
\* an MCP host never heartbeats, a sweep dropped its entry as stale, then the MCP
\* host died.
CONSTANTS
    Pids = {0, 1, 2, 3}
    Insts = {A, B}
    Mcp = {A}
    Crashable = {A}
    NoKids = {}
    MaxBirth = 5
    Reapers = {r1}
    Backstops = {b1}
    Posix = TRUE
    PidReuse = FALSE
    OtherProcs = FALSE
    RecCmd = "ts"
    LateRecord = FALSE
    FootprintPrune = FALSE
    ScanFail = FALSE
    StalePrune = TRUE
    Guards = {"parentDead", "identity", "ppid", "tracked", "lock"}
    FixParts = {"birth", "recheck", "tag"}
SPECIFICATION Spec
INVARIANTS TypeOK OrphanReachable
CHECK_DEADLOCK FALSE
