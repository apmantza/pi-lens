\* expect: pass
\* module: InstanceReaper
\* The fix (birth, recheck, tag): kill safety under pid reuse, unrelated
\* processes on reused pids, the "node" recorded command, both instances crashable.
CONSTANTS
    Pids = {0, 1, 2, 3}
    Insts = {A, B}
    Mcp = {}
    Crashable = {A, B}
    NoKids = {}
    MaxBirth = 4
    Reapers = {r1}
    Backstops = {b1}
    Posix = FALSE
    PidReuse = TRUE
    OtherProcs = TRUE
    RecCmd = "node"
    LateRecord = TRUE
    FootprintPrune = TRUE
    ScanFail = FALSE
    StalePrune = FALSE
    Guards = {"parentDead", "identity", "ppid", "tracked", "lock"}
    FixParts = {"birth", "recheck", "tag"}
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongKill
CHECK_DEADLOCK FALSE
