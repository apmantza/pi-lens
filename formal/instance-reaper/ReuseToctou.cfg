\* expect: pass
\* module: InstanceReaper
\* #3538, fixed code (start time, re-check, owner tag). Before the fix
\* (FixParts={}) this violated NoWrongKill: the sweep verified identity, then
\* killed later by pid, and between the two the orphan exited and its pid went to
\* a live pi-lens host.
CONSTANTS
    Pids = {0, 1, 2, 3}
    Insts = {A, B}
    Mcp = {}
    Crashable = {A}
    NoKids = {}
    MaxBirth = 5
    Reapers = {r1}
    Backstops = {}
    Posix = FALSE
    PidReuse = TRUE
    OtherProcs = FALSE
    RecCmd = "ts"
    LateRecord = FALSE
    FootprintPrune = FALSE
    ScanFail = FALSE
    StalePrune = FALSE
    Guards = {"parentDead", "identity", "ppid", "tracked", "lock"}
    FixParts = {"birth", "recheck", "tag"}
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongKill
CHECK_DEADLOCK FALSE
