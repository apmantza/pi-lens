\* expect: pass
\* module: InstanceReaper
\* #3538, fixed code. With the re-check alone (FixParts={"recheck"}) this
\* violated NoWrongKill: the dead instance's child pid was already a live
\* instance's typescript-language-server when the sweep looked, and the basename
\* check accepted it.
CONSTANTS
    Pids = {0, 1, 2, 3}
    Insts = {A, B}
    Mcp = {}
    Crashable = {A}
    NoKids = {}
    MaxBirth = 5
    Reapers = {r1}
    Backstops = {}
    Posix = FALSE
    PidReuse = TRUE
    OtherProcs = FALSE
    RecCmd = "ts"
    LateRecord = FALSE
    FootprintPrune = FALSE
    ScanFail = FALSE
    StalePrune = FALSE
    Guards = {"parentDead", "identity", "ppid", "tracked", "lock"}
    FixParts = {"birth", "recheck", "tag"}
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongKill
CHECK_DEADLOCK FALSE
