CONSTANTS
    QuietWindow = TRUE
    ResetClears = TRUE
    Dedupe = TRUE
    ToolDrift = TRUE
    Strays = TRUE
    Overflow = FALSE
    FixParts = {"settle","reconcile","reconcileTaskCapture","admission","stray"}
SPECIFICATION Spec
INVARIANTS TypeOK NoDropFreshTouch
CHECK_DEADLOCK FALSE
