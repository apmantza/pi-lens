\* expect: pass
\* module: SessionStraddle
\* Re-baselined shipped code (F1 of #3803, #3611): the scope is retired at session_shutdown, so a session-1 settle or reconcile that finishes between the shutdown and the reset is dropped by its guard instead of left to the reset's clear, and session 2's own touch survives.
CONSTANTS
    QuietWindow = TRUE
    ResetClears = TRUE
    Dedupe = TRUE
    ToolDrift = FALSE
    Strays = FALSE
    Overflow = FALSE
    LateAdmit = FALSE
    EarlyAbandon = FALSE
    FixParts = {"settle","reconcile","reconcileTaskCapture","admission","stray","retireAtShutdown","watchWindow"}
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoDropFreshTouch NoWriteBetween
CHECK_DEADLOCK FALSE
