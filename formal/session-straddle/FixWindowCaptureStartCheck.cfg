\* expect: pass
\* module: SessionStraddle
\* Round-1 design: window-start capture plus a stand-down before the drain. It passes because the model has no clock; its cost (session 2's touch waits for a later window and expires after 15 minutes) is pinned by the replay test instead.
CONSTANTS
    QuietWindow = TRUE
    ResetClears = TRUE
    Dedupe = TRUE
    ToolDrift = FALSE
    Strays = FALSE
    Overflow = FALSE
    FixParts = {"settle","reconcile","reconcileStart"}
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoCrossSessionDelivery NoDropFreshTouch
CHECK_DEADLOCK FALSE
