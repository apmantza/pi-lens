\* expect: pass
\* module: SessionStraddle
\* Alternative, not a mutant: the reconcile captures at task start. With the registry cleared at the reset, a late capture drains only touches recorded since and delivers them for the current session.
CONSTANTS
    QuietWindow = TRUE
    ResetClears = TRUE
    Dedupe = TRUE
    ToolDrift = FALSE
    Strays = FALSE
    FixParts = {"settle","reconcile","reconcileStart","reconcileLate"}
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoCrossSessionDelivery NoDropFreshTouch
CHECK_DEADLOCK FALSE
