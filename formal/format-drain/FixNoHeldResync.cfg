    MaxOps = 4
    MaxTurns = 2
    MaxSessions = 2
    ExtWrites = 0
    Overlap = TRUE
    Orphan = TRUE
    MtimeAuthored = FALSE
    ResetClearsGuard = TRUE
    FixQueue = TRUE
    FixQueueHold = TRUE
    FixGen = TRUE
    GenDropsAll = FALSE
    FixStamp = TRUE
    LspGen = TRUE
    StartGen = TRUE
    FixOrphanSync = TRUE
    IdleRetire = FALSE
    ServiceGen = TRUE
    HeldResync = FALSE
    EnterAfterResolve = TRUE
    OrphanSyncBound = TRUE
    OrphanLateSync = TRUE
    InBand = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoLostEdit HonestFormatClaim LspMatchesDisk NoBlindAllow NoCrossSessionWrite NoOwnDrop NoDrainRespawn
CHECK_DEADLOCK FALSE
