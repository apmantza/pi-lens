\* expect: violated LspMatchesDisk
\* module: FormatDrain
\* Mutant of Fix without the start check and without the #3576 R1 held resync: after /new the old drain still starts formatting a file the new session has open in its LSP, and its skipped sync leaves that document behind the disk. With HeldResync the held resync covers this LSP consequence.
CONSTANTS
    Edits = 2
    MaxOps = 4
    MaxTurns = 2
    MaxSessions = 2
    ExtWrites = 0
    Overlap = TRUE
    Orphan = TRUE
    MtimeAuthored = FALSE
    ResetClearsGuard = TRUE
    FixQueue = TRUE
    FixQueueHold = TRUE
    FixGen = TRUE
    GenDropsAll = FALSE
    FixStamp = TRUE
    LspGen = TRUE
    StartGen = FALSE
    FixOrphanSync = TRUE
    IdleRetire = FALSE
    ServiceGen = TRUE
    HeldResync = FALSE
    EnterAfterResolve = TRUE
    OrphanSyncBound = TRUE
    OrphanLateSync = TRUE
    InBand = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoLostEdit HonestFormatClaim LspMatchesDisk NoBlindAllow NoCrossSessionWrite NoOwnDrop
CHECK_DEADLOCK FALSE
