\* expect: violated LspMatchesDisk
\* module: FormatDrain
\* All fix parts except OrphanLateSync (the code merged in #3728): an abandoned formatter's late write leaves the LSP behind the disk; #3828.
CONSTANTS
    Edits = 2
    MaxOps = 4
    MaxTurns = 2
    MaxSessions = 2
    ExtWrites = 0
    Overlap = TRUE
    Orphan = TRUE
    MtimeAuthored = FALSE
    ResetClearsGuard = TRUE
    FixQueue = TRUE
    FixQueueHold = TRUE
    FixGen = TRUE
    GenDropsAll = FALSE
    FixStamp = TRUE
    LspGen = TRUE
    StartGen = TRUE
    FixOrphanSync = TRUE
    IdleRetire = TRUE
    ServiceGen = TRUE
    HeldResync = TRUE
    EnterAfterResolve = TRUE
    OrphanSyncBound = TRUE
    OrphanLateSync = FALSE
    InBand = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoLostEdit HonestFormatClaim LspMatchesDisk NoBlindAllow NoCrossSessionWrite NoOwnDrop NoDrainRespawn NoInstallHold
CHECK_DEADLOCK FALSE
