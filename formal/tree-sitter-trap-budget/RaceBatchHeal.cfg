\* expect: pass
\* module: TreeSitterTrapBudget
\* #3834, the heal-drop as the ONLY defence. Coalesce is off, so MaxPend = 2
\* admits two same-key builds and a third BatchCheck can cache the charged
\* null while one is in flight. BatchHealDrop alone holds NoCachedTransient:
\* the late build that heals its own charged batch key drops that null.
\* Turning BatchHealDrop off too is Mut3834BatchRace, which violates.
CONSTANTS
    Files = {"fa", "fb"}
    Contents = {"c1", "c2"}
    Consumers = {"rg"}
    Swallowers = {}
    Owners = {}
    Budget = 3
    MaxHeap = 3
    MaxPend = 2
    PoisonCandidates = {}
    Flaky = FALSE
    EnableFiles = FALSE
    EnableExt = FALSE
    EnableBatch = TRUE
    EnableRaw = FALSE
    Classify = TRUE
    KeyInputs = TRUE
    Decay = TRUE
    KeyExtractor = TRUE
    ParseNoCaller = TRUE
    ConsumeSharedKey = TRUE
    OwnHealOnly = TRUE
    FullIdentity = TRUE
    GuardF1 = TRUE
    KeyBatch = TRUE
    CacheGuard = TRUE
    DistinctBatchKeys = TRUE
    Coalesce = FALSE
    BatchHealDrop = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK Contained BudgetOnEvidence NoKeyLeak DecayOnOwnSuccess NoRunWhenCharged NoCachedTransient
CHECK_DEADLOCK FALSE
