\* expect: pass
\* module: TreeSitterTrapBudget
\* #3834, the coalescer as the ONLY defence. BatchHealDrop is off, so a trapped
\* build that heals its own charged batch key leaves the cache alone. Coalesce
\* alone holds NoCachedTransient: with one same-key build admitted at a time,
\* the BatchCheck slot is "none" for that build's whole flight, so no concurrent
\* BatchCheck can cache the charged null the heal-drop exists to drop. Turning
\* Coalesce off too is Mut3834BatchRace, which violates.
CONSTANTS
    Files = {"fa", "fb"}
    Contents = {"c1", "c2"}
    Consumers = {"rg"}
    Swallowers = {}
    Owners = {}
    Budget = 3
    MaxHeap = 3
    MaxPend = 2
    PoisonCandidates = {}
    Flaky = FALSE
    EnableFiles = FALSE
    EnableExt = FALSE
    EnableBatch = TRUE
    EnableRaw = FALSE
    Classify = TRUE
    KeyInputs = TRUE
    Decay = TRUE
    KeyExtractor = TRUE
    ParseNoCaller = TRUE
    ConsumeSharedKey = TRUE
    OwnHealOnly = TRUE
    FullIdentity = TRUE
    GuardF1 = TRUE
    KeyBatch = TRUE
    CacheGuard = TRUE
    DistinctBatchKeys = TRUE
    Coalesce = TRUE
    BatchHealDrop = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK Contained BudgetOnEvidence NoKeyLeak DecayOnOwnSuccess NoRunWhenCharged NoCachedTransient
CHECK_DEADLOCK FALSE
