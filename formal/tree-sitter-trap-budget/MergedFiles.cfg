\* expect: pass
\* module: TreeSitterTrapBudget
\* Master: two files (edits can make them share a content), three consumers (one rethrowing, two swallowing that share a label), any subset of four poisoned parse/consume sites, two one-off traps.
CONSTANTS
    Files = {"fa", "fb"}
    Contents = {"c1", "c2"}
    Consumers = {"rg", "rqA", "rqB"}
    Swallowers = {"rqA", "rqB"}
    Owners = {}
    Budget = 3
    MaxHeap = 2
    MaxPend = 1
    PoisonCandidates = {"parse:c1", "consume:c2:rg", "consume:c2:rqA", "consume:c1:rqB"}
    Flaky = FALSE
    EnableFiles = TRUE
    EnableExt = FALSE
    EnableBatch = FALSE
    EnableRaw = FALSE
    Classify = TRUE
    KeyInputs = TRUE
    Decay = TRUE
    KeyExtractor = TRUE
    ParseNoCaller = TRUE
    ConsumeSharedKey = TRUE
    OwnHealOnly = TRUE
    FullIdentity = TRUE
    GuardF1 = TRUE
    KeyBatch = TRUE
    CacheGuard = TRUE
    DistinctBatchKeys = TRUE
    Coalesce = TRUE
    BatchHealDrop = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK Contained BudgetOnEvidence NoKeyLeak DecayOnOwnSuccess NoRunWhenCharged NoCachedTransient
CHECK_DEADLOCK FALSE
