\* expect: violated NoAbort
\* module: GrammarRetirement
\* Mutation: LatchThreshold = 3 (Md). A one-off spends budget first, so the third distinct input is the fourth budget unit and the process aborts before the grammar retires.
CONSTANTS
    Inputs = {"a", "b", "c", "d"}
    Persistent = {"b", "c", "d"}
    LatchThreshold = 3
    Budget = 3
    Decay = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoAbort
CHECK_DEADLOCK FALSE
