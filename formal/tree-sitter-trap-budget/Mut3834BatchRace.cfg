\* expect: violated NoCachedTransient
\* module: TreeSitterTrapBudget
\* #3834 with BOTH batch defences off, the race the issue reports: two builds of
\* one rule set past the batch-key check, two combine traps charge that key, a
\* third BatchCheck caches the charged null, and the late build heals the key
\* without dropping it. The null then outlives the heal, so every scan of that
\* rule set pays the per-rule fallback until the entry is evicted. This config
\* is the non-vacuity witness for RaceBatchHeal and RaceBatchCoalesce: each of
\* those turns one defence back on and passes.
CONSTANTS
    Files = {"fa", "fb"}
    Contents = {"c1", "c2"}
    Consumers = {"rg"}
    Swallowers = {}
    Owners = {}
    Budget = 3
    MaxHeap = 3
    MaxPend = 2
    PoisonCandidates = {}
    Flaky = FALSE
    EnableFiles = FALSE
    EnableExt = FALSE
    EnableBatch = TRUE
    EnableRaw = FALSE
    Classify = TRUE
    KeyInputs = TRUE
    Decay = TRUE
    KeyExtractor = TRUE
    ParseNoCaller = TRUE
    ConsumeSharedKey = TRUE
    OwnHealOnly = TRUE
    FullIdentity = TRUE
    GuardF1 = TRUE
    KeyBatch = TRUE
    CacheGuard = TRUE
    DistinctBatchKeys = TRUE
    Coalesce = FALSE
    BatchHealDrop = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK Contained BudgetOnEvidence NoKeyLeak DecayOnOwnSuccess NoRunWhenCharged NoCachedTransient
CHECK_DEADLOCK FALSE
