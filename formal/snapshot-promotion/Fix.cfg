\* expect: pass
\* module: SnapshotPromotion
\* Candidate fix: sweep skips live pids; admission meta write and promotion are compare-and-set on meta.seq under one lock. Two processes, crash allowed.
CONSTANTS
    Procs = {p1, p2}
    MaxSeq = 3
    MaxSaves = 2
    GenGate = TRUE
    SingleActive = TRUE
    SweepLiveness = TRUE
    PromoteCAS = TRUE
    AdmissionCAS = TRUE
    CASAtomic = TRUE
    AllowCrash = TRUE
    SessionReset = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoSupersededPromotion InProcessLatestWins NoRegression MetaNotBehindBody NoLiveStageLoss
CHECK_DEADLOCK FALSE
