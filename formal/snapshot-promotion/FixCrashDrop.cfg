\* expect: violated NoDrop
\* module: SnapshotPromotion
\* Known residual: a process that dies after its admission raised the meta leaves a seq that refuses a live process's older save until a save at or above it lands.
CONSTANTS
    Procs = {p1, p2}
    MaxSeq = 3
    MaxSaves = 2
    GenGate = TRUE
    SingleActive = TRUE
    SweepLiveness = TRUE
    PromoteCAS = TRUE
    AdmissionCAS = TRUE
    CASAtomic = TRUE
    AllowCrash = TRUE
    SessionReset = FALSE
    RefuseAll = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoSupersededPromotion InProcessLatestWins NoRegression MetaNotBehindBody NoLiveStageLoss NoDrop
CHECK_DEADLOCK FALSE
