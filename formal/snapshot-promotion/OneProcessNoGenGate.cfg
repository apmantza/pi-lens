\* expect: violated NoSupersededPromotion
\* module: SnapshotPromotion
\* Mutant of OneProcess: the generation gate off (setProjectSnapshotGenerationGateForTests(false), ~1502). The queue still orders the final body; the superseded view is promoted transiently.
CONSTANTS
    Procs = {p1}
    MaxSeq = 3
    MaxSaves = 3
    GenGate = FALSE
    SingleActive = TRUE
    SweepLiveness = FALSE
    PromoteCAS = FALSE
    AdmissionCAS = FALSE
    CASAtomic = FALSE
    AllowCrash = FALSE
    SessionReset = FALSE
    RefuseAll = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoSupersededPromotion InProcessLatestWins
CHECK_DEADLOCK FALSE
