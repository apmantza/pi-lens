\* expect: pass
\* module: SnapshotPromotion
\* Two processes: the admission meta write only raises the meta seq, so the meta is never behind the body (#3509; violated MetaNotBehindBody before, with the fix constants FALSE).
CONSTANTS
    Procs = {p1, p2}
    MaxSeq = 2
    MaxSaves = 1
    GenGate = TRUE
    SingleActive = TRUE
    SweepLiveness = TRUE
    PromoteCAS = TRUE
    AdmissionCAS = TRUE
    CASAtomic = TRUE
    AllowCrash = FALSE
    SessionReset = FALSE
    RefuseAll = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK MetaNotBehindBody NoDrop
CHECK_DEADLOCK FALSE
