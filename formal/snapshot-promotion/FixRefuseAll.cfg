\* expect: violated NoDrop
\* module: SnapshotPromotion
\* No-drop witness (review round 1, M1): a promotion that refuses every save passes every other invariant.
CONSTANTS
    Procs = {p1, p2}
    MaxSeq = 3
    MaxSaves = 2
    GenGate = TRUE
    SingleActive = TRUE
    SweepLiveness = TRUE
    PromoteCAS = TRUE
    AdmissionCAS = TRUE
    CASAtomic = TRUE
    AllowCrash = FALSE
    SessionReset = FALSE
    RefuseAll = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoSupersededPromotion InProcessLatestWins NoRegression MetaNotBehindBody NoLiveStageLoss NoDrop
CHECK_DEADLOCK FALSE
