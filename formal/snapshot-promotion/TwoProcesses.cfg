\* expect: pass
\* module: SnapshotPromotion
\* Two processes on one project (pi + MCP server): a slow worker's older view is refused by the promotion compare-and-set under the cache lock (#3509; violated NoRegression before, with the fix constants FALSE).
CONSTANTS
    Procs = {p1, p2}
    MaxSeq = 2
    MaxSaves = 1
    GenGate = TRUE
    SingleActive = TRUE
    SweepLiveness = TRUE
    PromoteCAS = TRUE
    AdmissionCAS = TRUE
    CASAtomic = TRUE
    AllowCrash = FALSE
    SessionReset = FALSE
    RefuseAll = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoRegression NoDrop
CHECK_DEADLOCK FALSE
