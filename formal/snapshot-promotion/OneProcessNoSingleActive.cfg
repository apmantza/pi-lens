\* expect: violated InProcessLatestWins
\* module: SnapshotPromotion
\* Mutant of OneProcess: no one-active-per-key queue (~1867). Equal-seq saves share a generation, so the gate alone cannot order them.
CONSTANTS
    Procs = {p1}
    MaxSeq = 3
    MaxSaves = 3
    GenGate = TRUE
    SingleActive = FALSE
    SweepLiveness = FALSE
    PromoteCAS = FALSE
    AdmissionCAS = FALSE
    CASAtomic = FALSE
    AllowCrash = FALSE
    SessionReset = FALSE
    RefuseAll = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK InProcessLatestWins
CHECK_DEADLOCK FALSE
