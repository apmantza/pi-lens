\* expect: pass
\* module: SnapshotPromotion
\* Two live processes: the second's first-save sweep keeps the first's in-flight stage file, because the sweep skips live pids (#3510; violated NoLiveStageLoss before, with SweepLiveness = FALSE).
CONSTANTS
    Procs = {p1, p2}
    MaxSeq = 1
    MaxSaves = 1
    GenGate = TRUE
    SingleActive = TRUE
    SweepLiveness = TRUE
    PromoteCAS = FALSE
    AdmissionCAS = FALSE
    CASAtomic = FALSE
    AllowCrash = FALSE
    SessionReset = FALSE
    RefuseAll = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoLiveStageLoss
CHECK_DEADLOCK FALSE
