\* expect: violated NoLostEditStrict
\* module: LateScan
\* VERIFY_4120 V2, registered: an in-flight scan that fails or throws drops its
\* entry with the files carried for it (counted once, scan-failed).
CONSTANTS
    Edits = {1, 2, 3}
    MaxSess = 2
    MaxScan = 3
    MaxEnt = 3
    Settle = "checked"
    SettlePoison = "guarded"
    Poison = "current"
    Late = "keep"
    InFlight = "carry"
    CarryRec = "on"
    EntryScope = "session"
    Foreign = "off"
    TakeBackoff = "on"
    Backoff = "both"
    StampAt = "settle"
    Join = "carry"
SPECIFICATION Spec
INVARIANTS TypeOK NoLostEditStrict
CHECK_DEADLOCK FALSE
