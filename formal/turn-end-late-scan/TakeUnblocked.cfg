\* expect: violated NoRespawnWhileStamped
\* module: LateScan
\* The back-off after a take (:2703-2718) gone. A scan outside the lane (lens_diagnostics'
\* fresh fetch, session_start) that dies to a timeout stamps the root while a settled
\* entry waits; the take then starts a vulture on the stamped root (REVIEW_4153 F1).
CONSTANTS
    Edits = {1, 2, 3}
    MaxSess = 2
    MaxScan = 3
    MaxEnt = 3
    Settle = "checked"
    SettlePoison = "guarded"
    Poison = "current"
    Late = "keep"
    InFlight = "carry"
    CarryRec = "on"
    EntryScope = "session"
    Foreign = "off"
    TakeBackoff = "off"
    Backoff = "both"
    StampAt = "settle"
    Join = "carry"
SPECIFICATION Spec
INVARIANTS TypeOK NoRespawnWhileStamped
CHECK_DEADLOCK FALSE
