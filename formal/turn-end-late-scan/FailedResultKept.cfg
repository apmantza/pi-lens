    Late = "keepFailed"
    InFlight = "carry"
    CarryRec = "on"
    EntryScope = "session"
    Foreign = "off"
    TakeBackoff = "on"
    Backoff = "both"
    StampAt = "settle"
    Join = "carry"
SPECIFICATION Spec
INVARIANTS TypeOK NoDeliverFailed
CHECK_DEADLOCK FALSE
