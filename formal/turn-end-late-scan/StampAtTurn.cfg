\* expect: violated NoRespawnWhileStamped
\* module: LateScan
\* Pre-#4117: the mark is the failed row, written only when the scan settled
\* inside the turn, so an abandoned scan that later timed out leaves none.
CONSTANTS
    Edits = {1, 2, 3}
    MaxSess = 2
    MaxScan = 3
    MaxEnt = 3
    Settle = "checked"
    SettlePoison = "guarded"
    Poison = "current"
    Late = "keep"
    InFlight = "carry"
    CarryRec = "on"
    EntryScope = "session"
    Foreign = "off"
    TakeBackoff = "on"
    Backoff = "both"
    StampAt = "turn"
    Join = "carry"
SPECIFICATION Spec
INVARIANTS TypeOK NoRespawnWhileStamped
CHECK_DEADLOCK FALSE
