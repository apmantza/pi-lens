\* expect: pass
\* module: LateScan
\* VERIFY_4120 V1, fixed by #4154: a good row stored meanwhile by another
\* writer (lens_diagnostics, or another pi-lens process on the same project)
\* survives a failed scan, because both writers compare with the row as it
\* is when the scan settled.
CONSTANTS
    Edits = {1, 2, 3}
    MaxSess = 2
    MaxScan = 3
    MaxEnt = 3
    Settle = "checked"
    SettlePoison = "guarded"
    Poison = "current"
    Late = "keep"
    InFlight = "carry"
    CarryRec = "on"
    EntryScope = "session"
    Foreign = "on"
    TakeBackoff = "on"
    Backoff = "both"
    StampAt = "settle"
    Join = "carry"
SPECIFICATION Spec
INVARIANTS TypeOK NoPoison
CHECK_DEADLOCK FALSE
