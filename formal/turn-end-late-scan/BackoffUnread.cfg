\* expect: violated NoRespawnWhileStamped
\* module: LateScan
\* Pre-#4117 reader: turn_end reads only the failed row (:2703), never the
\* client's mark (recentHardFailure, :2707). A scan abandoned at its budget
\* that later timed out leaves the good row in place and is respawned.
CONSTANTS
    Edits = {1, 2, 3}
    MaxSess = 2
    MaxScan = 3
    MaxEnt = 3
    Settle = "checked"
    SettlePoison = "guarded"
    Poison = "current"
    Late = "keep"
    InFlight = "carry"
    CarryRec = "on"
    EntryScope = "session"
    Foreign = "off"
    TakeBackoff = "on"
    Backoff = "row"
    StampAt = "settle"
    Join = "carry"
SPECIFICATION Spec
INVARIANTS TypeOK NoRespawnWhileStamped
CHECK_DEADLOCK FALSE
