\* expect: pass
\* module: LateScan
\* #4154 J1, fixed: after a session replacement the new session's analyze()
\* JOINS the old session's running vulture (single flight). The joined result
\* is parked rather than finished inline, and when it is taken its files join
\* the next scan, so no file is left with only a result that predates it.
CONSTANTS
    Edits = {1, 2, 3}
    MaxSess = 2
    MaxScan = 3
    MaxEnt = 3
    Settle = "checked"
    SettlePoison = "guarded"
    Poison = "current"
    Late = "keep"
    InFlight = "carry"
    CarryRec = "on"
    EntryScope = "session"
    Foreign = "off"
    TakeBackoff = "on"
    Backoff = "both"
    StampAt = "settle"
    Join = "carry"
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleCover
CHECK_DEADLOCK FALSE
