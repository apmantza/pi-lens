\* expect: pass
\* module: LspCrash
\* Mutant lease check, still no false clean: an evicted client is shut down, so its ping fails.
CONSTANTS
    Shape = "C"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 0
    Uptimes = {"early","mid","long"}
    MaxEvicts = 1
    LeaseCheck = FALSE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK NoFalseClean WaitBounded
CHECK_DEADLOCK FALSE
