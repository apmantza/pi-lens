\* expect: violated DerivedIsCurrent
\* module: LspCrash
\* Mutant: a derived write has no generation check (DeriveGuard = FALSE; the code's recordNotifyWriteBackpressure has one since #3584 (b), noteAuxNotifyIssued has none). A touch whose client was demoted writes its facts after the retirement, and the replacement reads them.
CONSTANTS
    Shape = "SS"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 0
    Uptimes = {"early","mid","long"}
    MaxEvicts = 1
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
    DerivedMissPath = "none"
    DerivedMissKinds = {}
    RegStreak = TRUE
    DeriveGuard = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK DerivedIsCurrent
CHECK_DEADLOCK FALSE
