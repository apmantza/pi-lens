\* expect: violated DerivedIsCurrent
\* module: LspCrash
\* Mutant: idle eviction (scheduleIdleEviction, widened by #3622) forgets retireClient's whole derived drop, so the replacement reads its predecessor's EWMA or aux backlog (the streak is also dropped at registration).
CONSTANTS
    Shape = "SS"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 0
    Uptimes = {"early","mid","long"}
    MaxEvicts = 1
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
    DerivedMissPath = "idle"
    DerivedMissKinds = {"ewma","inflight","streak"}
    RegStreak = TRUE
    DeriveGuard = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK DerivedIsCurrent
CHECK_DEADLOCK FALSE
