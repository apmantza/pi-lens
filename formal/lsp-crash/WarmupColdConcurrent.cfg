\* expect: pass
\* module: LspCrash
\* Code (#3502 verify round 2): a warm-up touch and a concurrent touch with a crash; a warm-up whose client died and was replaced while it awaited does not cache the replacement cold.
CONSTANTS
    Shape = "WC"
    Concurrent = TRUE
    Silent = FALSE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK ColdIsCurrent ReadyIsCurrent
CHECK_DEADLOCK FALSE
