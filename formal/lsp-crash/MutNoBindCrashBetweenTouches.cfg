\* expect: violated NoFalseClean
\* module: LspCrash
\* Mutant, the pre-#3501 code (no client identity on the entry): the respawned client's write is debounced away and its silence is confirmed clean.
CONSTANTS
    Shape = "SC"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    ReadyGuard = TRUE
    Fix = "none"
SPECIFICATION Spec
INVARIANTS TypeOK NoFalseClean
CHECK_DEADLOCK FALSE
