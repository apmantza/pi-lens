\* expect: pass
\* module: LspCrash
\* Code since #3672/#3584 with overlapping touches: a touch that lost its client to a retirement still finishes (its derived write is generation-checked) while a concurrent touch spawns the replacement.
CONSTANTS
    Shape = "SS"
    Concurrent = TRUE
    Silent = TRUE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 2
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
    DerivedMissPath = "none"
    DerivedMissKinds = {}
    RegStreak = TRUE
    DeriveGuard = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK DerivedIsCurrent
CHECK_DEADLOCK FALSE
