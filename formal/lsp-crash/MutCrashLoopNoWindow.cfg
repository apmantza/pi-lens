\* expect: violated BoundedCrashLoop
\* module: LspCrash
\* Mutant: without the #1142 windowed trip a server dying after 60s respawns without bound.
CONSTANTS
    Shape = "SSSSS"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 4
    Uptimes = {"mid"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = FALSE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK BoundedCrashLoop
CHECK_DEADLOCK FALSE
