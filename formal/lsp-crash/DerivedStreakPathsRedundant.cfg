\* expect: pass
\* module: LspCrash
\* No path's streak drop is load-bearing while registration drops the streak (forgetReadiness, clients/lsp/index.ts): every retirement path forgets it and DerivedIsCurrent still holds. Pins the claim that the streak has two independent defences.
CONSTANTS
    Shape = "SSS"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 2
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
    DerivedMissPath = "all"
    DerivedMissKinds = {"streak"}
    RegStreak = TRUE
    DeriveGuard = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK DerivedIsCurrent
CHECK_DEADLOCK FALSE
