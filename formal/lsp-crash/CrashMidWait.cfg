\* expect: pass
\* module: LspCrash
\* Code: one collecting touch, the server dies at any step, or is evicted; the wait times out and pingLiveness() on the dead client keeps it inconclusive.
CONSTANTS
    Shape = "C"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 1
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = FALSE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK NoFalseClean WaitBounded NoEvictUnderLease
CHECK_DEADLOCK FALSE
