\* expect: violated ReadyIsCurrent
\* module: LspCrash
\* Mutant, the pre-#3502 code: the dead-client branch keeps demonstratedReady, so the respawned (cold) client inherits the dead one's readiness.
CONSTANTS
    Shape = "CC"
    Concurrent = FALSE
    Silent = FALSE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = FALSE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK ReadyIsCurrent
CHECK_DEADLOCK FALSE
