\* expect: violated NoFalseClean
\* module: LspCrash
\* Alternative fix is not enough: a concurrent touch still in flight on the dead client marks the entry after the detection cleared it.
CONSTANTS
    Shape = "SCC"
    Concurrent = TRUE
    Silent = TRUE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = FALSE
    Fix = "clear"
SPECIFICATION Spec
INVARIANTS TypeOK NoFalseClean
CHECK_DEADLOCK FALSE
