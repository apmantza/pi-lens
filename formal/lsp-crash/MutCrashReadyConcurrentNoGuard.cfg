\* expect: violated ReadyIsCurrent
\* module: LspCrash
\* Mutant: the ready mark without its registered-client check; the dead client's late answer marks the key its replacement now holds.
CONSTANTS
    Shape = "CC"
    Concurrent = TRUE
    Silent = FALSE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = FALSE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK ReadyIsCurrent
CHECK_DEADLOCK FALSE
