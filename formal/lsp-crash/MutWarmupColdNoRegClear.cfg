\* expect: violated ColdIsCurrent
\* module: LspCrash
\* Mutant: registration keeps the no-client cold verdict, so the first client that spawns inherits it.
CONSTANTS
    Shape = "CWC"
    Concurrent = FALSE
    Silent = FALSE
    MaxCrashes = 1
    Uptimes = {"early"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = FALSE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK ColdIsCurrent
CHECK_DEADLOCK FALSE
