\* expect: pass
\* module: LspCrash
\* Code (#3501): concurrent touches with a crash and an eviction; an entry is valid only for the client instance whose write marked it.
CONSTANTS
    Shape = "SCC"
    Concurrent = TRUE
    Silent = TRUE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 1
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK NoFalseClean SkipImpliesHeld WaitBounded BoundedCrashLoop NoEvictUnderLease
CHECK_DEADLOCK FALSE
