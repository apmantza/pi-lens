\* expect: pass
\* module: LspCrash
\* The #3502 fix with an eviction as well: the dead-client branch deletes demonstratedReady like every other retirement path.
CONSTANTS
    Shape = "CC"
    Concurrent = FALSE
    Silent = FALSE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 1
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK ReadyIsCurrent
CHECK_DEADLOCK FALSE
