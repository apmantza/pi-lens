\* expect: violated ColdIsCurrent
\* module: LspCrash
\* Mutant: the cold cache without its registered-client check; the replacement is cached cold for its predecessor's failed warm-up.
CONSTANTS
    Shape = "WC"
    Concurrent = TRUE
    Silent = FALSE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = FALSE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK ColdIsCurrent
CHECK_DEADLOCK FALSE
