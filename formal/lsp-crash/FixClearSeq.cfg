\* expect: pass
\* module: LspCrash
\* Alternative fix (delete the entry on dead-client detection and on eviction): enough for sequential touches.
CONSTANTS
    Shape = "SC"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 1
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    ReadyGuard = TRUE
    Fix = "clear"
SPECIFICATION Spec
INVARIANTS TypeOK NoFalseClean SkipImpliesHeld
CHECK_DEADLOCK FALSE
