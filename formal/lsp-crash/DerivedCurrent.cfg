\* expect: pass
\* module: LspCrash
\* Code since #3672/#3584: every retirement path drops the per-generation derived state, so no replacement reads its predecessor's EWMA, aux backlog or timeout streak.
CONSTANTS
    Shape = "SSS"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 2
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
    DerivedMissPath = "none"
    DerivedMissKinds = {}
    RegStreak = TRUE
    DeriveGuard = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK DerivedIsCurrent
CHECK_DEADLOCK FALSE
