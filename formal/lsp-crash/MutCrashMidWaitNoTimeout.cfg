\* expect: violated WaitBounded
\* module: LspCrash
\* Mutant: waitForDiagnostics with no timeout of its own; nothing resolves a waiter when the client dies.
CONSTANTS
    Shape = "C"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = FALSE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK WaitBounded
CHECK_DEADLOCK FALSE
