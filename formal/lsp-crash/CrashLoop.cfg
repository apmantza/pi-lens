\* expect: pass
\* module: LspCrash
\* Code: a server that keeps dying early or mid-life is respawned fewer than Trip times, then latched broken.
CONSTANTS
    Shape = "SSSSS"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 4
    Uptimes = {"early","mid"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK BoundedCrashLoop
CHECK_DEADLOCK FALSE
