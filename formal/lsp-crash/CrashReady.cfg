\* expect: pass
\* module: LspCrash
\* Code (#3502): the dead-client branch deletes demonstratedReady like every other retirement path, so the respawned (cold) client never inherits the dead one's readiness.
CONSTANTS
    Shape = "CC"
    Concurrent = FALSE
    Silent = FALSE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK ReadyIsCurrent
CHECK_DEADLOCK FALSE
