\* expect: violated ReadyIsCurrent
\* module: LspCrash
\* Code: the dead-client branch keeps demonstratedReady, so the respawned (cold) client inherits the dead one's readiness (#3502).
CONSTANTS
    Shape = "CC"
    Concurrent = FALSE
    Silent = FALSE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = FALSE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK ReadyIsCurrent
CHECK_DEADLOCK FALSE
