\* expect: pass
\* module: LspCrash
\* Code (#3502 review round 1): concurrent collecting touches and a crash; a touch whose client died and was replaced while it awaited does not mark the key ready.
CONSTANTS
    Shape = "CC"
    Concurrent = TRUE
    Silent = FALSE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK ReadyIsCurrent
CHECK_DEADLOCK FALSE
