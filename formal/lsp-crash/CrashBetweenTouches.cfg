\* expect: pass
\* module: LspCrash
\* Code (#3501): the server dies between the lsp_sync touch and the dispatch touch; the respawned client is a different instance, so its write is never debounced away and its silence is never a clean verdict.
CONSTANTS
    Shape = "SC"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = FALSE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK NoFalseClean
CHECK_DEADLOCK FALSE
