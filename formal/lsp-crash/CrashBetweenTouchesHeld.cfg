\* expect: pass
\* module: LspCrash
\* Code (#3501), any server: a touch that skips its write on a live client skips it on the client that holds the document.
CONSTANTS
    Shape = "SC"
    Concurrent = FALSE
    Silent = FALSE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK SkipImpliesHeld
CHECK_DEADLOCK FALSE
