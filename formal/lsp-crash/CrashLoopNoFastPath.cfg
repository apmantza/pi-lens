\* expect: pass
\* module: LspCrash
\* Mutant: without the #1127 consecutive-early breaker the windowed trip (#1142) alone still bounds the loop.
CONSTANTS
    Shape = "SSSSS"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 4
    Uptimes = {"early","mid"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = FALSE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
SPECIFICATION Spec
INVARIANTS TypeOK BoundedCrashLoop
CHECK_DEADLOCK FALSE
