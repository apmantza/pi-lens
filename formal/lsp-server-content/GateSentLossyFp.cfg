\* expect: pass
\* module: ServerContent
\* #4532 gap 9, the arm the fingerprint gate loses: an edit that changes only the middle of a same-length file (LossyFp). The window+fingerprint gate skipped it (MutLossyFp); the sent-content gate compares the content itself, so it is sent. The drift sweep cannot see the edit either, so this config passes only on the gate.
CONSTANTS
    Writes = 1
    Cascade = TRUE
    EqualLength = TRUE
    LossyFp = TRUE
    Debounce = TRUE
    RecentA = TRUE
    MidSweeps = 1
    PriorInFlight = TRUE
    FifoLanding = TRUE
    SweepKey = "both"
    FixCoalesce = TRUE
    FixDrop = TRUE
    ContentGate = "sent"
    MidClose = FALSE
SPECIFICATION Spec
INVARIANTS ServerMatchesDisk SendsMonotone
CHECK_DEADLOCK FALSE
