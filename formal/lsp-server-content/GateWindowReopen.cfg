\* expect: violated ServerMatchesDisk
\* module: ServerContent
\* Non-vacuity for GateSentReopen: the pre-#4532 gate on the same schedule. Its skip reads `recent`, which a didClose does not clear, so the reopen is skipped and the server is left holding nothing for a file on disk.
CONSTANTS
    Writes = 0
    Cascade = TRUE
    EqualLength = TRUE
    LossyFp = FALSE
    Debounce = TRUE
    RecentA = TRUE
    MidSweeps = 1
    PriorInFlight = FALSE
    FifoLanding = TRUE
    SweepKey = "both"
    FixCoalesce = FALSE
    FixDrop = FALSE
    ContentGate = "window"
    MidClose = TRUE
SPECIFICATION Spec
INVARIANTS ServerMatchesDisk
CHECK_DEADLOCK FALSE
