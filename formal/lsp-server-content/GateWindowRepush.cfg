\* expect: pass
\* module: ServerContent
\* #4532 gap 9, the direction the model cannot red: the pre-#4532 gate on identical bytes offered again after the window. It re-pushes them, and a redundant didChange leaves server = disk, so this is an efficiency defect (the server's cached diagnostics are cleared and it does not republish identical bytes) and not a safety one. This config pins that claim; `tests/clients/lsp/touch-debounce-content-gate.test.ts` carries the empirical half by tracing the wire.
CONSTANTS
    Writes = 1
    Cascade = TRUE
    EqualLength = TRUE
    LossyFp = FALSE
    Debounce = TRUE
    RecentA = TRUE
    MidSweeps = 1
    PriorInFlight = FALSE
    FifoLanding = TRUE
    SweepKey = "both"
    FixCoalesce = TRUE
    FixDrop = TRUE
    ContentGate = "window"
    MidClose = FALSE
SPECIFICATION Spec
INVARIANTS ServerMatchesDisk SendsMonotone
CHECK_DEADLOCK FALSE
