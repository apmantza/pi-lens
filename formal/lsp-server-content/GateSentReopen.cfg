\* expect: pass
\* module: ServerContent
\* #4532 gap 9, the reopen direction: a didClose drops the client's content record, so the next touch of the same bytes has no evidence that the server holds them and pushes. The pre-fix window gate skipped it (GateWindowReopen) and left the server with no document at all.
CONSTANTS
    Writes = 0
    Cascade = TRUE
    EqualLength = TRUE
    LossyFp = FALSE
    Debounce = TRUE
    RecentA = TRUE
    MidSweeps = 1
    PriorInFlight = FALSE
    FifoLanding = TRUE
    SweepKey = "both"
    FixCoalesce = FALSE
    FixDrop = FALSE
    ContentGate = "sent"
    MidClose = TRUE
SPECIFICATION Spec
INVARIANTS ServerMatchesDisk
CHECK_DEADLOCK FALSE
