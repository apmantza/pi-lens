\* expect: violated ServerMatchesDisk
\* module: ServerContent
\* Cascade neighbour read races an equal-length agent write; the stale touch lands last and is stamped after the write's mtime (index.ts ~5199), so the sweep never sees it. (#3481)
CONSTANTS
    Writes = 1
    Cascade = TRUE
    EqualLength = TRUE
    LossyFp = FALSE
    Debounce = TRUE
    RecentA = FALSE
    MidSweeps = 1
    PriorInFlight = FALSE
    FifoLanding = TRUE
    SweepKey = "both"
    FixCoalesce = FALSE
    FixDrop = FALSE
SPECIFICATION Spec
INVARIANTS ServerMatchesDisk 
CHECK_DEADLOCK FALSE
