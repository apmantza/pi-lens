\* expect: pass
\* module: ServerContent
\* Cascade neighbour read races an equal-length agent write, after #3481: the stale touch carries its read stamp and the queue drops it (client.ts enqueueDocumentNotify), so the write's content stays on the server.
CONSTANTS
    Writes = 1
    Cascade = TRUE
    EqualLength = TRUE
    LossyFp = FALSE
    Debounce = TRUE
    RecentA = FALSE
    MidSweeps = 1
    PriorInFlight = FALSE
    FifoLanding = TRUE
    SweepKey = "both"
    FixCoalesce = TRUE
    FixDrop = TRUE
SPECIFICATION Spec
INVARIANTS ServerMatchesDisk 
CHECK_DEADLOCK FALSE
