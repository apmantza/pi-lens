\* expect: violated ServerMatchesDisk
\* module: ServerContent
\* Mutation of the new guard: keep reading the client's content record but compare it with Fp, the fingerprint, instead of the content. The same-length middle-only edit then looks already sent (ContentGate = "lossy"), so the touch is skipped and the server keeps A while the disk has B. GateSentLossyFp is the same schedule under the real comparison.
CONSTANTS
    Writes = 1
    Cascade = TRUE
    EqualLength = TRUE
    LossyFp = TRUE
    Debounce = TRUE
    RecentA = TRUE
    MidSweeps = 1
    PriorInFlight = TRUE
    FifoLanding = TRUE
    SweepKey = "both"
    FixCoalesce = TRUE
    FixDrop = TRUE
    ContentGate = "lossy"
    MidClose = FALSE
SPECIFICATION Spec
INVARIANTS ServerMatchesDisk
CHECK_DEADLOCK FALSE
