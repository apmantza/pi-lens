\* expect: pass
\* module: ServerContent
\* #4532 gap 9 as-built: the touch gate reads the client's record of the payload it last sent (ContentGate = "sent"), with one agent write, the cascade neighbour reader, and an earlier notify of A still in flight. The skip is decided by the record, never by the elapsed window, and it sends nothing, so it cannot install stale bytes.
CONSTANTS
    Writes = 1
    Cascade = TRUE
    EqualLength = TRUE
    LossyFp = FALSE
    Debounce = TRUE
    RecentA = TRUE
    MidSweeps = 1
    PriorInFlight = TRUE
    FifoLanding = TRUE
    SweepKey = "both"
    FixCoalesce = TRUE
    FixDrop = TRUE
    ContentGate = "sent"
    MidClose = FALSE
SPECIFICATION Spec
INVARIANTS ServerMatchesDisk SendsMonotone
CHECK_DEADLOCK FALSE
