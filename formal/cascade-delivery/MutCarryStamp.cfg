\* expect: violated NoForgetAfterUnansweredWrite
\* module: CascadeDelivery
\* Mutant (#5812 verify F4, the r2 code shape): the settle restamps a kept
\* record, but the record turn_end builds from a read before pi's unanswered
\* write keeps the read bound (`CheckStamp = "carry"`). It holds only while
\* the worklist brings the write to the next settle; a repeat, a suppressed
\* duplicate or a max-cycles turn_end clears the worklist, and the next turn
\* reads pi's own write as an edit outside pi, names it once and forgets it.
CONSTANTS
    Neighbours = {"n1", "n2"}
    Models = {"Pull", "CmdPull", "Always", "Silent"}
    MaxTurns = 2
    Expiry = 1
    QuietFires = TRUE
    TierPath = "inLane"
    PassiveGate = "afterEdit"
    FallbackGate = "afterEdit"
    RecentlyClean = FALSE
    Delta = "none"
    UnconfirmedMarker = "marked"
    ExpiryRead = "peekLog"
    Reserve = "record"
    PendingGate = "notify"
    CheckStamp = "carry"
    WriteSettle = "answered"
    PiWriteAnswers = {"answered", "unanswered"}
    OutsidePhases = {}
    OutsideKinds = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoForgetAfterUnansweredWrite
CHECK_DEADLOCK FALSE
