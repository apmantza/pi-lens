\* expect: violated NoForgetAfterUnansweredWrite
\* module: CascadeDelivery
\* Mutant (#5804, master): turn_end forgets the record of every pi-written
\* neighbour, answered or not (`forgetCascadePendingNeighbor` for each edited
\* file). A write no language server answered for says nothing about the
\* errors the record holds, so the commit gate admits with them on disk.
CONSTANTS
    Neighbours = {"n1", "n2"}
    Models = {"Pull", "CmdPull", "Always", "Silent"}
    MaxTurns = 2
    Expiry = 1
    QuietFires = TRUE
    TierPath = "inLane"
    PassiveGate = "afterEdit"
    FallbackGate = "afterEdit"
    RecentlyClean = FALSE
    Delta = "none"
    UnconfirmedMarker = "marked"
    ExpiryRead = "peekLog"
    Reserve = "record"
    PendingGate = "notify"
    CheckStamp = "carry"
    WriteSettle = "forget"
    PiWriteAnswers = {"answered", "unanswered"}
    OutsidePhases = {}
    OutsideKinds = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoForgetAfterUnansweredWrite
CHECK_DEADLOCK FALSE
