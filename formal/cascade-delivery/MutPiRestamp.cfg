\* expect: violated NoForgetAfterUnansweredWrite
\* module: CascadeDelivery
\* Mutant (#5804): the unanswered write keeps the record but does not restamp
\* it to turn_end (`CheckStamp = "read"`). The gate then reads pi's own write
\* after the run's read as an edit outside pi, names the record "changed since
\* checked, not re-checked" once, and forgets it.
CONSTANTS
    Neighbours = {"n1", "n2"}
    Models = {"Pull", "CmdPull", "Always", "Silent"}
    MaxTurns = 2
    Expiry = 1
    QuietFires = TRUE
    TierPath = "inLane"
    PassiveGate = "afterEdit"
    FallbackGate = "afterEdit"
    RecentlyClean = FALSE
    Delta = "none"
    UnconfirmedMarker = "marked"
    ExpiryRead = "peekLog"
    Reserve = "record"
    PendingGate = "notify"
    CheckStamp = "read"
    WriteSettle = "answered"
    PiWriteAnswers = {"answered", "unanswered"}
    OutsidePhases = {}
    OutsideKinds = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoForgetAfterUnansweredWrite
CHECK_DEADLOCK FALSE
