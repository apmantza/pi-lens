\* expect: pass
\* module: CascadeDelivery
\* Merged's fix values (#4485, #4486, #4487, #4495) plus #5804: pi itself
\* writes a neighbour after the run's read, with or without a language-server
\* answer. An answered write forgets the neighbour's record (its own dispatch
\* reports the rest); an unanswered one keeps it, and the restamp to turn_end
\* (`CheckStamp = "carry"`) keeps the gate from reading pi's own write as an
\* edit outside pi. Two turns are the record's whole life. Outside changes are
\* off here (`OutsidePhases = {}`): the restamp also covers an outside write
\* that lands before it, which the as-built code accepts as a residual (the
\* "changed since checked" line never fires for it; the record keeps gating).
CONSTANTS
    Neighbours = {"n1", "n2"}
    Models = {"Pull", "CmdPull", "Always", "Silent"}
    MaxTurns = 2
    Expiry = 1
    QuietFires = TRUE
    TierPath = "inLane"
    PassiveGate = "afterEdit"
    FallbackGate = "afterEdit"
    RecentlyClean = FALSE
    Delta = "none"
    UnconfirmedMarker = "marked"
    ExpiryRead = "peekLog"
    Reserve = "record"
    PendingGate = "notify"
    CheckStamp = "carry"
    WriteSettle = "answered"
    PiWriteAnswers = {"answered", "unanswered"}
    OutsidePhases = {}
    OutsideKinds = {}
SPECIFICATION Spec
INVARIANTS TypeOK NoCleanWithoutFreshObs NoErrWithoutFreshObs PersistentReserved TouchEndsWithinBound AnswerWhenAskable ExpiryKeepsAnswer NoUnresolvedAfterChange NoSilentForget NoForgetAfterUnansweredWrite
CHECK_DEADLOCK FALSE
