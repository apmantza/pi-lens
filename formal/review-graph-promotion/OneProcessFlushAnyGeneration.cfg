\* expect: violated NoSupersededPromotion
\* module: ReviewGraphPromotion
\* Mutant of the #3536 fix (the code before it): the flush writes the newest pending or in-flight candidate even after a newer generation promoted, and puts gen 1 over gen 2.
CONSTANTS
    Procs = {p1}
    MaxSeq = 3
    MaxBuilds = 3
    Conc = 1
    GenGate = TRUE
    SweepLiveness = TRUE
    AllowCrash = TRUE
    AllowWorkerDeath = TRUE
    FlushCurrentOnly = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoSupersededPromotion InProcessLatestPersistWins NoLiveStageLoss InProcessViewMonotone NoRegression
CHECK_DEADLOCK FALSE
