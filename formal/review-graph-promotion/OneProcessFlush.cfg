\* expect: pass
\* module: ReviewGraphPromotion
\* The shipped code (#3536), one process, builds serialized: gen 2 promotes while gen 1 is still in the worker; flushReviewGraphPersist (exit hook / CLI) drops gen 1 unwritten.
CONSTANTS
    Procs = {p1}
    MaxSeq = 3
    MaxBuilds = 3
    Conc = 1
    GenGate = TRUE
    SweepLiveness = TRUE
    AllowCrash = TRUE
    AllowWorkerDeath = TRUE
    FlushCurrentOnly = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoSupersededPromotion InProcessLatestPersistWins NoLiveStageLoss InProcessViewMonotone NoRegression
CHECK_DEADLOCK FALSE
