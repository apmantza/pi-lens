\* expect: pass
\* module: ReviewGraphPromotion
\* The #3536 flush fix (write only the current generation), one process, crash and worker death allowed: every in-process guard holds and every persist drains.
CONSTANTS
    Procs = {p1}
    MaxSeq = 3
    MaxBuilds = 3
    Conc = 1
    GenGate = TRUE
    SweepLiveness = TRUE
    AllowCrash = TRUE
    AllowWorkerDeath = TRUE
    FlushCurrentOnly = TRUE
SPECIFICATION FairSpec
INVARIANTS TypeOK NoSupersededPromotion InProcessLatestPersistWins NoLiveStageLoss InProcessViewMonotone NoRegression
PROPERTIES PersistDrains
CHECK_DEADLOCK FALSE
