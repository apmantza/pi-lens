\* expect: pass
\* module: ReviewGraphPromotion
\* The #3536 flush fix, two processes, crash and worker death allowed: the sweep's liveness check keeps a live sibling's stage, and a crash never stops the survivor's persists from draining.
CONSTANTS
    Procs = {p1, p2}
    MaxSeq = 2
    MaxBuilds = 1
    Conc = 1
    GenGate = TRUE
    SweepLiveness = TRUE
    AllowCrash = TRUE
    AllowWorkerDeath = TRUE
    FlushCurrentOnly = TRUE
SPECIFICATION FairSpec
INVARIANTS TypeOK NoSupersededPromotion InProcessLatestPersistWins NoLiveStageLoss
PROPERTIES PersistDrains
CHECK_DEADLOCK FALSE
