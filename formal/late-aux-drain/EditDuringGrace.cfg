    ExternalEdits = 1
    MaxDrains = 3
    MaxRearms = 2
    Tol = 0
    AllowDefer = FALSE
    AllowCancel = FALSE
    PublishedAtCheck = TRUE
    MtimeGate = TRUE
    RefreshOnStale = FALSE
    CountBind = TRUE
    MarkAtNotify = TRUE
    ExtDuringGrace = TRUE
    Refresh = "none"
    RefreshRebaseline = FALSE
    RefreshOvertake = FALSE
    AllowSave = FALSE
    SaveExpect = 1
    Closes = 0
    Carry = "span"
    AllowClosePublish = FALSE
    ClosePublishCounted = FALSE
    ResetClosePublishCredit = FALSE
SPECIFICATION Spec
INVARIANTS NoStaleFindings
CHECK_DEADLOCK FALSE
