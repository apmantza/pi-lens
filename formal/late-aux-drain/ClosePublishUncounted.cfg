\* expect: pass
\* module: LateAuxDrain
\* Fixed (#3548 review r2): the stateless version filter. ClosePublish fires closed or open — including after a reopen, since AgentTouch's reopen branch does not clear closePublishPending — and is filtered (state-transparent) either way: it never touches cache, pubCount or bound, so it cannot free an in-flight scan's stale answer, cannot overwrite a real answer once stored, and cannot satisfy a backlog binding it never sent. NoFreshWithheld is now provable here too (unlike round 1's ClosePublishExempt.cfg, which deliberately excluded it for the credit-sharing ordering race): with no shared state, ClosePublish cannot move bound at all under ClosePublishFiltered, so it cannot manufacture a false "answered" the way the credit could.
CONSTANTS
    AgentTouches = 3
    ExternalEdits = 0
    MaxDrains = 5
    MaxRearms = 2
    Tol = 0
    AllowDefer = TRUE
    AllowCancel = FALSE
    PublishedAtCheck = TRUE
    MtimeGate = TRUE
    RefreshOnStale = FALSE
    CountBind = TRUE
    MarkAtNotify = TRUE
    ExtDuringGrace = FALSE
    Refresh = "none"
    RefreshRebaseline = TRUE
    RefreshOvertake = FALSE
    AllowSave = FALSE
    SaveExpect = 1
    Closes = 1
    Carry = "span"
    AllowClosePublish = TRUE
    ClosePublishFiltered = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleFindings NoFreshWithheld
CHECK_DEADLOCK FALSE
