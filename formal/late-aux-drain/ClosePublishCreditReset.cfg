\* expect: pass
\* module: LateAuxDrain
\* Fixed (#3548 review r1 B1): the credit is cleared at every reopen (client.ts handleNotifyOpenOnce, the same point closedDocuments is), so a second close only ever grants its own — never more than one credit outstanding at once (NoExcessCloseCredit), and NoStaleFindings still holds. NoFreshWithheld is deliberately not checked (see ClosePublishExempt.cfg): the single-close ordering race is independent of this fix and remains an accepted residual either way.
CONSTANTS
    AgentTouches = 3
    ExternalEdits = 0
    MaxDrains = 5
    MaxRearms = 2
    Tol = 0
    AllowDefer = FALSE
    AllowCancel = FALSE
    PublishedAtCheck = TRUE
    MtimeGate = TRUE
    RefreshOnStale = FALSE
    CountBind = TRUE
    MarkAtNotify = TRUE
    ExtDuringGrace = FALSE
    Refresh = "none"
    RefreshRebaseline = TRUE
    RefreshOvertake = FALSE
    AllowSave = FALSE
    SaveExpect = 1
    Closes = 2
    Carry = "span"
    AllowClosePublish = TRUE
    ClosePublishCounted = FALSE
    ResetClosePublishCredit = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleFindings NoExcessCloseCredit
CHECK_DEADLOCK FALSE
