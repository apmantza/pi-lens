\* expect: pass
\* module: LateAuxDrain
\* Fixed (#3548): a publishesOnClose server's own close-triggered publish is never credited toward the closed lifetime's owed scans, so it cannot free an in-flight scan's later (stale) answer to stand in for the reopened file's send. NoFreshWithheld is deliberately NOT checked here (review r1 B1): once the credit is a resource Publish and ClosePublish genuinely share, a real queued scan can win the single credit this close grants, leaving ClosePublish's own contribution pending until it fires — an accepted, reviewed ordering residual ("it cancels out, because the closed branch never stores content"), never a stale delivery. See ClosePublishCreditReset.cfg's NoExcessCloseCredit for what review r1 B1 actually fixed.
CONSTANTS
    AgentTouches = 3
    ExternalEdits = 0
    MaxDrains = 4
    MaxRearms = 2
    Tol = 0
    AllowDefer = TRUE
    AllowCancel = FALSE
    PublishedAtCheck = TRUE
    MtimeGate = TRUE
    RefreshOnStale = FALSE
    CountBind = TRUE
    MarkAtNotify = TRUE
    ExtDuringGrace = FALSE
    Refresh = "none"
    RefreshRebaseline = TRUE
    RefreshOvertake = FALSE
    AllowSave = FALSE
    SaveExpect = 1
    Closes = 1
    Carry = "span"
    AllowClosePublish = TRUE
    ClosePublishCounted = FALSE
    ResetClosePublishCredit = FALSE
SPECIFICATION Spec
INVARIANTS NoStaleFindings
CHECK_DEADLOCK FALSE
