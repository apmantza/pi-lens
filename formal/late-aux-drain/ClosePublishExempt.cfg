\* expect: pass
\* module: LateAuxDrain
\* Fixed (#3548): a publishesOnClose server's own close-triggered publish is never credited toward the closed lifetime's owed scans, so it cannot free an in-flight scan's later (stale) answer to stand in for the reopened file's send.
CONSTANTS
    AgentTouches = 3
    ExternalEdits = 0
    MaxDrains = 4
    MaxRearms = 2
    Tol = 0
    AllowDefer = TRUE
    AllowCancel = FALSE
    PublishedAtCheck = TRUE
    MtimeGate = TRUE
    RefreshOnStale = FALSE
    CountBind = TRUE
    MarkAtNotify = TRUE
    ExtDuringGrace = FALSE
    Refresh = "none"
    RefreshRebaseline = TRUE
    RefreshOvertake = FALSE
    AllowSave = FALSE
    SaveExpect = 1
    Closes = 1
    Carry = "span"
    AllowClosePublish = TRUE
    ClosePublishCounted = FALSE
SPECIFICATION Spec
INVARIANTS NoStaleFindings NoFreshWithheld
CHECK_DEADLOCK FALSE
