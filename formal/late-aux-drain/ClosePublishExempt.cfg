\* expect: violated NoStaleFindings
\* module: LateAuxDrain
\* Before the review r2 fix: the close-triggered publish survives a reopen (AgentTouch's reopen branch never clears closePublishPending) and, unfiltered, falls through to the SAME branch an ordinary Publish would use once ClosePublish fires on the open path — stored with a content-less sentinel `ver = 0` (no real send ever produces it, so any delivery of it is unconditionally stale) and counted toward the backlog. This is PROBE-STALE-EMPTY-OVERWRITES-REAL: the reviewer's proof that round 1's `closed`-gated ClosePublish (and the narrower ClosePublishExempt this file used to model) hid the bug instead of fixing it — ungating it here, unfiltered, is exactly what TLC's own counterexample from that round already found.
CONSTANTS
    AgentTouches = 3
    ExternalEdits = 0
    MaxDrains = 5
    MaxRearms = 2
    Tol = 0
    AllowDefer = TRUE
    AllowCancel = FALSE
    PublishedAtCheck = TRUE
    MtimeGate = TRUE
    RefreshOnStale = FALSE
    CountBind = TRUE
    MarkAtNotify = TRUE
    ExtDuringGrace = FALSE
    Refresh = "none"
    RefreshRebaseline = TRUE
    RefreshOvertake = FALSE
    AllowSave = FALSE
    SaveExpect = 1
    Closes = 1
    Carry = "span"
    AllowClosePublish = TRUE
    ClosePublishFiltered = FALSE
SPECIFICATION Spec
INVARIANTS NoStaleFindings
CHECK_DEADLOCK FALSE
