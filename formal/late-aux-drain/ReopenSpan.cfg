\* expect: pass
\* module: LateAuxDrain
\* Fixed (#3482): the counts span a close and reopen, and a publish dropped while closed counts, so a scan queued before the close answers its own send and a pair marked before the close keeps its frame.
CONSTANTS
    AgentTouches = 3
    ExternalEdits = 0
    MaxDrains = 4
    MaxRearms = 2
    Tol = 0
    AllowDefer = TRUE
    AllowCancel = FALSE
    PublishedAtCheck = TRUE
    MtimeGate = TRUE
    RefreshOnStale = FALSE
    CountBind = TRUE
    MarkAtNotify = TRUE
    ExtDuringGrace = FALSE
    Refresh = "none"
    RefreshRebaseline = TRUE
    RefreshOvertake = FALSE
    AllowSave = FALSE
    SaveExpect = 1
    Closes = 1
    Carry = "span"
    AllowClosePublish = FALSE
    ClosePublishCounted = FALSE
SPECIFICATION Spec
INVARIANTS NoStaleFindings NoFreshWithheld
CHECK_DEADLOCK FALSE
