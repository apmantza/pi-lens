\* expect: violated OneRestartPerInstall
\* module: DiskChangePublisher
\* Mutant: the trailing pass compares against the record the flight started
\* from, not the one the flight left, so two sessions looking after one
\* install restart twice (the looks comment: "two sessions' looks after one
\* install restart once").
CONSTANTS
    Roots = {"a"}
    SinceRoots = {}
    Modes = {"call"}
    Kinds = {"inst"}
    RecCap = 1
    OwedCap = 1
    Calls = 3
    Changes = 1
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = FALSE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
    SessionLookConfigEpoch = TRUE
    SessionLookInstallEpoch = FALSE
SPECIFICATION Spec
INVARIANTS OneRestartPerInstall
CHECK_DEADLOCK FALSE
