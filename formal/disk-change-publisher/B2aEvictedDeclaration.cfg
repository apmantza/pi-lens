\* expect: violated NoLostChange
\* module: DiskChangePublisher
\* B2a, declaration: the epoch a client-root look names rescues an install
\* only. A declaration file changed after the record was evicted is recorded
\* as the new baseline by the first look, whoever calls (a first look has no
\* previous declaration map to diff).
CONSTANTS
    Roots = {"a", "b"}
    SinceRoots = {"a", "b"}
    Modes = {"client"}
    Kinds = {"decl"}
    RecCap = 1
    OwedCap = 2
    Calls = 3
    Changes = 1
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
    SessionLookConfigEpoch = TRUE
    SessionLookInstallEpoch = FALSE
SPECIFICATION Spec
INVARIANTS NoLostChange
CHECK_DEADLOCK FALSE
