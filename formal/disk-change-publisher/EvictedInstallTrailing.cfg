\* expect: violated OneRestartPerInstall
\* module: DiskChangePublisher
\* Greptile r1 (PRRT_kwDORt8rec60hc_X), reproduced on the real code: a second
\* caller joins root a's flight, so the flight earns a trailing pass that runs
\* the FIRST caller's closure, with the `since` epoch it captured at the call
\* (clients/out-of-band-changes.ts: `options` is closed over by `lookOnce`). The
\* first pass publishes the install and restarts a's clients. Before the
\* trailing pass starts, another root's first look makes the FIFO (RecCap = 1)
\* evict a's record. The trailing pass sees no record, takes the first-look
\* branch (`firstLookSawInstall`), compares the install to the OLD epoch, and
\* publishes the same install again: two restarts for one install. Same
\* precondition as B2a: a saturated FIFO (a process that has recorded
\* MAX_ROOTS = 64 roots, a the oldest), then one new root's first look inside
\* a's publish window. A real production defect, not fixed here.
CONSTANTS
    Roots = {"a", "b"}
    SinceRoots = {"a", "b"}
    Modes = {"client"}
    Kinds = {"inst"}
    RecCap = 1
    OwedCap = 2
    Calls = 3
    Changes = 1
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
    SessionLookConfigEpoch = TRUE
    SessionLookInstallEpoch = FALSE
SPECIFICATION Spec
INVARIANTS OneRestartPerInstall
CHECK_DEADLOCK FALSE
