\* expect: pass
\* module: DiskChangePublisher
\* As built, two roots and no eviction pressure (RecCap = OwedCap = 2 =
\* |Roots|): every look caller, an external install or declaration change, an
\* agent edit and one throwing subscriber. I1 to I5, one restart per install,
\* no lost change, every walk demand served.
CONSTANTS
    Roots = {"a", "b"}
    SinceRoots = {"a"}
    Modes = {"call", "result", "client", "diag", "head"}
    Kinds = {"inst", "decl"}
    RecCap = 2
    OwedCap = 2
    Calls = 3
    Changes = 2
    AgentEdits = 1
    Throws = 1
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK I1CommitBeforePublish I2SeqBeforeFanOut I3AwaitedFanOut I4NoAuthorship I5Isolated I5RecordedOnce OneRestartPerInstall NoLostChange DemandServed
CHECK_DEADLOCK FALSE
