    Modes = {"call", "result"}
    Kinds = {"decl"}
    RecCap = 1
    OwedCap = 1
    Calls = 2
    Changes = 1
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = FALSE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
SPECIFICATION Spec
INVARIANTS DemandServed
CHECK_DEADLOCK FALSE
