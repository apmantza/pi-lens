\* expect: violated I5RecordedOnce
\* module: DiskChangePublisher
\* Mutant of I5: a failure is recorded on every occurrence, not once per
\* consumer per root (two publishes of one root, the same consumer throwing).
CONSTANTS
    Roots = {"a"}
    SinceRoots = {}
    Modes = {"call", "result"}
    Kinds = {"decl"}
    RecCap = 1
    OwedCap = 1
    Calls = 4
    Changes = 2
    AgentEdits = 0
    Throws = 2
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = FALSE
SPECIFICATION Spec
INVARIANTS I5RecordedOnce
CHECK_DEADLOCK FALSE
