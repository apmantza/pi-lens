\* expect: violated DemandServed
\* module: DiskChangePublisher
\* An owed walk evicted before its pass takes it (OwedCap = 1, two roots):
\* the bash result's walk demand is gone and the pass walks only if the
\* interval passed. The change is deferred to the next walk, not lost
\* (OwedEvictionKeepsChanges.cfg); this is the owedWalks comment's "an
\* evicted demand only defers the change to the next walk".
CONSTANTS
    Roots = {"a", "b"}
    SinceRoots = {}
    Modes = {"call", "result"}
    Kinds = {"inst", "decl"}
    RecCap = 2
    OwedCap = 1
    Calls = 3
    Changes = 0
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
    SessionLookConfigEpoch = TRUE
    SessionLookInstallEpoch = FALSE
SPECIFICATION Spec
INVARIANTS DemandServed
CHECK_DEADLOCK FALSE
