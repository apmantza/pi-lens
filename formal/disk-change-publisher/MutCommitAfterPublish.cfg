    Roots = {"a"}
    SinceRoots = {}
    Modes = {"call", "result", "client", "diag", "head"}
    Kinds = {"decl"}
    RecCap = 1
    OwedCap = 1
    Calls = 2
    Changes = 1
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = FALSE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
    SessionLookConfigEpoch = TRUE
    SessionLookInstallEpoch = FALSE
SPECIFICATION Spec
INVARIANTS I1CommitBeforePublish
CHECK_DEADLOCK FALSE
