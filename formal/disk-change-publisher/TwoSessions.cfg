\* expect: pass
\* module: DiskChangePublisher
\* Two sessions on one root: five look callers share one flight, one record
\* and one owed set. A joiner earns one trailing pass, which runs the first
\* caller's closure; the install restarts once.
CONSTANTS
    Roots = {"a"}
    SinceRoots = {"a"}
    Modes = {"call", "result", "client", "diag", "head"}
    Kinds = {"inst", "decl"}
    RecCap = 1
    OwedCap = 1
    Calls = 5
    Changes = 2
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
    SessionLookConfigEpoch = TRUE
    SessionLookInstallEpoch = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK I1CommitBeforePublish I2SeqBeforeFanOut I3AwaitedFanOut I4NoAuthorship I5Isolated I5RecordedOnce OneRestartPerInstall NoLostChange DemandServed
CHECK_DEADLOCK FALSE
