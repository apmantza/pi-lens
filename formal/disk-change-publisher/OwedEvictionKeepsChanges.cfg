\* expect: pass
\* module: DiskChangePublisher
\* The owed-walk set evicts a root's walk demand (OwedCap = 1, two roots),
\* and no change is lost: the record keeps the declaration set the walk would
\* have compared, so the next walk publishes it. DemandServed is left out
\* (OwedEvictedDeferred.cfg).
CONSTANTS
    Roots = {"a", "b"}
    SinceRoots = {}
    Modes = {"call", "result"}
    Kinds = {"inst", "decl"}
    RecCap = 2
    OwedCap = 1
    Calls = 3
    Changes = 2
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK I1CommitBeforePublish I2SeqBeforeFanOut I3AwaitedFanOut I4NoAuthorship I5Isolated I5RecordedOnce OneRestartPerInstall NoLostChange
CHECK_DEADLOCK FALSE
