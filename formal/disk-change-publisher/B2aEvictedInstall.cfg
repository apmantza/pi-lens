\* expect: violated NoLostChange
\* module: DiskChangePublisher
\* B2a, install: the FIFO evicts root a's record (RecCap = 1, two roots), an
\* install lands, and a's next look is a first look with no epoch to compare
\* (a session-root look names none), so the install is recorded as a baseline
\* and never published. The accepted p3 residual: one process must touch more
\* than MAX_ROOTS (64) roots.
CONSTANTS
    Roots = {"a", "b"}
    SinceRoots = {}
    Modes = {"call"}
    Kinds = {"inst"}
    RecCap = 1
    OwedCap = 2
    Calls = 3
    Changes = 1
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
SPECIFICATION Spec
INVARIANTS NoLostChange
CHECK_DEADLOCK FALSE
