\* expect: pass
\* module: DiskChangePublisher
\* The FIFO evicts a record (RecCap = 1, two roots) and an install lands; the
\* next look is a first look that names the live client's spawn epoch (a
\* client-root look, #4532), so the install is published, not recorded as a
\* baseline. OneRestartPerInstall is left out: the same schedule with a joined
\* second call republishes the install from the trailing pass's old epoch
\* (EvictedInstallTrailing, a violation). OneFreshRestartPerInstall stands in
\* for it: a pass that starts as a fresh flight never republishes an install
\* the client already read (a first look that drops its epoch test reds here).
CONSTANTS
    Roots = {"a", "b"}
    SinceRoots = {"a", "b"}
    Modes = {"client"}
    Kinds = {"inst"}
    RecCap = 1
    OwedCap = 2
    Calls = 3
    Changes = 1
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
    SessionLookConfigEpoch = TRUE
    SessionLookInstallEpoch = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK I1CommitBeforePublish I2SeqBeforeFanOut I3AwaitedFanOut I4NoAuthorship I5Isolated I5RecordedOnce OneFreshRestartPerInstall NoLostChange DemandServed
CHECK_DEADLOCK FALSE
