\* expect: pass
\* module: DiskChangePublisher
\* As built, two roots, no eviction pressure, four look calls and two
\* external changes: every interleaving of the five callers over the two
\* roots (the widest schedule that fits the CI budget).
CONSTANTS
    Roots = {"a", "b"}
    SinceRoots = {"a"}
    Modes = {"call", "result", "client", "diag", "head"}
    Kinds = {"inst", "decl"}
    RecCap = 2
    OwedCap = 2
    Calls = 4
    Changes = 2
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK I1CommitBeforePublish I2SeqBeforeFanOut I3AwaitedFanOut I4NoAuthorship I5Isolated I5RecordedOnce OneRestartPerInstall NoLostChange DemandServed
CHECK_DEADLOCK FALSE
