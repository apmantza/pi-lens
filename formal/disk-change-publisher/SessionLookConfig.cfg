\* expect: pass
\* module: DiskChangePublisher
\* #5501: a root whose client spawned before the session-side looks. A config
\* edit or an install lands before or between the looks; every session-side
\* caller (call, result, diag, head) names the live client's epoch for the
\* config, so it is forwarded, and none restarts the client for the install at
\* a first look (the restart cell). No eviction pressure (RecCap = 2): an
\* evicted record is B2a, owned by the B2a configs.
CONSTANTS
    Roots = {"a", "b"}
    SinceRoots = {"a"}
    Modes = {"call", "result", "diag", "head"}
    Kinds = {"cfg", "inst"}
    RecCap = 2
    OwedCap = 2
    Calls = 3
    Changes = 2
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
    SessionLookConfigEpoch = TRUE
    SessionLookInstallEpoch = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK I1CommitBeforePublish I2SeqBeforeFanOut I3AwaitedFanOut I5Isolated NoLostChange SessionFirstLookNoRestart
CHECK_DEADLOCK FALSE
