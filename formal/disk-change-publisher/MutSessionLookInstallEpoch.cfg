    Roots = {"a"}
    SinceRoots = {"a"}
    Modes = {"call", "result", "diag", "head"}
    Kinds = {"inst"}
    RecCap = 1
    OwedCap = 2
    Calls = 2
    Changes = 1
    AgentEdits = 0
    Throws = 0
    JoinOwesWalk = TRUE
    TrailingSeesFlightRecord = TRUE
    CommitBeforePublish = TRUE
    AllocBeforeFanOut = TRUE
    AwaitFanOut = TRUE
    PublishCredits = FALSE
    IsolateThrows = TRUE
    RecordOnce = TRUE
    SessionLookConfigEpoch = TRUE
    SessionLookInstallEpoch = TRUE
SPECIFICATION Spec
INVARIANTS SessionFirstLookNoRestart
CHECK_DEADLOCK FALSE
