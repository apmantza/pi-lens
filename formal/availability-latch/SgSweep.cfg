\* expect: violated OnlyStarterRecords
\* module: AvailabilityLatch
\* B1 (#5333), at module level: the sg sweep helpers reset one module latch in place and settle with no generation re-check, so a sweep started before a session start writes its verdict into the newer generation. No production caller reaches the helpers, so B1 is latent. #5345 deleted the sweep; this config stands as the as-built record of that knob shape (one in-place latch reset, settle with no generation re-check), not of live code.
CONSTANTS
    NewLatchPerGen = FALSE
    Clear = "touch"
    SettleGuard = "none"
    TrustStamp = "owed"
    ReadChecksTrust = TRUE
    Results = {"ok", "prov", "trans", "dur"}
    MaxGen = 1
    MaxTrust = 2
    MaxProbes = 3
    Ladder = 2
SPECIFICATION Spec
INVARIANTS TypeOK OnlyStarterRecords NoStaleServed StampNotNewer ServedUnderTrust
CHECK_DEADLOCK FALSE
