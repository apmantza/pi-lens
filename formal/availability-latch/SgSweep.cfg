\* expect: violated OnlyStarterRecords
\* module: AvailabilityLatch
\* B1 on master (#5333): the sg sweep resets one module latch in place and settles with no generation re-check, so a sweep started before a session start writes its verdict into the newer generation.
CONSTANTS
    NewLatchPerGen = FALSE
    Clear = "touch"
    SettleGuard = "none"
    TrustStamp = "owed"
    ReadChecksTrust = TRUE
    Results = {"ok", "prov", "trans", "dur"}
    MaxGen = 1
    MaxTrust = 2
    MaxProbes = 3
    Ladder = 2
SPECIFICATION Spec
INVARIANTS TypeOK OnlyStarterRecords NoStaleServed StampNotNewer ServedUnderTrust
CHECK_DEADLOCK FALSE
