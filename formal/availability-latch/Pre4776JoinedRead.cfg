\* expect: violated StampNotNewer
\* module: AvailabilityLatch
\* The #4776 joined-caller hole: the stamp is the trust of the latest read that owed a probe, so a caller that joins the probe in flight after a trust change stamps the older probe's verdict with the newer trust.
CONSTANTS
    NewLatchPerGen = TRUE
    Clear = "touch"
    SettleGuard = "none"
    TrustStamp = "lastRead"
    ReadChecksTrust = TRUE
    Results = {"ok", "prov", "trans", "dur"}
    MaxGen = 1
    MaxTrust = 2
    MaxProbes = 3
    Ladder = 2
SPECIFICATION Spec
INVARIANTS TypeOK StampNotNewer
CHECK_DEADLOCK FALSE
