    Clear = "touch"
    SettleGuard = "none"
    TrustStamp = "owed"
    ReadChecksTrust = TRUE
    Results = {"ok", "prov", "trans", "dur"}
    MaxGen = 1
    MaxTrust = 2
    MaxProbes = 3
    Ladder = 2
SPECIFICATION Spec
INVARIANTS TypeOK OnlyStarterRecords NoStaleServed StampNotNewer ServedUnderTrust FreshSettleRecords
CHECK_DEADLOCK FALSE
