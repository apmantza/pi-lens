\* expect: violated FreshSettleRecords
\* module: AvailabilityLatch
\* A deny-all guard: no settle ever lands. It passes every invariant that says what must not be recorded; FreshSettleRecords is the one that refuses it, because a probe that started in the current generation and holds the live latch has its settle dropped.
CONSTANTS
    NewLatchPerGen = FALSE
    Clear = "touch"
    SettleGuard = "deny"
    TrustStamp = "owed"
    ReadChecksTrust = TRUE
    Results = {"ok", "prov", "trans", "dur"}
    MaxGen = 1
    MaxTrust = 2
    MaxProbes = 3
    Ladder = 2
SPECIFICATION Spec
INVARIANTS TypeOK FreshSettleRecords
CHECK_DEADLOCK FALSE
