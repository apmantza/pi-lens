\* expect: violated InstallOwned
\* module: AvailabilityLatch
\* A process-lived client latch (govulncheck, security scan): an install-class failure settling after a session start syncs the install generation and then counts as an attempt of the newer one.
CONSTANTS
    NewLatchPerGen = FALSE
    Clear = "none"
    SettleGuard = "none"
    TrustStamp = "owed"
    ReadChecksTrust = TRUE
    Results = {"ok", "trans", "inst", "dur"}
    MaxGen = 1
    MaxTrust = 2
    MaxProbes = 3
    Ladder = 2
SPECIFICATION Spec
INVARIANTS TypeOK InstallOwned
CHECK_DEADLOCK FALSE
