    NewLatchPerGen = FALSE
    Clear = "none"
    SettleGuard = "gen"
    TrustStamp = "owed"
    ReadChecksTrust = TRUE
    Results = {"ok", "trans", "inst", "dur"}
    MaxGen = 1
    MaxTrust = 2
    MaxProbes = 3
    Ladder = 2
SPECIFICATION Spec
INVARIANTS TypeOK InstallOwned OnlyStarterRecords StampNotNewer ServedUnderTrust
CHECK_DEADLOCK FALSE
