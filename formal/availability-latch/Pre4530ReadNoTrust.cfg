\* expect: violated ServedUnderTrust
\* module: AvailabilityLatch
\* The code before #4530: the latch keeps no trust generation, so a verdict from another trust generation is served after trust changes. createAvailabilityChecker had this shape until #5410 (its AvailabilityCache kept no trust stamp: run-b, a venv refused while untrusted stayed refused after trust).
CONSTANTS
    NewLatchPerGen = TRUE
    Clear = "touch"
    SettleGuard = "none"
    TrustStamp = "owed"
    ReadChecksTrust = FALSE
    Results = {"ok", "prov", "trans", "dur"}
    MaxGen = 1
    MaxTrust = 2
    MaxProbes = 3
    Ladder = 2
SPECIFICATION Spec
INVARIANTS TypeOK ServedUnderTrust
CHECK_DEADLOCK FALSE
