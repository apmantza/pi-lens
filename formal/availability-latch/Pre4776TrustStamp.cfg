\* expect: violated StampNotNewer
\* module: AvailabilityLatch
\* The code before #4776: a note stamps the verdict with the trust generation current at the note, so a probe that started before a trust change and settled after it is served for the new trust.
CONSTANTS
    NewLatchPerGen = TRUE
    Clear = "touch"
    SettleGuard = "none"
    TrustStamp = "current"
    ReadChecksTrust = TRUE
    Results = {"ok", "prov", "trans", "dur"}
    MaxGen = 1
    MaxTrust = 2
    MaxProbes = 3
    Ladder = 2
SPECIFICATION Spec
INVARIANTS TypeOK StampNotNewer
CHECK_DEADLOCK FALSE
