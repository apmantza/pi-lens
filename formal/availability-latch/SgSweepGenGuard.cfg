\* expect: pass
\* module: AvailabilityLatch
\* The candidate fix for B1: the sweep re-checks the availability generation after its await and drops a settle from an older generation. Every invariant holds, trust adoption included. #5345 resolved B1 by deleting the sweep instead of guarding it; this config keeps the guarded cell of the state space executable.
CONSTANTS
    NewLatchPerGen = FALSE
    Clear = "touch"
    SettleGuard = "gen"
    TrustStamp = "owed"
    ReadChecksTrust = TRUE
    Results = {"ok", "prov", "trans", "dur"}
    MaxGen = 1
    MaxTrust = 2
    MaxProbes = 3
    Ladder = 2
SPECIFICATION Spec
INVARIANTS TypeOK OnlyStarterRecords NoStaleServed StampNotNewer ServedUnderTrust FreshSettleRecords
CHECK_DEADLOCK FALSE
