\* expect: pass
\* module: GenerationLock
\* The install lock since #3515 with every heartbeat interval landing:
\* `Heartbeat` is wired and `HeartbeatStall` is off, so `Expire` is disabled
\* and no contender takes over a live holder. This is the claim the stalled
\* configs break. It does not exercise the re-check (that is
\* GenerationHeartbeat.cfg's job), so `OwnsTop = FALSE` still passes here.
CONSTANTS
    Procs = {p1, p2, p3}
    MaxCrashes = 1
    AllowExpiry = TRUE
    MaxGen = 4
    Cleanup = TRUE
    Recheck = TRUE
    Rounds = 1
    ListedMarker = FALSE
    Heartbeat = TRUE
    HeartbeatStall = FALSE
    OwnsTop = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS NoLiveTakeover MutualExclusion NoLostRegistration NoOrphanLock
CHECK_DEADLOCK FALSE
