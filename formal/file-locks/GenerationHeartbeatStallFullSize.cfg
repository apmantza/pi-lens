\* expect: pass
\* module: GenerationLock
\* Review round 1, F1: the Stall shape at full size (MaxGen = 5, Rounds = 2)
\* with the ownership re-check on, checking NoLostRegistration. Two processes
\* are the population the F1 counterexample needs (p1 in `cs_read`, Expire,
\* p2 takes over). The three-process Stall family runs at MaxGen = 4,
\* Rounds = 1 because three processes at this size exceed the model-check
\* budget; see the README and the PR body. NoLiveTakeover is not listed (the
\* stall violates it), and MutualExclusion is not listed (the read-side
\* overlap is GenerationHeartbeatStallReadOverlap.cfg).
CONSTANTS
    Procs = {p1, p2}
    MaxCrashes = 1
    AllowExpiry = TRUE
    MaxGen = 5
    Cleanup = TRUE
    Recheck = TRUE
    Rounds = 2
    ListedMarker = FALSE
    Heartbeat = TRUE
    HeartbeatStall = TRUE
    OwnsTop = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS NoLostRegistration NoOrphanLock
CHECK_DEADLOCK FALSE
