\* expect: violated MutualExclusion
\* module: GenerationLock
\* The read-side overlap of review round 1 (F1), surfaced: with the re-check
\* wired (`OwnsTop = TRUE`) and the stall on, p1 is still in `cs_read` when
\* the lease lapses and p2 takes over, so two live processes are in the
\* critical section as the model counts it. `NoLiveTakeover` is left off so
\* TLC reports the overlap; `NoLostRegistration` stays listed after it, and
\* the re-check keeps it.
CONSTANTS
    Procs = {p1, p2, p3}
    MaxCrashes = 1
    AllowExpiry = TRUE
    MaxGen = 4
    Cleanup = TRUE
    Recheck = TRUE
    Rounds = 1
    ListedMarker = FALSE
    Heartbeat = TRUE
    HeartbeatStall = TRUE
    OwnsTop = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS MutualExclusion NoLostRegistration NoOrphanLock
CHECK_DEADLOCK FALSE
