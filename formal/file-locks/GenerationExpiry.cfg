\* expect: violated NoLiveTakeover
\* module: GenerationLock
\* The install lock before #3515: no heartbeat and no ownership re-check, with
\* a lease shorter than the hold (an ERESOLVE npm install runs two 120 s
\* attempts inside the 180 s lease). A live holder's generation is judged
\* stale and taken over. Consolidates the deleted GenerationNoHeartbeat.cfg
\* (review round 1, F3); the lease's own `MutualExclusion` overlap is
\* surfaced separately by GenerationHeartbeatStallReadOverlap.cfg.
CONSTANTS
    Procs = {p1, p2, p3}
    MaxCrashes = 0
    AllowExpiry = TRUE
    MaxGen = 5
    Cleanup = TRUE
    Recheck = TRUE
    Rounds = 2
    ListedMarker = FALSE
    Heartbeat = FALSE
    HeartbeatStall = FALSE
    OwnsTop = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS NoLiveTakeover MutualExclusion NoLostRegistration NoOrphanLock
CHECK_DEADLOCK FALSE
