\* expect: pass
\* module: GenerationLock
\* The install lock since #3515 through a missed heartbeat. `HeartbeatStall`
\* makes `Expire` reachable and `HeartbeatTick` live, so this config exercises
\* both new actions: the lease lapses under a live holder, a contender takes
\* it over (`NoLiveTakeover` is violated; see GenerationHeartbeatStall.cfg),
\* and the ownership re-check then keeps the superseded holder out of its
\* critical write, so the taker's committed registration is never overwritten.
\* `MutualExclusion` is not listed: the re-check gates only `CsWrite`, so a
\* superseded reader still overlaps the taker (see
\* GenerationHeartbeatStallReadOverlap.cfg). `OwnsTop = FALSE` violates
\* `NoLostRegistration` (see GenerationHeartbeatStallNoCheck.cfg).
\* `MaxGen = 4` and `Rounds = 1` keep this three-process pass tractable;
\* `GenerationHeartbeatStallFullSize.cfg` runs the same Spec at full size
\* (MaxGen = 5, Rounds = 2) with the two processes the F1 counterexample
\* needs.
CONSTANTS
    Procs = {p1, p2, p3}
    MaxCrashes = 1
    AllowExpiry = TRUE
    MaxGen = 4
    Cleanup = TRUE
    Recheck = TRUE
    Rounds = 1
    ListedMarker = FALSE
    Heartbeat = TRUE
    HeartbeatStall = TRUE
    OwnsTop = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS NoLostRegistration NoOrphanLock
CHECK_DEADLOCK FALSE
