\* expect: violated NoLostRegistration
\* module: GenerationLock
\* No-drop witness (review round 1, F1): the same stalled heartbeat with the
\* ownership re-check off. The superseded holder overwrites `reg` with its
\* stale `snap`, dropping the taker's committed registration. This isolates
\* the re-check from the heartbeat; `NoLiveTakeover` is violated either way.
CONSTANTS
    Procs = {p1, p2, p3}
    MaxCrashes = 1
    AllowExpiry = TRUE
    MaxGen = 4
    Cleanup = TRUE
    Recheck = TRUE
    Rounds = 1
    ListedMarker = FALSE
    Heartbeat = TRUE
    HeartbeatStall = TRUE
    OwnsTop = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS NoLostRegistration
CHECK_DEADLOCK FALSE
