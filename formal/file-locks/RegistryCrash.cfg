\* expect: pass
\* module: GenerationLock
\* The registry lock since #3476 (clients/generation-lock.ts), one writer dies
\* at any step. Before #3476 this config ran FileLock with IdentityCheck,
\* EmptyIsDead and AtomicCreate FALSE and violated MutualExclusion: two takers
\* of a dead owner's lock each removed what the path named.
CONSTANTS
    Procs = {p1, p2, p3}
    MaxCrashes = 1
    AllowExpiry = FALSE
    MaxGen = 5
    Cleanup = TRUE
    Recheck = TRUE
    Rounds = 2
    ListedMarker = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS MutualExclusion NoLostRegistration NoOrphanLock
CHECK_DEADLOCK FALSE
