\* expect: violated NoLiveTakeover
\* module: GenerationLock
\* The residual, reviewed in round 1 (F1): a stalled heartbeat lets the lease
\* lapse under a live holder and a contender takes over. The ownership
\* re-check does NOT restore `MutualExclusion` — it gates only `CsWrite`, so
\* the superseded holder's read still overlaps (see
\* GenerationHeartbeatStallReadOverlap.cfg). What the re-check protects is
\* `NoLostRegistration`, which still holds here (see GenerationHeartbeat.cfg).
CONSTANTS
    Procs = {p1, p2, p3}
    MaxCrashes = 1
    AllowExpiry = TRUE
    MaxGen = 4
    Cleanup = TRUE
    Recheck = TRUE
    Rounds = 1
    ListedMarker = FALSE
    Heartbeat = TRUE
    HeartbeatStall = TRUE
    OwnsTop = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS NoLiveTakeover NoLostRegistration NoOrphanLock
CHECK_DEADLOCK FALSE
