\* expect: violated NoGhostRoot
\* module: SessionRegistry
\* Fix mutant of #3703: one async lock with the ordinary bounded wait
\* instead of the lease wait. A busy lock drops the removal.
CONSTANTS
    Contention = TRUE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "asyncBounded"
    Teardown = "off"
    PeerStuck = FALSE
    Reaper = FALSE
    SharedSec = FALSE
    FixParts = {"generation","child","rootIntent","retry"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable NoExitWhileHeld RootRemovedOnce TeardownProgress
CHECK_DEADLOCK FALSE
