\* expect: pass
\* module: SessionRegistry
\* The merged behaviour (#3657 and #3703): a declined secondary's root is in
\* the entry and its removal takes one lease-waiting lock on the tail; the
\* test worker's exit joins the tail with a bound. The other process may hold
\* the lock forever, and the model lets the removal wait for it forever. The
\* real removal drops after 5.5 s (LOCK_WAIT_THROUGH_LEASE_MS) and keeps the
\* root (review probe: settled after 5506 ms, root kept), so NoGhostRoot does
\* not hold on the code for a stuck holder; the README records the
\* abstraction.
CONSTANTS
    Contention = TRUE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "queued"
    Teardown = "bounded"
    PeerStuck = TRUE
    Reaper = FALSE
    SharedSec = FALSE
    FixParts = {"generation","child","rootIntent","retry"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable NoExitWhileHeld RootRemovedOnce TeardownProgress
CHECK_DEADLOCK FALSE
