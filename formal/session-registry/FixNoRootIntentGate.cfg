\* expect: violated NoGhostRoot
\* module: SessionRegistry
\* Fix mutant without "rootIntent": a secondary's removal queued before
\* shutdown re-arms the intent to the ended root, and the heartbeat
\* re-registers it (review round 1, F1).
CONSTANTS
    Contention = TRUE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "off"
    Teardown = "off"
    PeerStuck = FALSE
    Reaper = FALSE
    SharedSec = FALSE
    FixParts = {"generation","child","retry"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable
CHECK_DEADLOCK FALSE
