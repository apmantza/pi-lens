\* expect: violated SharedRootHeld
\* module: SessionRegistry
\* #3849 fix mutant: the 32-root cap evicts T but leaves the holder
\* records listing it, so a record outlives its root.
CONSTANTS
    Contention = FALSE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "queued"
    Teardown = "off"
    PeerStuck = FALSE
    Reaper = FALSE
    SharedSec = TRUE
    FixParts = {"generation","child","rootIntent","retry","holderSet","holderOthers"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable RootRemovedOnce SharedRootHeld
CHECK_DEADLOCK FALSE
