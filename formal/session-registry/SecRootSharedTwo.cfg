\* expect: pass
\* module: SessionRegistry
\* #3849 fixed, on the merged behaviour (#3657 and #3703): three holders of
\* one secondary root "T" (two that register it, one reload-gap subagent
\* that never does), the primary's reload (whole-entry removal, then a new
\* registration) and the 32-root cap evicting T. Each holder's record lists
\* the roots it registered; a removal ends only its own record and drops T
\* only when no other record lists it.
CONSTANTS
    Contention = FALSE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "queued"
    Teardown = "off"
    PeerStuck = FALSE
    Reaper = FALSE
    SharedSec = TRUE
    FixParts = {"generation","child","rootIntent","retry","holderSet","holderOthers","holderEvict"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable RootRemovedOnce SharedRootHeld
CHECK_DEADLOCK FALSE
