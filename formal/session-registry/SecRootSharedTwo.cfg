\* expect: violated SharedRootHeld
\* module: SessionRegistry
\* Open defect #3849, on the merged behaviour (#3657 and #3703): two
\* secondaries on one non-primary root. The entry holds roots as a set with
\* no count, so the first secondary's removal drops the root the second still
\* serves, for the rest of the session. Flips to `pass` when the fix for
\* #3849 adds a holder count.
CONSTANTS
    Contention = FALSE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "queued"
    Teardown = "off"
    PeerStuck = FALSE
    Reaper = FALSE
    SharedSec = TRUE
    FixParts = {"generation","child","rootIntent","retry"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable RootRemovedOnce SharedRootHeld
CHECK_DEADLOCK FALSE
