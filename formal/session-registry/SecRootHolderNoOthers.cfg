\* expect: violated SharedRootHeld
\* module: SessionRegistry
\* #3849 fix mutant: a removal ends its own record but drops T without
\* checking the other records, so the first of two holders frees T.
CONSTANTS
    Contention = FALSE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "queued"
    Teardown = "off"
    PeerStuck = FALSE
    Reaper = FALSE
    SharedSec = TRUE
    FixParts = {"generation","child","rootIntent","retry","holderSet","holderEvict"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable RootRemovedOnce SharedRootHeld
CHECK_DEADLOCK FALSE
