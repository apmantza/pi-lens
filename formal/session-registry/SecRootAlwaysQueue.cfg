\* expect: violated RootRemovedOnce
\* module: SessionRegistry
\* Fix mutant of #3657 (its R1i, "always queue"): the fallback runs after
\* a successful sync removal too, so the removal lands twice.
CONSTANTS
    Contention = FALSE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "syncAlways"
    Teardown = "off"
    PeerStuck = FALSE
    Reaper = FALSE
    SharedSec = FALSE
    FixParts = {"generation","child","rootIntent","retry"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable NoExitWhileHeld RootRemovedOnce TeardownProgress
CHECK_DEADLOCK FALSE
