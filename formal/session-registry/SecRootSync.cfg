\* expect: violated NoGhostRoot
\* module: SessionRegistry
\* Before #3657 (#3587), with the heartbeat still off the tail (#3602): the
\* sync attempt meets this process's own heartbeat hold, gives up after
\* 500 ms and never retries; the secondary's root stays in the entry for the
\* rest of the session.
CONSTANTS
    Contention = FALSE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "sync"
    Teardown = "off"
    PeerStuck = FALSE
    Reaper = FALSE
    SharedSec = FALSE
    FixParts = {"generation","child","rootIntent","retry"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable NoExitWhileHeld RootRemovedOnce TeardownProgress
CHECK_DEADLOCK FALSE
