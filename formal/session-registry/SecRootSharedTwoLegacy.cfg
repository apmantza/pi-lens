\* expect: violated SharedRootHeld
\* module: SessionRegistry
\* #3849 before the fix (master's merged behaviour): the entry holds roots as
\* a set, so any holder's removal drops T while another holder's landed add
\* still holds it, including a reload-gap subagent that never registered T.
CONSTANTS
    Contention = FALSE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "queued"
    Teardown = "off"
    PeerStuck = FALSE
    Reaper = FALSE
    SharedSec = TRUE
    FixParts = {"generation","child","rootIntent","retry"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable RootRemovedOnce SharedRootHeld
CHECK_DEADLOCK FALSE
