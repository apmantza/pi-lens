\* expect: pass
\* module: SessionRegistry
\* The #3657 shape, before #3703 collapsed it: a sync attempt, then the
\* lease-waiting lock in place on the tail slot when the sync attempt found
\* the lock busy. Same verdicts as the merged single lock. The other process
\* may hold the lock forever, and the model lets the removal wait for it
\* forever; the real one drops after 5.5 s (see SecRootQueued.cfg).
CONSTANTS
    Contention = TRUE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "syncQueued"
    Teardown = "bounded"
    PeerStuck = TRUE
    Reaper = FALSE
    SharedSec = FALSE
    FixParts = {"generation","child","rootIntent","retry"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable NoExitWhileHeld RootRemovedOnce TeardownProgress
CHECK_DEADLOCK FALSE
