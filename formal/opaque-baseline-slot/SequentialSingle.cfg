\* expect: pass
\* module: OpaqueBaselineSlot
\* Today's rows: bash calls that never overlap share the one cwd slot
\* without loss, with the pre-fix keying and dedupe. The fix must not move
\* this case (PerCallKeyed's state space holds every sequential order).
CONSTANTS
    Keying = "cwd"
    Cap = 3
    Subtract = FALSE
    Dedupe = "content"
    Retire = FALSE
    Observe = "counted"
    Sequential = TRUE
    LatchClear = FALSE
    ClearRule = "always"
    Scenario = "s8"
SPECIFICATION Spec
INVARIANTS TypeOK EveryWriteAttributed BlockerKept NoDrop SlotLossObservable
CHECK_DEADLOCK FALSE
