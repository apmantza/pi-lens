\* expect: pass
\* module: OpaqueBaselineSlot
\* The fix with REVIEW_4159 F1's cell: call 1 names a path and is blocked
\* (no tool_result ever), and opaque calls 2 and 3 write that path, in its
\* turn or the next. Every write is analysed; the blocked entry is retired
\* with its turn, counted, and no live call is retired.
CONSTANTS
    Keying = "call"
    Cap = 3
    Subtract = FALSE
    Dedupe = "authority"
    Retire = TRUE
    Observe = "counted"
    Sequential = FALSE
    LatchClear = FALSE
    ClearRule = "bytes"
    Scenario = "blockedNamer"
SPECIFICATION Spec
INVARIANTS TypeOK NoDrop SlotLossObservable StaleRetired RetiresOnlyAbandoned
CHECK_DEADLOCK FALSE
