\* expect: pass
\* module: OpaqueBaselineSlot
\* More parallel calls than the store's cap: the oldest baseline is dropped
\* and counted, so the loss is observable (attribution is guaranteed only up
\* to the cap) and no write goes unanalysed without a counted loss.
CONSTANTS
    Keying = "call"
    Cap = 2
    Subtract = FALSE
    Dedupe = "authority"
    Retire = TRUE
    Observe = "counted"
    Sequential = FALSE
    LatchClear = FALSE
    ClearRule = "bytes"
    Scenario = "s8"
SPECIFICATION Spec
INVARIANTS TypeOK NoDrop SlotLossObservable
CHECK_DEADLOCK FALSE
