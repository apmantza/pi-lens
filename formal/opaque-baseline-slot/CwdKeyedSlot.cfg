\* expect: violated EveryWriteAttributed
\* module: OpaqueBaselineSlot
\* The pre-fix store: one key per cwd:generation. Every tool_call precedes the
\* first tool_result, so a later Record overwrites the earlier baseline and
\* its call finds nothing at Take (the S8 trace: RECORD x3, TAKE found,
\* none, none).
CONSTANTS
    Keying = "cwd"
    Cap = 3
    Subtract = FALSE
    Dedupe = "content"
    Retire = FALSE
    Observe = "counted"
    Sequential = FALSE
    LatchClear = FALSE
    ClearRule = "always"
    Scenario = "s8"
SPECIFICATION Spec
INVARIANTS TypeOK EveryWriteAttributed SlotLossObservable
CHECK_DEADLOCK FALSE
