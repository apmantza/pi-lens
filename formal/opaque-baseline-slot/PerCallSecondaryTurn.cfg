\* expect: pass
\* module: OpaqueBaselineSlot
\* VERIFY_4159 N1, fixed: a concurrent session's turn start may clear the
\* dedupe's latch at any time, so an opaque sibling's recovery of authored
\* bytes can run; the clear rule keeps the authored record.
CONSTANTS
    Keying = "call"
    Cap = 3
    Subtract = FALSE
    Dedupe = "authority"
    Retire = TRUE
    Observe = "counted"
    Sequential = FALSE
    LatchClear = TRUE
    ClearRule = "bytes"
    Scenario = "s8"
SPECIFICATION Spec
INVARIANTS TypeOK EveryWriteAttributed BlockerKept NoDrop SlotLossObservable StaleRetired RetiresOnlyAbandoned StaleRecordCleared
CHECK_DEADLOCK FALSE
