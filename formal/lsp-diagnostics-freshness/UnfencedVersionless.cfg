    VersionedServer = FALSE
    SkippedWait = TRUE
    SeedFirstPush = FALSE
    AsyncServer = FALSE
    Preserve = FALSE
    Fence = FALSE
    ReplyFirst = FALSE
    MaxPubs = 3
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS FreshResult
CHECK_DEADLOCK FALSE
