    VersionedServer = TRUE
    SkippedWait = FALSE
    SeedFirstPush = FALSE
    AsyncServer = TRUE
    Preserve = FALSE
    Fence = FALSE
    ReplyFirst = FALSE
    MaxPubs = 3
    Mutant = "noSuperseded"
SPECIFICATION Spec
INVARIANTS FreshResult
CHECK_DEADLOCK FALSE
