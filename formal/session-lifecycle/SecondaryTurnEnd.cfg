\* expect: violated SecondaryIsolation
\* module: SessionLifecycle
\* #3613 R2 and #3758, open on master: every activation's turn_end runs the whole composer on the process's runtime. A subagent's turn_end clears the primary's turn-state worklist and drains its cascade runs and pending runner findings, and the primary's takes the subagent's.
CONSTANTS
    Transitions = {"SecStart","TurnWork","TurnEnd","SecTurnEnd"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown"}
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK SecondaryIsolation
CHECK_DEADLOCK FALSE
