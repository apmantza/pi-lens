\* expect: pass
\* module: SessionLifecycle
\* #4112 and #4161: a cut advisory's park is keyed by the parking turn's session, lands only while the coordinator's scope is the one the turn captured, and is cleared at session_start. A subagent's lane run neither takes nor shows the primary's parked item, and no replacement carries one.
CONSTANTS
    Transitions = {"New","Reload","SecStart","ParkTake"}
    Writers = {"park"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown","parkSessionKey","parkResetClear","parkFence"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState ParkedStaysInScope
CHECK_DEADLOCK FALSE
