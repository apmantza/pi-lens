\* expect: violated NoLostActivation
\* module: SessionLifecycle
\* #3604, pre-S2 (ae5396e46): the lazy-tool memory was an in-process map keyed by session file (rememberedLazyToolsBySessionFile), never persisted, so pi --fork starts without the parent's activations.
CONSTANTS
    Transitions = {"Quit","PiFork"}
    Writers = {"activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- LegacyPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostActivation
CHECK_DEADLOCK FALSE
