\* expect: violated NoLostCarry
\* module: SessionLifecycle
\* #3521 fork half and the #3589 shape, pre-#3669 (df5fb8abb): the read-guard fork stash was an activation-closure let (pendingForkReadGuard), invisible to the fork's new activation, so the fork started clean.
CONSTANTS
    Transitions = {"Fork"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 1
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- LegacyPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostCarry
CHECK_DEADLOCK FALSE
