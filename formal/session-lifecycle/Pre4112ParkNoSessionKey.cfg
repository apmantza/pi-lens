\* expect: violated ParkedStaysInScope
\* module: SessionLifecycle
\* Pre-#4112 round 2 (ee50e47b6): a parked lane is keyed by its name alone, so a concurrent subagent's run of the same lane takes the primary's parked item. The sibling family turn-end-delivery-holds pins the same key (ParkNoSessionKey); this config reaches it through the SecStart transition.
CONSTANTS
    Transitions = {"New","Reload","SecStart","ParkTake"}
    Writers = {"park"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown","parkResetClear","parkFence"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK ParkedStaysInScope
CHECK_DEADLOCK FALSE
