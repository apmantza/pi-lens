\* expect: violated NoLostCarry
\* module: SessionLifecycle
\* #3855 (#3668 row 17, a stated residual), file-backed: a subagent's own /reload or /fork in the primary's /reload gap classifies primary, so the real successor is demoted to a secondary and never adopts the slot: the conversation's reads are lost.
CONSTANTS
    Transitions = {"Reload","SecStart","SecReload","SecFork"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostCarry
CHECK_DEADLOCK FALSE
