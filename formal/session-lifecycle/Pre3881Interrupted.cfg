\* expect: violated NoLostActivation
\* module: SessionLifecycle
\* Pre-fix twin of H3Interrupted (#3881), master at 5d55e4821: the interrupted start's shutdown stashes its empty scope over the slot left for that start, and the inner reload's start takes the empty slot.
CONSTANTS
    Transitions = {"New","Resume","Fork","Reload","Interrupt"}
    Writers = {"read","activate","advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostActivation
CHECK_DEADLOCK FALSE
