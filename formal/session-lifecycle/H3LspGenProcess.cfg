\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3755 (F1 of #3803): one LSP service generation per process (getProcessSingleton), so a re-evaluated entry module continues the count. Every server in the fleet belongs to a live scope (FleetOwnersLive) across /reload, /new and the idle reset, and the generation clause holds as well.
CONSTANTS
    Transitions = {"Reload","New","IdleReset"}
    Writers = {"lsp"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState FleetOwnersLive
CHECK_DEADLOCK FALSE
