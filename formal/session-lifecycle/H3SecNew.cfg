\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3855 r2 (review F1, round 1's R1), file-backed primary: a subagent's own in-memory /new in the primary's /reload gap is not the successor the shutdown named ("namedSuccessor","nameAtShutdown"), so it stays secondary and the real successor keeps the reads, activations and advisory. Mut3855r1SecNew keeps round 1's violation.
CONSTANTS
    Transitions = {"Reload","SecStart","SecNew"}
    Writers = {"read","activate","advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {"U"}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostCarry NoLostActivation NoLostAdvisory PrimaryIsUsers HasPrimary UserNotDeclined
CHECK_DEADLOCK FALSE
