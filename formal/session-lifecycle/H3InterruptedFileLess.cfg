\* expect: pass
\* module: SessionLifecycle
\* H3Interrupted with file-less sessions: the forwarded slot keeps the ticket key the inner reload's start finds on the session manager (#3819).
CONSTANTS
    Transitions = {"New","Resume","Fork","Reload","Interrupt","InterruptPreScope"}
    Writers = {"read","activate","advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {"A","N","F","C","S","T"}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HasPrimary NoLostCarry NoLostActivation NoLostAdvisory HandoffOnce NoCrossSessionAdoption NoForeignFact NoForeignActivation NoCrossSessionDelivery AdvisoryStaysInSession
CHECK_DEADLOCK FALSE
