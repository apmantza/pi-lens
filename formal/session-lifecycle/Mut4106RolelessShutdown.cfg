\* expect: violated PrimaryIsUsers
\* module: SessionLifecycle
\* Pre-#4106 (8d030fa27): the role-less shutdown fails safe to primary in the gap, names it by its own ticket, and its reload successor takes the primary slot.
CONSTANTS
    Transitions = {"Reload","Fork","New","SecStart","SecNew","SecRoleless"}
    Writers = {"activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {"U"}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK PrimaryIsUsers
CHECK_DEADLOCK FALSE
