\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #4106 (V7 of #3855): a gap subagent's /new interrupted by its own /reload before its start ran shuts down with no role; its key (none, on a new manager) is not the one the primary's /reload, /fork or file-backed /new named, so it is a secondary's, the gap keeps its name, and the real successor keeps its activations. Mut4106RolelessShutdown keeps the pre-fix violation.
CONSTANTS
    Transitions = {"Reload","Fork","New","SecStart","SecNew","SecRoleless"}
    Writers = {"activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown","rolelessKey"}
    FileLess = {"U"}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK PrimaryIsUsers HasPrimary NoLostActivation
CHECK_DEADLOCK FALSE
