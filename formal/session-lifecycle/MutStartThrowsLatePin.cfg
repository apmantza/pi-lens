\* expect: violated SecondaryIsolation
\* module: SessionLifecycle
\* #3613 F1, the round-1 shape: a primary start whose handler throws after its reset skips the stable-id pin placed after the start's await, so every turn of that primary takes the other-session path and its turn state never moves.
CONSTANTS
    Transitions = {"New","Resume","Fork","Reload","Tree","SecStart","SecEnd","SecTurn"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown","startThrows"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 2
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HasPrimary NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce NoCrossSessionAdoption OrderMonotone OneResetPerScope NoForeignFact NoForeignActivation NoLostActivation SecondaryKeepsActivation NoCrossSessionDelivery NoLostAdvisory
CHECK_DEADLOCK FALSE
