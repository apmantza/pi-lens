\* expect: violated PrimaryIsUsers
\* module: SessionLifecycle
\* #3855 r1 (review F1): the note rule. A subagent's own in-memory /new leaves no note (pi links it to nothing), so its start in the primary's /reload gap classifies primary.
CONSTANTS
    Transitions = {"Reload","SecStart","SecNew"}
    Writers = {"read","activate","advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","inheritRole"}
    FileLess = {"U"}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK PrimaryIsUsers
CHECK_DEADLOCK FALSE
