\* expect: violated NoLostAdvisory
\* module: SessionLifecycle
\* #3855 (#3668 row 17), file-backed, as H3DemoteCarry: the demoted real successor never re-queues the advisory its predecessor left in the slot.
CONSTANTS
    Transitions = {"Reload","SecStart","SecReload","SecFork"}
    Writers = {"advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostAdvisory
CHECK_DEADLOCK FALSE
