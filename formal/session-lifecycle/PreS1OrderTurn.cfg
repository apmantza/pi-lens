\* expect: violated OrderMonotone
\* module: SessionLifecycle
\* Pre-S1 (b456ff89c, before #3732), N3 (#3540 case A): the order turn was a RuntimeCoordinator field (_writeOrderTurn += 1 in beginTurn), so a /reload that re-evaluates the entry module restarts it while the widget's guard keeps its tokens. S1 draws it from the process counter (nextOrderTurn).
CONSTANTS
    Transitions = {"Reload"}
    Writers = {"widget"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 1
    MaxTurns = 3
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope NoForeignFact
CHECK_DEADLOCK FALSE
