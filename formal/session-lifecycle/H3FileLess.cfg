\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3819 (hypothesis 3 of #3803): a file-less slot is keyed by the ticket of the scope that left it ("ticketKey"), so a subagent's own /reload or /fork classified primary in the primary's replacement gap (#3668 row 17) no longer takes the primary's slot, and the demoted real successor discards it ("demotedDiscard"). Pre3819FileLess keeps the pre-fix violation, MutFileLessNoTicketKey the discard alone.
CONSTANTS
    Transitions = {"New","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard"}
    FileLess = {"A","N","F","C","S","T"}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionAdoption
CHECK_DEADLOCK FALSE
