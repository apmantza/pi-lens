\* expect: pass
\* module: SessionLifecycle
\* Fixed in #3855 r3 (verify r2 V1, probe PR8): an SDK subagent's first bind with reason reload or fork, in memory, inside an in-memory primary's /reload or /fork gap carries no key, which is not the ticket the shutdown named: it stays secondary, and the real successor keeps its activations. Mut3855r2KeylessFailSafe keeps round 2's violation.
CONSTANTS
    Transitions = {"Reload","Fork","SecBindReplace"}
    Writers = {"activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {"A","N","F","C","S","T","U"}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK PrimaryIsUsers HasPrimary NoLostActivation
CHECK_DEADLOCK FALSE
