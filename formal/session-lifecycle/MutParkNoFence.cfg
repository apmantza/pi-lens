\* expect: violated ParkedStaysInScope
\* module: SessionLifecycle
\* Design alternative: the hold settle without isCurrentSession (planDeliveryHolds). A turn that began in session 1 parks after /reload, into session 2's map under the same stable key, and session 2 shows it.
CONSTANTS
    Transitions = {"New","Reload","SecStart","ParkTake"}
    Writers = {"park"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown","parkSessionKey","parkResetClear"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK ParkedStaysInScope
CHECK_DEADLOCK FALSE
