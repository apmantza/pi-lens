\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #4113, file-backed: a /reload, /fork or resume start is interrupted by its own /reload before pi-lens's start handler ran (W0: no in-flight mark, no scope); that shutdown forwards the slot left for the start its gap names ("forwardUnstarted"), so the inner reload's start takes the conversation's reads, activations and advisory. Mut4113Unstarted keeps the pre-fix violation.
CONSTANTS
    Transitions = {"New","Resume","Fork","Reload","Interrupt","InterruptPreScope","InterruptUnstarted"}
    Writers = {"read","activate","advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown","forwardUnstarted"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HasPrimary NoLostCarry NoLostActivation NoLostAdvisory HandoffOnce NoCrossSessionAdoption NoForeignFact NoForeignActivation NoCrossSessionDelivery AdvisoryStaysInSession
CHECK_DEADLOCK FALSE
