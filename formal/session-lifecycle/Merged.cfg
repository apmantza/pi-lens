\* expect: pass
\* module: SessionLifecycle
\* Merged master (S1-S3, #3757, #3668): every host transition but a subagent's turn and its own /reload or /fork (Current and the H3 configs cover those), the primary's read-guard writer, three transitions in a row. MergedStores checks the new stores.
CONSTANTS
    Transitions = {"New","Resume","Fork","Clone","CancelFork","Reload","Quit","PiFork","Tree","IdleReset","SecStart","SecEnd","Dup"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce NoCrossSessionAdoption OrderMonotone OneResetPerScope NoForeignFact NoForeignActivation NoLostActivation NoCrossSessionDelivery NoLostAdvisory
CHECK_DEADLOCK FALSE
