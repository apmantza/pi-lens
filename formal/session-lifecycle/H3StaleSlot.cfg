\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3819 (review S1 on #3835), file-backed: the primary's /reload leaves its slot; a subagent's own /fork in the gap classifies primary (#3668 row 17) and takes nothing; the real successor is demoted and discards the slot left for it ("demotedDiscard"); after that primary's /new or resume, the demoted session's own /reload finds no stale slot. Pre3819StaleSlot keeps the pre-fix violation, MutStaleSlotNoDiscard the ticket key alone.
CONSTANTS
    Transitions = {"New","Resume","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard"}
    FileLess = {}
    MaxSteps = 5
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HandoffOnce
CHECK_DEADLOCK FALSE
