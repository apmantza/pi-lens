\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3819, the H3StaleSlot trace with file-less sessions: the demoted session inherits the primary's session manager on /reload, so the ticket key alone still matches (the #3835 review); the demoted successor's discard ("demotedDiscard") removes the slot first.
CONSTANTS
    Transitions = {"New","Resume","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard"}
    FileLess = {"A","N","F","C","S","T"}
    MaxSteps = 5
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HandoffOnce NoCrossSessionAdoption
CHECK_DEADLOCK FALSE
