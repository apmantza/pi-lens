\* expect: violated FleetOwnersLive
\* module: SessionLifecycle
\* Pre-#3755 (F1 of #3803, #3733 N4 of #3609): the LSP service generation was a counter of each entry-module evaluation, so a /reload that re-evaluates the module restarts it at 0. LSP work begun in generation 0 lands in the new evaluation's generation 0 and spawns a server for the retired scope. NoCrossSessionState compares only the generation, which now repeats, and cannot see it (BlindMut3755GenPerEval); the owner-live invariant does.
CONSTANTS
    Transitions = {"Reload","New","IdleReset"}
    Writers = {"lsp"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","perEvalSvc"}
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK FleetOwnersLive
CHECK_DEADLOCK FALSE
