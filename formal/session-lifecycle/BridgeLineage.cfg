\* expect: pass
\* module: SessionLifecycle
\* #3803 M4, #3759 S3 + #3705 + #3763: the mutation bridge's producer carries the lineage handle it captured and its branch epoch (the settled sweep, ast_grep_replace). A retired scope's stamp, turn-state range and deferral are dropped; the live primary's own edit still queues and the drain credits at the live epoch. Rows 5-8 of #3705 across /new, /reload and /tree.
CONSTANTS
    Transitions = {"New","Reload","Tree","DeferOwn","DrainDefer"}
    Writers = {"bridge"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown","bridgeStamp","bridgeRanges","bridgeDefer","bridgeEpoch","bridgeLineage","deferAboveIgnore","deferResetClear"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoOwnDrop SecondaryIsolation HandoffOnce OneResetPerScope
CHECK_DEADLOCK FALSE
