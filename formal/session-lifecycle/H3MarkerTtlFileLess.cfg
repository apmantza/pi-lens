\* expect: pass
\* module: SessionLifecycle
\* A mixed file-backed/file-less population: ticketKey keeps a post-expiry primary subagent's own /reload or /fork from taking the primary's slot on the file-less ticket path.
CONSTANTS
    Transitions = {"Reload","Fork","SecStart","SecBindReplace","SecReload","SecFork","SecNew","SecRoleless","MarkerExpire"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown","rolelessKey","markerTtl"}
    FileLess = {"A"}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK ExpiredGapAdmits HasPrimary NoLostCarryUntilExpiry HandoffOnce NoCrossSessionAdoption NoForeignFact
CHECK_DEADLOCK FALSE
