\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3855 r2: there is no note to evict; a subagent's own /reload in the primary's /reload gap is declined by the named pair alone.
CONSTANTS
    Transitions = {"Reload","SecStart","SecReload","Evict"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostCarry PrimaryIsUsers HasPrimary
CHECK_DEADLOCK FALSE
