\* expect: pass
\* module: SessionLifecycle
\* Merged S2 slot, file-backed sessions: a subagent's own /reload or /fork classified primary in the primary's replacement gap (#3668 row 17) never matches the primary's slot, whose key names another file.
CONSTANTS
    Transitions = {"New","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionAdoption
CHECK_DEADLOCK FALSE
