\* expect: violated ParkedStaysInScope
\* module: SessionLifecycle
\* Design alternative: resetForSession does not clear the park map. The key is the stable session id, which /reload keeps, so the successor takes the item its predecessor parked.
CONSTANTS
    Transitions = {"New","Reload","SecStart","ParkTake"}
    Writers = {"park"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown","parkSessionKey","parkFence"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK ParkedStaysInScope
CHECK_DEADLOCK FALSE
