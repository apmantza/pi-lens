\* expect: pass
\* module: SessionLifecycle
\* Fixed in #3855 r5 (verify r3 V3, verify r4 V6): an in-memory /new whose start a /reload interrupts, in any window (before or after the start held its scope), runs on a manager no stash bound; the naming site binds a fresh ticket ("nameAtShutdown"), so a gap subagent's own in-memory /reload or an SDK reload bind (no key) stays secondary. Mut3855r3InterruptedNewGap (no rule) and Mut3855r4PreScope (the r4 forward bind) keep the violations.
CONSTANTS
    Transitions = {"New","Interrupt","InterruptPreScope","SecStart","SecReload","SecBindReplace"}
    Writers = {"activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {"N","S"}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK PrimaryIsUsers HasPrimary NoLostActivation
CHECK_DEADLOCK FALSE
