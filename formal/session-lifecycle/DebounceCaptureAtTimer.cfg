\* expect: violated NoCrossSessionState
\* module: SessionLifecycle
\* #3596 G, row 16 of #3759: the handler captures at entry, but the debounce re-entry (scheduleDebounced) captures the session at timer time, so a session-1 tool_result whose timer fires after the replacement is the live session's.
CONSTANTS
    Transitions = {"New","Reload","Tree"}
    Writers = {"debounce"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState
CHECK_DEADLOCK FALSE
