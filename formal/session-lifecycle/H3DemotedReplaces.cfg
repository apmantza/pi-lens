\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3855 r2 (review F2): no gap start demotes the real successor, so the user's conversation is never left to replace itself as a secondary in a subagent's gap.
CONSTANTS
    Transitions = {"Reload","SecStart","SecNew","New","SecReload"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {"U"}
    MaxSteps = 5
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK UserNotDeclined PrimaryIsUsers HasPrimary
CHECK_DEADLOCK FALSE
