\* expect: violated AdvisoryStaysInSession
\* module: SessionLifecycle
\* #3881 r2 F1: H3Interrupted without "forwardPolicy". The interrupted /fork start's slot is forwarded with every store, so the inner /reload's start carries the parent's queued advisory into the fork (AD: fork none, reload carry) and a context call there delivers it. Authorship (read-guard-authorship: fork reset, reload adopt) crosses the same way, but RG conflates it with reads, so only the runtime witness pins it.
CONSTANTS
    Transitions = {"New","Resume","Fork","Reload","Interrupt"}
    Writers = {"read","activate","advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK AdvisoryStaysInSession
CHECK_DEADLOCK FALSE
