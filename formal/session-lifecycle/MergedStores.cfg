\* expect: pass
\* module: SessionLifecycle
\* Merged master, the S2 stores: the lazy-tool activations and the advisory queue across every transition that moves them, three in a row, with a subagent.
CONSTANTS
    Transitions = {"New","Resume","Fork","Clone","Reload","Quit","PiFork","Tree","SecStart","SecEnd"}
    Writers = {"advisory","activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HasPrimary NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce NoCrossSessionAdoption OrderMonotone OneResetPerScope NoForeignFact NoForeignActivation NoLostActivation SecondaryKeepsActivation NoCrossSessionDelivery NoLostAdvisory
CHECK_DEADLOCK FALSE
