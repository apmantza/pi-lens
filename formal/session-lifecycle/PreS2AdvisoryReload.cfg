\* expect: violated NoLostAdvisory
\* module: SessionLifecycle
\* #3612, pre-S2 (ae5396e46, which has #3757's per-scope queue): no advisory store, so an advisory still queued at /reload's shutdown is pruned as its scope's and never reaches the reloaded session.
CONSTANTS
    Transitions = {"Reload"}
    Writers = {"advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 1
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- LegacyPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostAdvisory
CHECK_DEADLOCK FALSE
