\* expect: pass
\* module: SessionLifecycle
\* Shipped #3613 R2: each work record carries its producing activation and a turn_end drains its own. A subagent's turn_end never touches the primary's worklist, and across /new and /reload nothing is drained twice or by another scope.
CONSTANTS
    Transitions = {"SecStart","TurnWork","TurnEnd","SecTurnEnd","New","Reload"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown","turnEndScoped"}
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK SecondaryIsolation NoCrossSessionState
CHECK_DEADLOCK FALSE
