\* expect: violated NoCrossSessionAdoption
\* module: SessionLifecycle
\* #3819's fix without "ticketKey": H3FileLess with only "demotedDiscard". The subagent's own /reload or /fork classifies primary before the real successor starts, so it matches (reason, undefined) and takes the primary's slot.
CONSTANTS
    Transitions = {"New","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","demotedDiscard"}
    FileLess = {"A","N","F","C","S","T"}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionAdoption
CHECK_DEADLOCK FALSE
