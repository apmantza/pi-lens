\* expect: violated HandoffOnce
\* module: SessionLifecycle
\* F2, section 3.4 as written: a subagent's session_start between /reload's shutdown and start (I6) takes the hand-off slot and discards it as unmatched.
CONSTANTS
    Transitions = {"SecStart","Reload"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope NoForeignFact
CHECK_DEADLOCK FALSE
