\* expect: violated NoEarlyTeardown
\* module: SessionLifecycle
\* Pre-fix #4554: the shared session teardown ran at EVERY primary shutdown, not at the activation's last live member's leave. One activation serves M and S1 (SecStart); M's /new then empties the registry entry and bumps the LSP service generation, retiring the fleet its live sibling still drives.
CONSTANTS
    Transitions = {"SecStart","New"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown"}
    TeardownAtLastMember = FALSE
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoEarlyTeardown
CHECK_DEADLOCK FALSE
