\* expect: violated NoCrossSessionState
\* module: SessionLifecycle
\* Pre-S3 (eb96119df): the settle's turn-state range, summary and git-guard latch resolve the module-level runtime when they land, so a session-1 tool_result that settles after /new or /reload writes session 2's coordinator.
CONSTANTS
    Transitions = {"New","Reload","Tree"}
    Writers = {"stateW","debounce"}
    FixParts = {"handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState
CHECK_DEADLOCK FALSE
