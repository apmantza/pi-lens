\* expect: violated NoLostAdvisory
\* module: SessionLifecycle
\* Pre-#3855 (#3668 row 17), file-backed, as Pre3855DemoteCarry: the demoted real successor never re-queues the advisory its predecessor left in the slot. H3DemoteAdvisory is the fix.
CONSTANTS
    Transitions = {"Reload","SecStart","SecReload","SecFork"}
    Writers = {"advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostAdvisory
CHECK_DEADLOCK FALSE
