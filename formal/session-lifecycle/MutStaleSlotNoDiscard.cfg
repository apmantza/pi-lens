\* expect: violated HandoffOnce
\* module: SessionLifecycle
\* #3819's fix without "demotedDiscard": H3StaleSlot with only "ticketKey". The demoted real successor leaves the reload slot in place, and the demoted session's later /reload takes it, from a start that did not replace the scope that left it.
CONSTANTS
    Transitions = {"New","Resume","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey"}
    FileLess = {}
    MaxSteps = 5
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HandoffOnce NoCrossSessionAdoption
CHECK_DEADLOCK FALSE
