\* expect: violated NoLostActivation
\* module: SessionLifecycle
\* #3855 (#3668 row 17), file-backed: NoLostActivation covers every live scope. Its shortest counterexample is a subagent's own /fork, which starts without the subagent's activations (a secondary never stashes, saves a sidecar or adopts); row 17's demoted real successor, which never adopts the primary's activations, is caught after a longer trace.
CONSTANTS
    Transitions = {"Reload","SecStart","SecReload","SecFork"}
    Writers = {"activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostActivation
CHECK_DEADLOCK FALSE
