\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3855, file-backed, as H3DemoteCarry: the real successor adopts the primary's activations. NoLostActivation covers the primary's conversations; the subagent's own replacement is AcceptedSecondaryForkActivation's. Pre3855DemoteActivation keeps the pre-fix violation.
CONSTANTS
    Transitions = {"Reload","SecStart","SecReload","SecFork"}
    Writers = {"activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HasPrimary NoLostActivation
CHECK_DEADLOCK FALSE
