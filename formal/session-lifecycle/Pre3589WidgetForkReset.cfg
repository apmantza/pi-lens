\* expect: violated NoLostWidget
\* module: SessionLifecycleF1
\* Pre-#3589 (F1 of #3803), 1e109b2fa^: the widget's fork start resets the rows and the guards together (LegacyPolicy), so an in-process /fork loses the parent's verdicts the design carries. H3WidgetToken is the fix.
CONSTANTS
    Transitions = {"Fork","WidgetPipe"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","widgetFence"}
    FileLess = {}
    MaxSteps = 1
    MaxTurns = 1
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- LegacyPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION SpecF1
INVARIANTS TypeOKF1 NoLostWidget
CHECK_DEADLOCK FALSE
