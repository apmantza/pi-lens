\* expect: pass
\* module: SessionLifecycle
\* F1 bound: when the read-guard writer holds its branch's newest entry (its handler did not outlive a later entry), /tree and /fork drop only reads whose entry left the branch, so no false block.
CONSTANTS
    Transitions = {"Tree","Fork"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 0
    ForwardExpiredUnstarted = TRUE
    LateHandlers = FALSE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoFalseBlock NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope NoForeignFact
CHECK_DEADLOCK FALSE
