\* expect: violated ExpiredGapAdmits
\* module: SessionLifecycle
\* Design alternative to #3668 (F1 of #3803): a successor-pending marker with no TTL. The primary's /reload leaves a successor that never starts, time passes (MarkerExpire), and a later subagent start is still declined as not the successor: the process has no primary for as long as the successor does not come. H3MarkerTtl is the shipped marker (SUCCESSOR_PENDING_TTL_MS).
CONSTANTS
    Transitions = {"Reload","SecStart","MarkerExpire"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK ExpiredGapAdmits
CHECK_DEADLOCK FALSE
