\* expect: violated UserNotDeclined
\* module: SessionLifecycle
\* #3855 r1 (review F2, probe PR1): after the R1 demotion the subagent's start holds the primary slot; it runs /new, and the demoted user conversation's own /reload in that gap finds its own note and is declined, so the subagent's successor keeps the primary.
CONSTANTS
    Transitions = {"Reload","SecStart","SecNew","New","SecReload"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","inheritRole"}
    FileLess = {"U"}
    MaxSteps = 5
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK UserNotDeclined
CHECK_DEADLOCK FALSE
