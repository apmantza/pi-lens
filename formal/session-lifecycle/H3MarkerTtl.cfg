\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3668 (F1 of #3803), file-backed: the successor-pending marker expires (MarkerExpire, no clock). A live successor before expiry is primary and adopts its slot; after expiry every start in the gap classifies primary, none is declined, and the slot is still taken only by the start that replaced its writer. The real successor arriving after expiry is the accepted loss of AcceptedLateSuccessor and is exempt from NoLostCarryUntilExpiry.
CONSTANTS
    Transitions = {"Reload","Fork","SecStart","SecBindReplace","SecReload","SecFork","SecNew","SecRoleless","MarkerExpire"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown","rolelessKey","markerTtl"}
    FileLess = {}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK ExpiredGapAdmits HasPrimary NoLostCarryUntilExpiry HandoffOnce NoCrossSessionAdoption NoForeignFact
CHECK_DEADLOCK FALSE
