\* expect: violated NoLostCarry
\* module: SessionLifecycle
\* #3855 r1: eviction at the cap. Unmodelled subagents' notes push the gap subagent's note out, so its own /reload start classifies primary and the real successor is demoted and loses the reads.
CONSTANTS
    Transitions = {"Reload","SecStart","SecReload","Evict"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","inheritRole"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostCarry
CHECK_DEADLOCK FALSE
