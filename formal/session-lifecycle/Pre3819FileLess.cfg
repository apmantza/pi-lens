\* expect: violated NoCrossSessionAdoption
\* module: SessionLifecycle
\* Pre-fix twin of H3FileLess (#3819, hypothesis 3 of #3803), as merged S2 shipped it: file-less sessions key the slot on (reason, undefined), so a subagent's own /reload or /fork classified primary in the primary's replacement gap (#3668 row 17) takes the primary's slot.
CONSTANTS
    Transitions = {"New","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {"A","N","F","C","S","T"}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionAdoption
CHECK_DEADLOCK FALSE
