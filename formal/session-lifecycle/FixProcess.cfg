\* expect: pass
\* module: SessionLifecycle
\* Adopted design: the registry heartbeat and LSP work in flight across /new, resume, /reload, the LSP idle reset, quit and pi --fork.
CONSTANTS
    Transitions = {"New","Resume","Reload","IdleReset","Quit","PiFork"}
    Writers = {"heartbeat","lsp"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope NoForeignFact
CHECK_DEADLOCK FALSE
