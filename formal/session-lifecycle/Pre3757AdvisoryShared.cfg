\* expect: violated NoCrossSessionDelivery
\* module: SessionLifecycle
\* #3748, pre-#3757 (61c6ee644): the advisory queue was untagged, so a subagent's context call took the primary's advisory.
CONSTANTS
    Transitions = {"SecStart"}
    Writers = {"advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop"}
    FileLess = {}
    MaxSteps = 1
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionDelivery
CHECK_DEADLOCK FALSE
