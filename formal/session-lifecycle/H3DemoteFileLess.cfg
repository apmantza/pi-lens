\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3855 with file-less sessions: the subagent's own /reload or /fork in the gap keeps the secondary role, so the real successor keeps the conversation's reads, advisory and activations, and takes no slot it was not left.
CONSTANTS
    Transitions = {"Reload","SecStart","SecReload","SecFork"}
    Writers = {"read","activate","advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {"A","N","F","C","S","T"}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HasPrimary NoLostCarry NoLostAdvisory NoLostActivation HandoffOnce NoCrossSessionAdoption
CHECK_DEADLOCK FALSE
