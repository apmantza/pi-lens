\* expect: violated NoCrossSessionState
\* module: SessionLifecycle
\* Registry family (#3498): a heartbeat resolves its root from the process intent before the new session's queued registration lands, and re-registers the ended session's root.
CONSTANTS
    Transitions = {"New"}
    Writers = {"heartbeat"}
    FixParts = {"handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 1
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope NoForeignFact
CHECK_DEADLOCK FALSE
