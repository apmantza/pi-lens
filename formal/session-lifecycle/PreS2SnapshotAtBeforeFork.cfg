\* expect: violated NoLostCarry
\* module: SessionLifecycle
\* Pre-S2 (ae5396e46, #3669's stashForkHandoff in the session_before_fork handler), the D3 check: the fork's read-set was snapshot at session_before_fork, so a read that lands before session_shutdown is missing from the fork. S2 stashes at session_shutdown and deleted the handler.
CONSTANTS
    Transitions = {"Fork"}
    Writers = {"read"}
    FixParts = {"entryCapture","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 1
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope NoForeignFact
CHECK_DEADLOCK FALSE
