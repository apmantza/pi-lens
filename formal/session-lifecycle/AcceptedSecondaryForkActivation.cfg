\* expect: violated SecondaryKeepsActivation
\* module: SessionLifecycle
\* #3855's answer to the #3835 r2 question, accepted: a secondary never stashes or adopts, so a subagent's own /fork or /reload starts without the activations its conversation made, whether or not it lands in a primary's gap. A secondary hand-off would flip this config to pass.
CONSTANTS
    Transitions = {"SecStart","SecReload","SecFork"}
    Writers = {"activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK SecondaryKeepsActivation
CHECK_DEADLOCK FALSE
