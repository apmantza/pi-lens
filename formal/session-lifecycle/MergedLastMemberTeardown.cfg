\* expect: pass
\* module: SessionLifecycle
\* #4554: one activation serves M and its siblings. The shared teardown (the whole registry entry, and the LSP service generation with its fleet) runs once, at the LAST live member's leave: M's /new with S1 still live leaves both alone (NoEarlyTeardown), S1's own shutdown or its /reload then tears down, a single-member activation still tears down at its own leave, and quit ends every live scope and tears down.
CONSTANTS
    Transitions = {"SecStart","SecEnd","SecReload","New","Reload","Resume","Quit"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown"}
    TeardownAtLastMember = TRUE
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoEarlyTeardown NoCrossSessionState OneResetPerScope SecondaryIsolation HandoffOnce
CHECK_DEADLOCK FALSE
