\* expect: pass
\* module: SessionLifecycle
\* Adopted design (D1-D8 and the 2026-09-30 F1/F2 decisions): every transition, three in a row, the primary's and a subagent's read-guard writers in flight, one turn.
CONSTANTS
    Transitions = {"New","Resume","Fork","Clone","CancelFork","Reload","Quit","PiFork","Tree","IdleReset","SecStart","SecEnd","SecTurn","Dup"}
    Writers = {"read","secRead"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 1
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope NoForeignFact
CHECK_DEADLOCK FALSE
