\* expect: pass
\* module: SessionLifecycle
\* #3819, the carry direction of the ticket key: a file-less /reload's successor finds its predecessor's ticket on the session manager pi hands it, so it still takes the slot while a subagent binds in the gap, and loses neither an activation nor a queued advisory.
CONSTANTS
    Transitions = {"Reload","SecStart"}
    Writers = {"activate","advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","namedSuccessor","nameAtShutdown"}
    FileLess = {"A","N","F","C","S","T"}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HasPrimary NoLostActivation SecondaryKeepsActivation NoLostAdvisory NoForeignActivation NoCrossSessionDelivery HandoffOnce
CHECK_DEADLOCK FALSE
