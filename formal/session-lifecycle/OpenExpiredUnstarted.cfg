\* expect: violated NoLostActivation
\* module: SessionLifecycle
\* Open defect witness for #4220 (F1 of #3803): after the successor-pending marker expires, a W0 /fork interrupt forwards neither the handoff nor a stash, so the inner reload misses the slot. This reopens closed #4113 and needs a maintainer decision.
CONSTANTS
    Transitions = {"Fork","InterruptUnstarted","MarkerExpire"}
    Writers = {"activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown","forwardUnstarted","markerTtl"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = FALSE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostActivation
CHECK_DEADLOCK FALSE
