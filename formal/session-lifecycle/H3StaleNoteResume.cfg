\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3855 r2 (review F3): a subagent's reload whose start never comes leaves nothing behind, so the primary's resume of that subagent's file is the named successor and the process keeps a primary.
CONSTANTS
    Transitions = {"SecStart","SecReload","ResumeSub"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HasPrimary PrimaryIsUsers
CHECK_DEADLOCK FALSE
