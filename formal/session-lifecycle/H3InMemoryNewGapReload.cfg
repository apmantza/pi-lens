\* expect: pass
\* module: SessionLifecycle
\* #3855 r2, row 12: in the primary's own in-memory /new gap the named pair is (new, none). A file-less subagent's own /reload also carries no key, so only the start reason tells them apart: it stays secondary, and the real successor is primary.
CONSTANTS
    Transitions = {"New","SecStart","SecReload"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown"}
    FileLess = {"N","S"}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK PrimaryIsUsers HasPrimary UserNotDeclined
CHECK_DEADLOCK FALSE
