\* expect: pass
\* module: SessionLifecycle
\* #3819: H3FileLess with activations and advisories in play. Under the ticket key, a subagent's own /reload or /fork classified primary in the primary's replacement gap (#3668 row 17) adopts neither the primary's lazy-tool activations nor its queued advisories.
CONSTANTS
    Transitions = {"New","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {"activate","advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard"}
    FileLess = {"A","N","F","C","S","T"}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionAdoption NoForeignActivation NoCrossSessionDelivery
CHECK_DEADLOCK FALSE
