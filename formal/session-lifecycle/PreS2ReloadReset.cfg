\* expect: violated NoLostCarry
\* module: SessionLifecycle
\* Pre-S2 (ae5396e46, before #3777), N1 under D5: every primary session_start ran resetForSession and /reload imported nothing, so the unchanged conversation lost every read and authorship record it had. S2 carries them through the slot.
CONSTANTS
    Transitions = {"Reload"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 1
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- LegacyPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostCarry
CHECK_DEADLOCK FALSE
