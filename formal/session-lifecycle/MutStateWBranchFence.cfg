\* expect: violated NoOwnDrop
\* module: SessionLifecycle
\* Design alternative: the S3 non-read-guard writers fenced at branch level like the read guard (MutSettleDuringTree). A /tree between a tool_result's entry and its settle drops a live session's own turn-state range, summary or git-guard latch. S3 fences them by the session's scope.
CONSTANTS
    Transitions = {"Tree"}
    Writers = {"stateW","debounce"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown","debounceEntryCapture","stateWBranchFence"}
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoOwnDrop
CHECK_DEADLOCK FALSE
