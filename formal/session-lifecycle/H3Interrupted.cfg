\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3881, file-backed: a /reload, /fork or resume start is interrupted before it adopts by its own /reload (a handler ordered before pi-lens scheduled AgentSession.reload()); that shutdown re-keys the slot left for the start to its /reload ("forwardUnadopted"), so the inner reload's start takes the conversation's reads, activations and advisory. Pre3881Interrupted keeps the pre-fix violation.
CONSTANTS
    Transitions = {"New","Resume","Fork","Reload","Interrupt"}
    Writers = {"read","activate","advisory"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostCarry NoLostActivation NoLostAdvisory HandoffOnce NoCrossSessionAdoption NoForeignFact NoForeignActivation NoCrossSessionDelivery AdvisoryStaysInSession
CHECK_DEADLOCK FALSE
