\* expect: pass
\* module: SessionLifecycleF1
\* Master's widget write token (F1 of #3803): two pipeline runs, each a diagnostics verb and a runner verb that land in either order at any later step, across /new, /reload, /fork, and quit with pi --fork (a new process restarts the order turn). The guard drops an older token and admits a tie (>=), so the widget shows the newest write of each verb; a /reload or /fork start carries the rows (WidgetStore policy). Master has no scope fence, so lineage is intentionally not claimed here.
CONSTANTS
    Transitions = {"New","Reload","Fork","Quit","PiFork","WidgetPipe"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 3
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION SpecF1
INVARIANTS TypeOKF1 ShowsNewest NoOwnDropWidget NoLostWidget
CHECK_DEADLOCK FALSE
