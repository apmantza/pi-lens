    Slots = {1, 2}
    Peek = "owned"
    Drain = "owned"
    Requeue = "carry"
    NoHandle = "drop"
SPECIFICATION Spec
INVARIANTS TypeOK NoDropFreshAnswer NoStaleAdmission
CHECK_DEADLOCK FALSE
