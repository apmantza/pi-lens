\* expect: violated NoStaleAdmission
\* module: RunnerStore
\* Pre-fix #3814: the commit gate's peek admitted every settled answer
\* without the drain's owned-admission, so a retired scope's answer still
\* reached the blocker state.
CONSTANTS
    Slots = {1, 2}
    Peek = "unfenced"
    Drain = "owned"
    Requeue = "carry"
    NoHandle = "admit"
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleAdmission NoDropFreshAnswer
CHECK_DEADLOCK FALSE
