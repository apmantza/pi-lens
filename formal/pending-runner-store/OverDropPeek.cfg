\* expect: violated NoDropFreshAnswer
\* module: RunnerStore
\* Over-drop mutant of the gate's read (shape 54): the sole fresh answer is
\* filtered out, so a commit passes on a blocker that is still live.
CONSTANTS
    Slots = {1, 2}
    Peek = "none"
    Drain = "owned"
    Requeue = "carry"
    NoHandle = "admit"
SPECIFICATION Spec
INVARIANTS TypeOK NoDropFreshAnswer NoStaleAdmission
CHECK_DEADLOCK FALSE
