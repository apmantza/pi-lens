\* expect: violated NoStaleAdmission
\* module: RunnerStore
\* Mutant of the #3758 drain fence: the turn-end reader admits every settled
\* answer, so a retired scope's answer is delivered by the next turn end.
CONSTANTS
    Slots = {1, 2}
    Peek = "owned"
    Drain = "unfenced"
    Requeue = "carry"
    NoHandle = "admit"
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleAdmission NoDropFreshAnswer
CHECK_DEADLOCK FALSE
