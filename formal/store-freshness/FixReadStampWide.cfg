    SizeMode = "any"
    MaxTime = 8
    Tol = 2
    Gran = 1
    Skew = 1
    MinReadDelay = 0
    Stamp = "start"
    Gate = "mtime"
    ForceHash = FALSE
    SizeOnly = FALSE
    StatAt = "before"
    SizeKey = TRUE
    Binding = FALSE
    BindingAt = "read"
    MaxServes = 3
    Latch = TRUE
    AllowRegress = FALSE
    ServerLag = FALSE
SPECIFICATION Spec
INVARIANTS NoStaleServeBeyondTol NoSpuriousDemotion
CHECK_DEADLOCK FALSE
