\* expect: violated NoStaleServe
\* module: StoreFreshness
\* Mutant (the code before #3505): runWorkspaceDiagnostics read the bytes (pre-open, or processFile's own read) BEFORE the stat that records mtime+size; a version-less touch or a warm-attach answer carries no contentHash.
CONSTANTS
    Writes = 2
    SizeMode = "any"
    MaxTime = 6
    Tol = 2
    Gran = 1
    Skew = 1
    MinReadDelay = 0
    Stamp = "end"
    Gate = "eq"
    ForceHash = FALSE
    SizeOnly = FALSE
    StatAt = "after"
    SizeKey = TRUE
    Binding = FALSE
    BindingAt = "read"
    MaxServes = 2
    Latch = FALSE
    AllowRegress = FALSE
    ServerLag = FALSE
SPECIFICATION Spec
INVARIANTS NoStaleServe
CHECK_DEADLOCK FALSE
