\* expect: violated NoSpuriousDemotion
\* module: StoreFreshness
\* Fix mutant: tolerance 0 under a 1-tick mtime lead (#1710 skew). A write BEFORE the stamp demotes a result computed on the bytes still on disk: the tolerance is load-bearing.
CONSTANTS
    Writes = 2
    SizeMode = "any"
    MaxTime = 6
    Tol = 0
    Gran = 1
    Skew = 1
    MinReadDelay = 0
    Stamp = "start"
    Gate = "mtime"
    ForceHash = FALSE
    SizeOnly = FALSE
    StatAt = "before"
    SizeKey = TRUE
    Binding = FALSE
    BindingAt = "read"
    MaxServes = 2
    Latch = FALSE
    AllowRegress = FALSE
    ServerLag = FALSE
SPECIFICATION Spec
INVARIANTS NoStaleServeBeyondTol NoSpuriousDemotion
CHECK_DEADLOCK FALSE
