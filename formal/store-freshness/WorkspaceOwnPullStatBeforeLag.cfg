\* expect: violated NoStaleServe
\* module: StoreFreshness
\* Fix mutant for the pull path: a stat taken before the request is not enough when the server answers from bytes it read earlier.
CONSTANTS
    Writes = 2
    SizeMode = "any"
    MaxTime = 6
    Tol = 2
    Gran = 1
    Skew = 1
    MinReadDelay = 0
    Stamp = "end"
    Gate = "eq"
    ForceHash = FALSE
    SizeOnly = FALSE
    StatAt = "before"
    SizeKey = TRUE
    Binding = FALSE
    BindingAt = "read"
    MaxServes = 2
    Latch = FALSE
    AllowRegress = FALSE
    ServerLag = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleServe
CHECK_DEADLOCK FALSE
