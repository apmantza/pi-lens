\* expect: violated NoStaleServeBeyondTol
\* module: StoreFreshness
\* Mutant: no mtime gate at all. Non-vacuity of the freshness gate every late-stamp store applies.
CONSTANTS
    Writes = 2
    SizeMode = "any"
    MaxTime = 6
    Tol = 2
    Gran = 1
    Skew = 1
    MinReadDelay = 0
    Stamp = "end"
    Gate = "none"
    ForceHash = FALSE
    SizeOnly = FALSE
    StatAt = "before"
    SizeKey = TRUE
    Binding = FALSE
    BindingAt = "read"
    MaxServes = 2
    Latch = FALSE
    AllowRegress = FALSE
    ServerLag = FALSE
SPECIFICATION Spec
INVARIANTS NoStaleServeBeyondTol
CHECK_DEADLOCK FALSE
