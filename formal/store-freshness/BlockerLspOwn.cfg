    ForceHash = TRUE
    SizeOnly = FALSE
    StatAt = "before"
    SizeKey = TRUE
    Binding = FALSE
    BindingAt = "read"
    MaxServes = 2
    Latch = FALSE
    AllowRegress = TRUE
