\* expect: violated NoStaleServe
\* module: StoreFreshness
\* Admitted (#2300 doc): a same-size rewrite inside one coarse mtime granule is invisible to the (mtime, size) key without a binding.
CONSTANTS
    Writes = 2
    SizeMode = "same"
    MaxTime = 6
    Tol = 2
    Gran = 4
    Skew = 1
    MinReadDelay = 0
    Stamp = "end"
    Gate = "eq"
    ForceHash = FALSE
    SizeOnly = FALSE
    StatAt = "before"
    SizeKey = TRUE
    Binding = FALSE
    BindingAt = "read"
    MaxServes = 2
    Latch = FALSE
    AllowRegress = FALSE
    ServerLag = FALSE
SPECIFICATION Spec
INVARIANTS NoStaleServe
CHECK_DEADLOCK FALSE
