\* expect: violated NewestSaveLands
\* module: SnapshotFreshness
\* Round-1 design (review B2): an incomplete view stamped seq -1 loses the compare-and-set to every stamped snapshot, so it never lands. One process is enough: a timed-out seed followed by one edit latches it.
CONSTANTS
    Procs = {p1}
    MaxEdits = 3
    LogAlloc = TRUE
    CompleteStamp = TRUE
    SeqCAS = TRUE
    ColdSeeds = TRUE
    NeverSeqMutant = TRUE
    RefuseAllMutant = FALSE
    AlwaysIncompleteMutant = FALSE
SPECIFICATION Spec
INVARIANTS FreshMeansComplete BoundedReplayExact FreshForOwnRuntime NewestSaveLands IncompleteOnlyWhenMissing
CHECK_DEADLOCK FALSE
