\* expect: violated IncompleteOnlyWhenMissing
\* module: SnapshotFreshness
\* No-drop witness (review M1): stamping every save incomplete passes the freshness invariants alone, and nothing is ever served fresh.
CONSTANTS
    Procs = {p1}
    MaxEdits = 2
    LogAlloc = TRUE
    CompleteStamp = TRUE
    SeqCAS = TRUE
    ColdSeeds = TRUE
    NeverSeqMutant = FALSE
    RefuseAllMutant = FALSE
    AlwaysIncompleteMutant = TRUE
SPECIFICATION Spec
INVARIANTS FreshMeansComplete BoundedReplayExact FreshForOwnRuntime NewestSaveLands IncompleteOnlyWhenMissing
CHECK_DEADLOCK FALSE
