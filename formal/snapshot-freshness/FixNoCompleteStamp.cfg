\* expect: violated FreshMeansComplete
\* module: SnapshotFreshness
\* Fix minus the incomplete flag: a unique seq above a sibling's entry the runtime never folded.
CONSTANTS
    Procs = {p1, p2}
    MaxEdits = 4
    LogAlloc = TRUE
    CompleteStamp = FALSE
    SeqCAS = TRUE
    ColdSeeds = TRUE
    UnlockedEdits = FALSE
    ReaderRule = "tag"
    NeverSeqMutant = FALSE
    RefuseAllMutant = FALSE
    AlwaysIncompleteMutant = FALSE
SPECIFICATION Spec
INVARIANTS FreshMeansComplete BoundedReplayExact FreshForOwnRuntime NewestSaveLands IncompleteOnlyWhenMissing
CHECK_DEADLOCK FALSE
