\* expect: violated FreshMeansComplete
\* module: SnapshotFreshness
\* The review's first prescription (R2-F1): distrust only a snapshot whose seq two entries share. The lock holder's next edit moves its snapshot above the collision.
CONSTANTS
    Procs = {p1, p2}
    MaxEdits = 3
    LogAlloc = TRUE
    CompleteStamp = TRUE
    SeqCAS = TRUE
    ColdSeeds = TRUE
    UnlockedEdits = TRUE
    ReaderRule = "dup"
    NeverSeqMutant = FALSE
    RefuseAllMutant = FALSE
    AlwaysIncompleteMutant = FALSE
SPECIFICATION Spec
INVARIANTS FreshMeansComplete BoundedReplayExact FreshForOwnRuntime NewestSaveLands IncompleteOnlyWhenMissing
CHECK_DEADLOCK FALSE
