\* expect: pass
\* module: SnapshotFreshness
\* The code, two processes: only a complete snapshot carries the bounded-replay base, so the bounded replay equals the full replay (#3511; violated BoundedReplayExact before).
CONSTANTS
    Procs = {p1, p2}
    MaxEdits = 2
    LogAlloc = TRUE
    CompleteStamp = TRUE
    SeqCAS = TRUE
    ColdSeeds = TRUE
    UnlockedEdits = FALSE
    ReaderRule = "tag"
    NeverSeqMutant = FALSE
    RefuseAllMutant = FALSE
    AlwaysIncompleteMutant = FALSE
SPECIFICATION Spec
INVARIANTS BoundedReplayExact
CHECK_DEADLOCK FALSE
