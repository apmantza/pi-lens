\* expect: pass
\* module: SnapshotFreshness
\* Two processes: no logged entry at or below a stamped snapshot's seq is outside its view, so the bounded replay equals the full replay (#3511; violated BoundedReplayExact before, with LogAlloc and CompleteStamp FALSE).
CONSTANTS
    Procs = {p1, p2}
    MaxEdits = 2
    LogAlloc = TRUE
    CompleteStamp = TRUE
SPECIFICATION Spec
INVARIANTS BoundedReplayExact
CHECK_DEADLOCK FALSE
