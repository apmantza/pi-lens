\* expect: pass
\* module: SnapshotFreshness
\* The code, one process, timed-out seeds allowed: the seq names a tree state, and every save lands.
CONSTANTS
    Procs = {p1}
    MaxEdits = 4
    LogAlloc = TRUE
    CompleteStamp = TRUE
    SeqCAS = TRUE
    ColdSeeds = TRUE
    UnlockedEdits = FALSE
    ReaderRule = "tag"
    NeverSeqMutant = FALSE
    RefuseAllMutant = FALSE
    AlwaysIncompleteMutant = FALSE
SPECIFICATION Spec
INVARIANTS FreshMeansComplete BoundedReplayExact FreshForOwnRuntime NewestSaveLands IncompleteOnlyWhenMissing
CHECK_DEADLOCK FALSE
