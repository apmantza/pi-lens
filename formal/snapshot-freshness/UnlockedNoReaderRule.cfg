\* expect: violated FreshMeansComplete
\* module: SnapshotFreshness
\* Round-1 code (R2-F1): an unlocked append shares the lock holder's seq, and nothing tells the holder's snapshot apart.
CONSTANTS
    Procs = {p1, p2}
    MaxEdits = 3
    LogAlloc = TRUE
    CompleteStamp = TRUE
    SeqCAS = TRUE
    ColdSeeds = TRUE
    UnlockedEdits = TRUE
    ReaderRule = "none"
    NeverSeqMutant = FALSE
    RefuseAllMutant = FALSE
    AlwaysIncompleteMutant = FALSE
SPECIFICATION Spec
INVARIANTS FreshMeansComplete BoundedReplayExact FreshForOwnRuntime NewestSaveLands IncompleteOnlyWhenMissing
CHECK_DEADLOCK FALSE
