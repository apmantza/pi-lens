\* expect: pass
\* module: ReviewGraphSignatures
\* The shipped code (#3535): review-graph.json.gz never carries a signature for content the graph did not read. One process: only Writers promote, so a second reader cannot change the disk, and Evict covers the re-hydrating reader.
CONSTANTS
    Procs = {p1}
    Writers = {p1}
    Observers = {p1}
    Files = {f1}
    MaxWrites = 3
    AllowFastpath = TRUE
    FixFpNoop = TRUE
    FixFpExtract = TRUE
SPECIFICATION Spec
INVARIANTS DiskHonest
CHECK_DEADLOCK FALSE
