\* expect: pass
\* module: ReviewGraphSignatures
\* The #3535 fix: both fast-path branches record the stat taken before the hash read. Two processes, one file, two writes.
CONSTANTS
    Procs = {p1, p2}
    Writers = {p1}
    Observers = {p1}
    Files = {f1}
    MaxWrites = 2
    AllowFastpath = TRUE
    FixFpNoop = TRUE
    FixFpExtract = TRUE
SPECIFICATION Spec
INVARIANTS MemHonest DiskHonest NoStaleServedAsCurrent
CHECK_DEADLOCK FALSE
