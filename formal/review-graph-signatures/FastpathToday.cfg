\* expect: pass
\* module: ReviewGraphSignatures
\* The shipped code (#3535): the seq fast path records the candidates' stat taken before the hash read, so a write after the read is re-diffed, never served as current. The graph also extracts on a run-local FactStore (#3552, merged PR #3746), so a same-file dispatch between the content read and the derived read stays invisible and every node keeps one content version (NodeSingleVersion).
CONSTANTS
    Procs = {p1}
    Writers = {p1}
    Observers = {p1}
    Files = {f1}
    MaxWrites = 3
    AllowFastpath = TRUE
    FixFpNoop = TRUE
    FixFpExtract = TRUE
    SharedStore = FALSE
SPECIFICATION Spec
INVARIANTS NodeSingleVersion MemHonest DiskHonest NoStaleServedAsCurrent
CHECK_DEADLOCK FALSE
