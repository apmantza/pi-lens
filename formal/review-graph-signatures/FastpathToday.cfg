\* expect: pass
\* module: ReviewGraphSignatures
\* The shipped code (#3535): the seq fast path records the candidates' stat taken before the hash read, so a write after the read is re-diffed, never served as current.
CONSTANTS
    Procs = {p1}
    Writers = {p1}
    Observers = {p1}
    Files = {f1}
    MaxWrites = 3
    AllowFastpath = TRUE
    FixFpNoop = TRUE
    FixFpExtract = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleServedAsCurrent
CHECK_DEADLOCK FALSE
