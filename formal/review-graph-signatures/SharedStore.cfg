\* expect: violated NodeSingleVersion
\* module: ReviewGraphSignatures
\* Pre-#3552 (pre-PR #3746): the graph extracted on the shared dispatch store. A same-file dispatch that lands between the graph's content read and its derived read replaces the record with its own (newer) version, so one node records its content and its derived facts from two versions.
CONSTANTS
    Procs = {p1}
    Writers = {p1}
    Observers = {p1}
    Files = {f1}
    MaxWrites = 3
    AllowFastpath = TRUE
    FixFpNoop = TRUE
    FixFpExtract = TRUE
    SharedStore = TRUE
SPECIFICATION Spec
INVARIANTS NodeSingleVersion
CHECK_DEADLOCK FALSE
