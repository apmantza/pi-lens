\* expect: pass
\* module: ReviewGraphSignatures
\* Sweep and incremental paths only, two processes sharing the disk snapshot, late-loser promotions allowed: signatures never claim unread content, so a regressed snapshot is only re-diffed.
CONSTANTS
    Procs = {p1, p2}
    Writers = {p1, p2}
    Observers = {}
    Files = {f1, f2}
    MaxWrites = 2
    AllowFastpath = FALSE
    FixFpNoop = FALSE
    FixFpExtract = FALSE
SPECIFICATION Spec
INVARIANTS MemHonest DiskHonest NoStaleServedAsCurrent
CHECK_DEADLOCK FALSE
