\* expect: pass
\* module: ReviewGraphSignatures
\* The #3535 fix: both fast-path branches record the stat taken before the hash read. One process, two files, three writes.
CONSTANTS
    Procs = {p1}
    Writers = {p1}
    Observers = {p1}
    Files = {f1, f2}
    MaxWrites = 3
    AllowFastpath = TRUE
    FixFpNoop = TRUE
    FixFpExtract = TRUE
SPECIFICATION Spec
INVARIANTS MemHonest DiskHonest NoStaleServedAsCurrent
CHECK_DEADLOCK FALSE
