\* expect: pass
\* module: ReadGuard
\* #4187 R4-2: the safety half of the licensed own write. Another writer, confined
\* to the idle phases, changes the file after the bash write; OwnCall's retire ends
\* the broken authorship, and OwnWrite's Auth keeps a retired record retired, so the
\* edit of the other writer's line is refused. Trace: BashWrite, External, OwnCall
\* (retire), OwnWrite (no advance over a retired record), Edit refused. NoFalseBlock
\* is out, as in AuthorBridgeForeign: authorship is whole-file content identity, so
\* the own write's own line is refused too (the accepted cost, one re-read).
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 3
    Ops = {"bash","own","edit"}
    Spans = {1}
    ExtWrites = 1
    ExtKinds = {"replace"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
    ProvisionalCredit = FALSE
    RevokeFailedRead = TRUE
    BlockRelease = "end"
    AuthorIdentity = TRUE
    RetireAtWrite = TRUE
    AuthorBranch = TRUE
    BridgeNoAdvance = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow NoBlindAllow
CHECK_DEADLOCK FALSE
