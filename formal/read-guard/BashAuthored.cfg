\* expect: pass
\* module: ReadGuard
\* #3520 no-drop witness: a recognized bash write authors a never-read file, no other writer, so the zero-read edit after it is allowed. A guard that blocks it, or ignores `written`, reds NoFalseBlock. AgentOps = 3: a fourth op (bash, edit, bash, edit) blocks with file_modified, since a bash write leaves FileTime stale by design (#3525).
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 3
    Ops = {"bash","edit"}
    Spans = {1}
    ExtWrites = 0
    ExtKinds = {"replace","delete","insert"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow NoBlindAllow NoFalseBlock
CHECK_DEADLOCK FALSE
