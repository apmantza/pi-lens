\* expect: pass
\* module: ReadGuard
\* Current code without line hashes (a whole-file record over READ_HASH_MAX_LINES); full reads only; FileTime is the only staleness check.
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 4
    Ops = {"read","edit"}
    Spans = {1,2}
    ExtWrites = 1
    ExtKinds = {"replace","delete","insert"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = FALSE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow NoBlindAllow
CHECK_DEADLOCK FALSE
