\* expect: violated NoStaleAllow
\* module: ReadGuard
\* The documented residual (#4187 R4-6), not a defect this PR fixes: a foreign write
\* lands between the call's pre-write check and the write it licenses, inside the
\* tool's own run (ExtPhases "inflight"), and that write credits authorship over
\* bytes no check saw. Trace: BashWrite, OwnCall, External (inflight), OwnWrite,
\* Edit of the other writer's line allowed. The code has the same window, because a
\* pre-write check runs before the write it licenses and nothing after it re-checks;
\* the orchestrator files it rather than this PR fixing it.
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 3
    Ops = {"bash","own","edit"}
    Spans = {1}
    ExtWrites = 1
    ExtKinds = {"replace"}
    ExtPhases = {"idle","inflight"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
    ProvisionalCredit = FALSE
    RevokeFailedRead = TRUE
    BlockRelease = "end"
    AuthorIdentity = TRUE
    RetireAtWrite = TRUE
    AuthorBranch = TRUE
    BridgeNoAdvance = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow
CHECK_DEADLOCK FALSE
