    N0 = 3
    MaxLen = 4
    AgentOps = 4
    Ops = {"read","rread","edit"}
    Spans = {1}
    ExtWrites = 1
    ExtKinds = {"replace"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 1
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
