\* expect: pass
\* module: ReadGuard
\* #4187 F5 no-drop (maintainer decision): another writer's whitespace-only rewrite (touch, chmod, a checkout of identical bytes: a new mtime, the same bytes) keeps bash authorship, so the zero-read edit after it is allowed (NoFalseBlock). AgentOps = 2: bash, edit; a later bash on the read file is the #3525 FileTime cost (BashAuthored).
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 2
    Ops = {"bash","edit"}
    Spans = {1}
    ExtWrites = 1
    ExtKinds = {"ws"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
    ProvisionalCredit = FALSE
    RevokeFailedRead = TRUE
    BlockRelease = "end"
    AuthorIdentity = TRUE
    RetireAtWrite = TRUE
    AuthorBranch = TRUE
    BridgeNoAdvance = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow NoBlindAllow NoFalseBlock
CHECK_DEADLOCK FALSE
