\* expect: pass
\* module: ReadGuard
\* #3525 fixed: without hashes, the agent_end format drain's recordWritten credits authorship only, so FileTime still sees bytes the agent never saw.
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 3
    Ops = {"read","edit"}
    Spans = {1}
    ExtWrites = 0
    ExtKinds = {"replace"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "insert"
    Bounds = {"turn"}
    MaxBounds = 1
    Hashes = FALSE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow
CHECK_DEADLOCK FALSE
