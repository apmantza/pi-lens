\* expect: violated NoStaleAllow
\* module: ReadGuard
\* Mutant of SpanSnapshotFix without the own-edit read record (the code before #3523, which also had the own-edit rescue #3525 removed): the per-line rule needs the agent's own edit to be its newest view of the lines it wrote.
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 3
    Ops = {"read","rread","edit"}
    Spans = {1,2}
    ExtWrites = 1
    ExtKinds = {"replace","delete","insert"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 1
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = TRUE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    RecordAuthoritative = TRUE
    RecordOwnEdit = FALSE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow
CHECK_DEADLOCK FALSE
