\* expect: pass
\* module: ReadGuard
\* #4187 R4-2: the no-drop half of the owned in-process write. Its own tool_call
\* licensed the advance (OwnCall, then OwnWrite), so with no other writer the next
\* positional edit of the line it wrote is not blocked. Round 4 keyed that advance
\* on ExtWrites = 0, a bound on the other writer that is not state the code can
\* observe, so with ExtWrites = 1 and no External step the config violated
\* NoFalseBlock where the code allows, and the green run proved nothing about the
\* code (#3802). The advance now follows from the call-then-write sequencing.
\* Three agent ops, as BashAuthored: at a fourth (bash, edit, own, edit) the own
\* write's stale FileTime refuses an exact edit, which #3525 leaves stale by
\* design (recordWritten stampFileTime: false).
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 3
    Ops = {"bash","own","edit"}
    Spans = {1}
    ExtWrites = 0
    ExtKinds = {"replace"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
    ProvisionalCredit = FALSE
    RevokeFailedRead = TRUE
    BlockRelease = "end"
    AuthorIdentity = TRUE
    RetireAtWrite = TRUE
    AuthorBranch = TRUE
    BridgeNoAdvance = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow NoBlindAllow NoFalseBlock
CHECK_DEADLOCK FALSE
