\* expect: pass
\* module: ReadGuard
\* #3603 fixed (#4187): /tree and /fork keep the authorship whose write is on the kept branch (its toolResult is before the prompt), so the agent's edit of a file it wrote and never read is allowed after the move (NoFalseBlock), and nothing else is (NoStaleAllow, NoBlindAllow). AgentOps = 2 for the reason BashAuthored gives.
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 2
    Ops = {"bash","edit"}
    Spans = {1}
    ExtWrites = 0
    ExtKinds = {"replace","delete","insert"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {"turn","tree","fork"}
    MaxBounds = 2
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
    ProvisionalCredit = FALSE
    RevokeFailedRead = TRUE
    BlockRelease = "end"
    AuthorIdentity = TRUE
    RetireAtWrite = TRUE
    AuthorBranch = TRUE
    BridgeNoAdvance = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow NoBlindAllow NoFalseBlock
CHECK_DEADLOCK FALSE
