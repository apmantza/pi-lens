\* expect: pass
\* module: ReadGuard
\* #4131 fixed (#4187): a recognized bash write authors a never-read file; another writer then changes it. Authorship holds the bytes the bash write left (content identity), so the zero-read edit after the other write is refused. NoFalseBlock is not checked: content identity is whole-file, so the other writer's change of line 2 also refuses an edit of line 1 (the accepted cost, a re-read).
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 3
    Ops = {"bash","edit"}
    Spans = {1}
    ExtWrites = 1
    ExtKinds = {"replace"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
    ProvisionalCredit = FALSE
    RevokeFailedRead = TRUE
    BlockRelease = "end"
    AuthorIdentity = TRUE
    RetireAtWrite = TRUE
    AuthorBranch = TRUE
    BridgeNoAdvance = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow NoBlindAllow
CHECK_DEADLOCK FALSE
