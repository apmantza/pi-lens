id: ts-redundant-filter-map
valid:
  - 'arr.filter(fn)'
  - 'arr.map(fn)'
  - 'arr.flatMap(fn)'
  # #5094: this rule is the identity filter only. A generic filter().map()
  # chain is the filter-then-map hint (warning here was over-matching).
  - 'arr.filter(onlyPositive).map(double)'
  - 'arr.filter(x => y).map(f)'
  - 'arr.filter((x: Foo): x is Bar => x !== null).map(g)'
invalid:
  - 'arr.filter(x => x).map(fn)'
  - 'arr.filter((x) => x).map(fn)'
  - 'arr.filter(Boolean).map(fn)'
