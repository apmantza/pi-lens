id: ts-redundant-filter-map
language: typescript
severity: warning
message: arr.filter(x => x).map(...) - use flatMap or a single pass
note: |
  Identity filter only: `arr.filter(x => x).map(f)` and `arr.filter(Boolean).map(f)`.
  A generic `filter(f).map(g)` chain is not flagged: `filter-then-map` ships disabled (#5094).
metadata:
  weight: 3
  category: slop
rule:
  kind: call_expression
  any:
    - pattern: "$ARR.filter(($X) => $X).map($G)"
    - pattern: "$ARR.filter($X => $X).map($G)"
    - pattern: "$ARR.filter(Boolean).map($G)"
