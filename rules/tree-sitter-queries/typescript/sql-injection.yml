# SQL Injection Detection
# Detects unsafe interpolation in SQL-like template literals.
# The structural query keeps the common callee set, while the TypeScript-aware
# post-filter requires a known DB-package import or a SQL-leading template.
id: sql-injection
name: SQL Injection Risk
severity: error
category: security
defect_class: injection
inline_tier: blocking
language: typescript

message: "SQL injection risk — use parameterized queries, never interpolate into SQL"

description: |
  Building SQL queries with template literal interpolation is vulnerable to SQL
  injection. An attacker can craft input that escapes the query and runs arbitrary SQL.
  
  ❌ NEVER:
  db.query(`SELECT * FROM users WHERE id = ${userId}`);
  db.execute(`UPDATE users SET name = '${req.body.name}'`);
  
  ✅ ALWAYS USE PARAMETERIZED QUERIES:
  db.query('SELECT * FROM users WHERE id = $1', [userId]);
  
  Or use an ORM:
  await User.findOne({ where: { id: userId } });

query: |
  (call_expression
    function: (identifier) @SQL_FUNC
    arguments: (arguments
      (template_string (template_substitution) @INTERPOLATION) @TEMPLATE)
    (#match? @SQL_FUNC "^(query|execute|exec|run|\\$queryRaw|\\$executeRaw|\\$queryRawUnsafe|\\$executeRawUnsafe|raw|prepare)$"))
  (call_expression
    function: (member_expression
      object: (_) @OBJ
      property: (property_identifier) @SQL_FUNC)
    arguments: (arguments
      (template_string (template_substitution) @INTERPOLATION) @TEMPLATE)
    (#match? @SQL_FUNC "^(query|execute|exec|run|\\$queryRaw|\\$executeRaw|\\$queryRawUnsafe|\\$executeRawUnsafe|raw|prepare)$"))
  (call_expression
    function: (member_expression
      object: (_) @OBJ
      property: (property_identifier) @SQL_FUNC)
    arguments: (template_string (template_substitution) @INTERPOLATION) @TEMPLATE
    (#match? @SQL_FUNC "^(query|execute|exec|run|\\$queryRaw|\\$executeRaw|\\$queryRawUnsafe|\\$executeRawUnsafe|raw|prepare)$"))

metavars:
  - SQL_FUNC
  - OBJ
  - TEMPLATE
  - INTERPOLATION

post_filter: ts_sql_injection_sink

has_fix: false

tags:
  - security
  - sql-injection
  - owasp-top-10

examples:
  bad: |
    db.query(`SELECT * FROM users WHERE id = ${userId}`);
    pool.execute(`UPDATE users SET name = '${req.body.name}'`);
    await connection.run(`DELETE FROM sessions WHERE token = '${token}'`);
  
  good: |
    db.query('SELECT * FROM users WHERE id = $1', [userId]);
    pool.execute('UPDATE users SET name = ?', [req.body.name]);
    await User.findOne({ where: { id: userId } });
