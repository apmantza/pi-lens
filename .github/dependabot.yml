version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-language-server 6 declares engines.node >=22.22.2; pi-lens
      # never requires more Node than the pi host (22.19.0, #2633). Lift when
      # pi's own floor reaches 22.22.2 (maintainer decision 2026-09-09, #2714).
      - dependency-name: typescript-language-server
        update-types: ["version-update:semver-major"]
    groups:
      # @stryker-mutator/vitest-runner pins an exact peer on
      # @stryker-mutator/core, so a bump of one alone fails `npm ci` with
      # ERESOLVE (#5183 and #5191 each bumped one to 10.1.1).
      stryker:
        patterns:
          - "@stryker-mutator/*"

  - package-ecosystem: github-actions
    # The composite action under .github/actions pins the same actions/cache SHA
    # as ci.yml; tests/config/action-pin-split.test.ts reds when a bump reaches
    # only one of them (#4358).
    directories:
      - /
      - /.github/actions/tool-tree-cache
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
