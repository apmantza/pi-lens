name: Subagent-extension compat smoke (nightly)

# pi-lens's subagent-compatibility features (#473 concurrent-session guard,
# #474 instance registry + orphan reaper, #475 subagent light mode) were all
# built on reverse-engineered facts about two third-party pi extensions
# (nicobailon/pi-subagents, @tintinweb/pi-subagents) and the pi SDK itself —
# nobody has promised us these stay true across their releases. This nightly
# makes that compatibility empirical (#476):
#
#   Layer A (compat-contracts.mjs): npm-installs the real third-party
#     packages + the pi SDK and mechanically re-verifies each pinned contract
#     with a RESILIENT pattern match against the installed code. No `pi`
#     process, no LLM — this is the layer that always runs.
#
#   Layer B (compat-smoke-behavioral.mjs): installs the packed pi-lens
#     tarball into a real `pi` (same "pi-load" mechanism as
#     install-smoke.yml) and drives `pi --mode rpc` so session_start fires
#     and pi-lens loads — no LLM turn, so no model API key is needed.
#     Asserts through pi-lens's own latency-log observability that subagent
#     light mode engages/overrides correctly and that no LSP-server process
#     survives a clean pi exit (the #472 orphan class).
#
# See docs/subagent-compat.md for the full pinned-contract list, the three
# env levers, what each layer asserts, and what to do when this alerts.
#
# Failure mode: ALERT, never red. Third-party drift is not our bug to fix
# in CI — continue-on-error on both layers, then a final step opens/refreshes
# a single tracking issue (never duplicates) so a maintainer investigates on
# their own schedule, matching the low-noise pattern tool-smoke.yml's
# LSP-docs-refresh PR already established (#390). The workflow itself only
# reds on a genuine infra failure (e.g. `npm pack`/install of OUR OWN
# package failing) — both scripts exit 2 (not 1) for infra errors so that
# distinction is visible in the logs even though the step is non-blocking.

on:
  schedule:
    # Nightly 10:00 UTC, offset from the tool-smoke/grammar-health band.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compat-smoke:
    name: Subagent compat smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # create-or-update the single drift-alert issue
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: >-
          Build in-place for lib tests + dist for Layer B's install
        run: |
          npm run build
          npm run build:dist

      # Layer B needs a real `pi` on PATH — same install as install-smoke.yml's
      # pi-load job (npm-global, --ignore-scripts: pi's own postinstall hooks
      # aren't needed for a headless RPC-mode smoke).
      - name: Install pi
        run: |
          set -uxo pipefail
          # Pinned deliberately (bump by hand when a newer pi release is
          # verified — see #731).
          # pi-lens-ignore: zizmor:adhoc-packages
          npm install -g --ignore-scripts \
            @earendil-works/pi-coding-agent@0.80.10
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

      - name: Layer A — pinned-contract verification (no pi, no LLM)
        id: layer_a
        continue-on-error: true
        run: node scripts/compat-contracts.mjs

      - name: Layer B — real-pi behavioral smoke (no LLM turns)
        id: layer_b
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: sk-ant-dummy-ci-no-credits-needed
        run: node scripts/compat-smoke-behavioral.mjs

      # Alert whenever either layer's step outcome is non-success — this
      # covers BOTH real content drift and an infra failure (a dependency's
      # file layout moved, npm install failed, ...): an infra failure means
      # Layer A couldn't actually re-check anything, which is itself worth a
      # maintainer's attention, just a DIFFERENT one than drift. #2581: the
      # body used to print the raw GH step outcome ("failure") for both
      # cases under a title that always says "drift detected" — a
      # relocated file (ENOENT) got reported and re-confirmed as drift for
      # two nightly runs before anyone opened the log and found it was
      # never a contract regression. Layer A's own `outcome` output
      # (verified/drift/infra from compat-contracts.mjs, distinct from the
      # GH step outcome above) drives the wording below so the two are never
      # conflated again. Searches for the existing open alert issue by title
      # before creating a new one so repeated nightly failures refresh one
      # issue instead of piling up; the title itself stays constant so that
      # search keeps finding it regardless of which outcome kind is current.
      - name: Alert on contract drift or infra failure (create-or-update tracking issue)
        if: >-
          always() && (steps.layer_a.outcome == 'failure' ||
          steps.layer_b.outcome == 'failure' ||
          (steps.layer_a.outcome == 'success' && steps.layer_b.outcome == 'success'))
        # Tracker maintenance must not mask the smoke job's own verdict.
        continue-on-error: true
        env:
          LAYER_A_STEP_OUTCOME: ${{ steps.layer_a.outcome }}
          LAYER_A_KIND: ${{ steps.layer_a.outputs.outcome || 'unknown' }}
          LAYER_B_OUTCOME: ${{ steps.layer_b.outcome }}
          LAYER_A_VERSIONS: >-
            ${{ steps.layer_a.outputs.versions ||
            'unavailable (Layer A install did not complete)' }}
        run: |
          set -uo pipefail
          TITLE="compat-smoke: third-party contract drift detected"
          BODY_FILE="$RUNNER_TEMP/compat-smoke-alert-body.md"

          case "$LAYER_A_KIND" in
            drift)
              LAYER_A_LINE="**DRIFT** — a pinned contract's installed source"
              LAYER_A_LINE+=" no longer matches the shape pi-lens depends on."
              LAYER_A_LINE+=" This is a real regression to investigate."
              ;;
            infra)
              LAYER_A_LINE="**INFRA FAILURE** — Layer A could not locate one"
              LAYER_A_LINE+=" or more contracts' source files at any known"
              LAYER_A_LINE+=" candidate path (a dependency's layout likely"
              LAYER_A_LINE+=" moved/renamed the file, or the install itself"
              LAYER_A_LINE+=" failed). NOT a confirmed contract regression —"
              LAYER_A_LINE+=" see the run log for which candidates were"
              LAYER_A_LINE+=" tried, then append the new location to that"
              LAYER_A_LINE+=" contract's \`parts\` in"
              LAYER_A_LINE+=" \`scripts/lib/compat-contracts.mjs\`'s"
              LAYER_A_LINE+=" \`CONTRACTS\` list."
              ;;
            verified)
              LAYER_A_LINE="verified — passed (this alert fired because of"
              LAYER_A_LINE+=" Layer B, see below)."
              ;;
            *)
              LAYER_A_LINE="unknown (step outcome: ${LAYER_A_STEP_OUTCOME};"
              LAYER_A_LINE+=" the script did not report an outcome — check"
              LAYER_A_LINE+=" the run log directly)."
              ;;
          esac

          {
            echo "The nightly [subagent-extension compat smoke](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" \
              "flagged pi-lens's subagent-compatibility contracts" \
              "(#473/#474/#475)."
            echo ""
            echo "- Layer A (pinned-contract verification): ${LAYER_A_LINE}"
            echo "- Layer B (real-pi behavioral smoke): **${LAYER_B_OUTCOME}**"
            echo "- Installed versions this run: ${LAYER_A_VERSIONS}"
            echo ""
            echo "See the [run log](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" \
              "for failed checks, and \`docs/subagent-compat.md\` for the" \
              "contracts and files each check verifies, including the" \
              "verified / drift / infra outcome definitions."
            echo ""
            echo "_This issue is auto-refreshed by the nightly compat-smoke" \
              "workflow — do not close it while the check is failing. Once" \
              "resolved (upstream revert, pi-lens update, or the file" \
              "location added to the locator), close it._"
          } > "$BODY_FILE"

          COMMENT="Still flagged: Layer A=${LAYER_A_KIND},"
          COMMENT+=" Layer B=${LAYER_B_OUTCOME}"
          COMMENT+=" (versions: ${LAYER_A_VERSIONS})."
          if [ "$LAYER_A_STEP_OUTCOME" = success ] && [ "$LAYER_B_OUTCOME" = success ]; then
            node scripts/upsert-tracking-issue.mjs \
              --title "$TITLE" \
              --label "area:session,area:lsp,area:tests" \
              --body-file "$BODY_FILE" \
              --clean --close-when-clean
          else
            node scripts/upsert-tracking-issue.mjs \
              --title "$TITLE" \
              --label "area:session,area:lsp,area:tests" \
              --body-file "$BODY_FILE" \
              --comment "$COMMENT"
          fi
