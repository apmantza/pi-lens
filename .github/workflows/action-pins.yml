name: Action pin comments

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

# #5420: one transient registry 5xx must not red npm ci or npx; npm's default
# is 2 retries. The gate (workflow-level, literal, floored) is
# tests/config/release-download-helper-workflow.test.ts.
env:
  npm_config_fetch_retries: 5
  npm_config_fetch_retry_maxtimeout: 120000

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Action pin comments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # #4683: the interpreter rule PARSES each workflow with js-yaml (a runtime
      # dependency) instead of scanning its text, so this job needs
      # node_modules. --ignore-scripts skips `prepare`; nothing here builds.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Check action pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-action-pins.mjs
