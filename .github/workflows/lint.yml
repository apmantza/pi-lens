name: Lint

# #1844: mechanical lint batch. Four independent, cheap jobs -- each stays
# well under a minute and needs no `npm install` (actionlint, vale, and
# markdownlint-cli2 are self-contained). Kept out of ci.yml so a lint
# finding never blocks on -- or waits behind -- the full install/build/test
# lanes. The OSV scan lives in its own osv-scan.yml (see that file for why).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # No "edited" (#3838): a retitle or body edit re-runs only the PR metadata
    # checks in pr-metadata.yml, not this workflow's whole job graph.
    types: [opened, synchronize, reopened]
  # #3754: the merge queue needs knip and oxfmt on its own merge commit.
  merge_group:
    types: [checks_requested]
  # #5062: dispatched on a bot-opened PR's branch, where GITHUB_TOKEN starts no
  # `pull_request` run (docs/ci-bot-pr-checks.md).
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    # refs #3123: bounds a hang against GitHub's 360-min default.
    # Measured max over last 10 successful master runs: 8s; timeout = floor of
    # 10 min.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # Pinned release + checksum verification rather than piping a
      # third-party install script or trusting an unpinned marketplace
      # action (this repo dogfoods actionlint as a runner -- see
      # clients/dispatch/runners -- so lint it with the same rigor).
      - name: Download and verify actionlint v1.7.12 (linux_amd64)
        run: |
          set -eu
          curl -sLO --proto '=https' --tlsv1.2 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint

      # Bare invocation (no *.yml glob): actionlint auto-discovers every
      # workflow under .github/workflows/, including a future .yaml
      # extension the glob would silently miss (#1917 review F5).
      - name: Lint workflows
        run: ./actionlint -color

  oxfmt:
    name: oxfmt format check
    runs-on: ubuntu-latest
    # refs #3123: bounds a hang against GitHub's 360-min default.
    # Measured max over last 10 successful master runs: 32s; timeout = floor of
    # 10 min.
    timeout-minutes: 10
    permissions:
      contents: read
    # Gating: preflight runs the same fmt:check locally before a PR is pushed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The version comes from the `oxfmt` devDependency, which package.json
      # pins exactly. The workflow holds no second copy of the version to
      # drift out of sync (the single-source-of-truth rule). A full `npm ci`
      # would also pin it, but costs this lane its "no install" cheapness for
      # a single binary. `--ignore-scripts` blocks lifecycle-script execution
      # (SonarCloud S6505, the #1923 posture); `--no-save` keeps the command
      # off the repo's package.json and package-lock.json. No npx.
      - name: Install oxfmt (version pinned by the devDependency)
        run: |
          set -eu
          version=$(node -p "require('./package.json').devDependencies.oxfmt")
          npm install --no-save --no-audit --no-fund --ignore-scripts "oxfmt@${version}"

      # `npm run fmt:check` rather than a second spelling of the command:
      # package.json defines the check once, so a contributor running it
      # locally runs exactly what CI runs. npm puts node_modules/.bin on PATH,
      # so this still resolves the pinned binary, and never npx.
      #
      # No path arguments: `.oxfmtrc.json` is the single source of truth for
      # both which files are in scope and how they are formatted. oxfmt also
      # honors .gitignore by default, which keeps dist/ and the compiled
      # clients/*.js out.
      - name: Check formatting
        run: npm run fmt:check

  knip:
    name: knip
    runs-on: ubuntu-latest
    # refs #3123: bounds a hang against GitHub's 360-min default.
    # Measured max over last 10 successful master runs: 27s; timeout = floor of
    # 10 min.
    timeout-minutes: 10
    permissions:
      contents: read
    # Gating (#2837 step 3): `npm run preflight` runs the same
    # scripts/run-knip.mjs locally before a PR is pushed, and master is clean.
    # The job name carries no `(advisory)` suffix and is not in
    # ADVISORY_CHECKS (scripts/lib/ci-checks.mjs), so ci-verdict blocks
    # on it. A rerun after the PR merged fails in
    # the checkout step (`refs/pull/N/merge` is gone); ci-verdict excuses that
    # by reading the job log (#3700), so this job needs no `if:` guard.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Same pattern as the oxfmt/markdownlint jobs above: install just the
      # one pinned binary (no peerDependency on `typescript` — knip bundles
      # its own oxc-parser/oxc-resolver), not a full `npm ci`. Version comes
      # from the devDependency so there is exactly one place it's pinned.
      - name: Install knip (version pinned by the devDependency)
        run: |
          set -eu
          version=$(node -p "require('./package.json').devDependencies.knip")
          npm install --no-save --no-audit --no-fund --ignore-scripts "knip@${version}"

      # scripts/run-knip.mjs purges gitignored compiled clients/*.js siblings
      # before invoking knip (see its header comment and knip.jsonc's) —
      # this checkout never ran `npm run build`, so there is nothing to
      # purge here, but the same script runs identically for a contributor
      # who has built locally.
      - name: Run knip
        run: node scripts/run-knip.mjs

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    # refs #3123: bounds a hang against GitHub's 360-min default.
    # Measured max over last 10 successful master runs: 26s; timeout = floor of
    # 10 min.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # SonarCloud S6505 (#1917 review, deferred; fixed here): `npx` can
      # install AND execute a package's lifecycle scripts. `--ignore-scripts`
      # closes that vector; `--no-save` keeps this from touching the repo's
      # real package.json/package-lock.json (verified locally on a bare
      # checkout -- no node_modules, no prior install -- that both files are
      # byte-identical to HEAD after this command). Version stays pinned.
      - name: Install markdownlint-cli2 (no npx, no lifecycle scripts)
        run: npm install --no-save --no-audit --no-fund --ignore-scripts markdownlint-cli2@0.23.2

      - name: Lint markdown
        run: ./node_modules/.bin/markdownlint-cli2

  oxlint-advisory:
    name: oxlint (advisory)
    runs-on: ubuntu-latest
    # refs #3123: bounds a hang against GitHub's 360-min default.
    # Measured max over last 10 successful master runs: 49s; timeout = floor of
    # 10 min.
    timeout-minutes: 10
    permissions:
      contents: read
    # #2700: the full categories (correctness+suspicious+perf) + plugins
    # (typescript+unicorn+promise+import+oxc) + --type-aware set, kept out
    # of `lint:js` (gating) because most of it has un-triaged findings on
    # master today (see the PR body's per-rule table). Advisory via the
    # `(advisory)` NAME SUFFIX (`ci-checks.mjs`'s `isAdvisoryCheck`), the
    # SAME convention `Vale prose lint
    # (advisory)` already use above -- NOT `continue-on-error` (#2700 review
    # round 3: the round-1 check-runs payload proved that flag buys no
    # check-level tolerance beyond what the suffix already gives, and this
    # job's own findings-vs-degraded distinction below needs the step's
    # REAL exit code to reach the job, which continue-on-error would have
    # masked either way). Unlike the other jobs in this workflow, type-aware
    # linting needs the real dependency tree resolved (tsconfig-driven
    # import resolution), so this job runs a full `npm install`, not a
    # single pinned-binary install.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # `npm ci` (not `npm install`) + `--ignore-scripts` (SonarCloud S6505 /
      # S8543, the #1923 posture ci.yml's oxfmt-adjacent steps already cite):
      # no package this job needs (oxlint, oxlint-tsgolint, and their own
      # deps) carries an install script, the lockfile is already in sync
      # (checked elsewhere in CI), and `--ignore-scripts` skips this repo's
      # own `prepare` (build:dist, grammar download, git hooks) -- none of
      # which the lint reads. Do not copy this to the OTHER bare
      # `npm install` sites in this repo (ci.yml, release.yml, grammar
      # health, tool-smoke, compat-smoke): several of those genuinely need
      # `prepare` to run.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      # #2709: with `oxlint-tsgolint` absent, oxlint's --type-aware flag
      # degrades SILENTLY -- exit 1, one `Failed to find tsgolint
      # executable` line, ZERO rules run, no findings -- which, now that
      # this job carries no continue-on-error, would otherwise be
      # INDISTINGUISHABLE at the check level from a healthy run that found
      # real issues (also exit 1: #2697's findings are still un-triaged).
      # The advisory command uses Unix output because the pinned
      # oxlint-tsgolint toolchain's default reporter can panic. Unix output
      # has no rule-count trailer, so the step asks the SAME advisory argv for
      # oxlint's machine-readable --print-config surface and counts enabled
      # rules. The step's own natural exit
      # code ($status) is deliberately NOT what decides this job's
      # conclusion (#2700 review round 3): a healthy run with 4900+
      # un-triaged findings must read GREEN (type-aware ran correctly),
      # and only a floor breach -- R below RULE_FLOOR -- must read RED,
      # with the named reason in an `::error::` annotation. RULE_FLOOR=100
      # sits well under the ~164 rules a healthy run reports today (margin
      # for routine oxlint version bumps) and well over the 0 a missing
      # peer produces.
      - name: oxlint advisory (categories + plugins + type-aware)
        run: |
          set +e
          output="$(npm run lint:js:advisory --silent 2>&1)"
          status=$?
          set -e
          echo "$output"
          echo "(lint:js:advisory exited $status -- findings, if any, are advisory and do not affect this job's conclusion; only the rule-count floor below does)"
          RULE_FLOOR=100
          config="$(npm run lint:js:advisory --silent -- --print-config 2>/dev/null || true)"
          rules="$(printf '%s\n' "$config" | node scripts/count-oxlint-rules.mjs)"
          rules="${rules:-0}"
          # The count-vs-floor compare is the shared helper's (#4518); its exit
          # status is the verdict, and the diagnosis below names the likely cause.
          if ! node scripts/assert-evaluated.mjs --count "oxlint-rules=${rules}" --floor "$RULE_FLOOR"; then
            echo "::error::oxlint advisory ran with only $rules rules (floor $RULE_FLOOR) -- oxlint-tsgolint is likely missing or --type-aware silently degraded; this is NOT the same as a clean or lightly-findinged run"
            exit 1
          fi
          exit 0

  # No floor (#4518): every tool step below states the reader that makes an
  # empty result visible, and the complexity step carries its own floor.
  # Advisory to start (see PR body / #1844): not wired into required-checks
  # branch protection, so it never blocks a merge on its own.
  lint-advisory:
    name: Lint (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    # refs #3123: bounds a hang against GitHub's 360-min default.
    # Measured max over last 10 successful master runs of the seven former jobs:
    # 13 + 23 + 34 + 33 + 20 + 11 + 30 = 164s, one install shared; timeout =
    # floor of 10 min.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # crate-ci/typos walks the checkout and exits non-zero on any finding or
      # error; the population is the repo itself and cannot be empty. The row is
      # the reader.
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        if: ${{ !cancelled() }}
        with:
          args: --force-exclude

      # Pinned release + checksum verification, matching the actionlint job
      # above. The style package itself (.vale/styles/Google/) is vendored
      # in the repo, not fetched via `vale sync` -- this step is the only
      # network access vale makes.
      - name: Download and verify vale v3.9.6 (Linux_64-bit)
        if: ${{ !cancelled() }}
        run: |
          set -eu
          curl -sLO --proto '=https' --tlsv1.2 https://github.com/errata-ai/vale/releases/download/v3.9.6/vale_3.9.6_Linux_64-bit.tar.gz
          echo "dd8519d9bdf381a3b1a30f1df7f6e589b69ec1e38a495e4bd9af8e450703dde0  vale_3.9.6_Linux_64-bit.tar.gz" | sha256sum -c -
          tar -xzf vale_3.9.6_Linux_64-bit.tar.gz vale

      # Explicit path list, not a bare invocation: .vale.ini's BasedOnStyles
      # section already scopes which paths get styles applied, but vale
      # still needs paths on the command line to know what to walk.
      - name: Lint prose
        if: ${{ !cancelled() }}
        run: ./vale docs AGENTS.md CLAUDE.md README.md CONTRIBUTING.md .claude/agents .changelog

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          # #4666: the floating "3.x" channel reached an interpreter with no
          # pyyaml wheel under --only-binary=:all:, so this advisory row's lint
          # stopped silently while the workflow still reported success.
          # #4683: scripts/check-action-pins.mjs parses this file and refuses any
          # setup-python step whose python-version is not a concrete release, so
          # the pin cannot drift back to a channel.
          python-version: "3.12"
      - name: Install yamllint
        if: ${{ !cancelled() }}
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: yamllint==1.37.1"
      # The file list is `git ls-files` of the checkout, and yamllint with an
      # empty list exits 2 (usage), so an empty population reds the row instead
      # of reading clean. The row is the reader.
      - name: Lint YAML
        if: ${{ !cancelled() }}
        run: |
          mapfile -t yaml_files < <(git ls-files '*.yml' '*.yaml')
          yamllint "${yaml_files[@]}"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: npm ci --no-audit --no-fund --ignore-scripts

      # `npm run taplo` feeds `git ls-files '*.toml'` (39 files today) to taplo.
      # Probed: `taplo check` on a pattern or file that matches nothing logs
      # "found files total=0" and exits 0, so only a pathspec edit can empty the
      # check; it exits non-zero on a parse error or a format drift. The row is
      # the reader.
      - name: Check TOML
        if: ${{ !cancelled() }}
        run: npm run taplo

      # jscpd's exit code is the whole verdict (threshold 1) and its input is
      # four fixed in-repo paths. Probed: a missing path exits 1, but a path
      # whose files the `.jscpd.json` format and ignore filters all drop prints
      # "analyzed no files" and exits 0. The paths hold 500+ tracked sources
      # today, so only a config edit can empty the scan; the row is the reader.
      - name: Detect duplicated code
        if: ${{ !cancelled() }}
        run: node_modules/.bin/jscpd --config .jscpd.json clients scripts tools mcp index.ts

      # #5112: not a pull_request step. It reported 0 real catches in 30 days
      # (2,106 runner minutes, #3995 slice A) and only republishes counts that
      # strictness-ratchet.test.ts already pins on every pull request. Master
      # pushes and dispatches keep it. This step only publishes the two tsc
      # counts. They are pinned by the gating
      # tests/config/strictness-ratchet.test.ts, which runs the same two
      # configurations and reds on exit 0, zero diagnostics or any drift, so a
      # tsc that evaluated nothing reds the Unit lane, not this row. The report
      # step still carries `set -o pipefail`: the default shell has none, and a
      # script that crashed behind `| tee` would otherwise read green.
      - name: Generate strictness report
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          set -o pipefail
          node scripts/strictness-report.mjs | tee strictness-report.txt
      - name: Publish strictness report
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: cat strictness-report.txt >> "$GITHUB_STEP_SUMMARY"

      # Last: the build writes compiled twins into the checkout.
      - name: Download core tree-sitter grammars
        if: ${{ !cancelled() }}
        run: node scripts/download-grammars.js --core --dest grammars
      - run: npm run build
        if: ${{ !cancelled() }}
      # The script fails below its analysed-files floor (#4518). `set -o
      # pipefail` is load-bearing: the default shell has none, so `| tee` would
      # take tee's exit code and a script that crashed would read green.
      - name: Generate complexity report
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/complexity-report.mjs | tee complexity-report.txt
      - name: Publish complexity report
        if: always()
        run: cat complexity-report.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: complexity-report
          path: reports/complexity/complexity.md
          if-no-files-found: ignore
