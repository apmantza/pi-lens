name: CodeQL

# Advanced setup (#3801). PR-time analysis is the advisory `codeql` job in
# ci.yml (it waits on the required jobs, and `needs:` cannot cross workflows).
# This file keeps the default-branch baseline and the weekly re-scan.
#
# Two jobs (#4077): `analyze` holds no write scope and runs on a dispatch from
# any ref (its SARIF is a run artifact, `upload: never`); `upload` is the only
# job with `security-events: write`, is guarded to the schedule or master, and
# sends that SARIF to code scanning.
on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", ".changelog/**", "docs/**"]
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # The `(advisory)` suffix is what scripts/lib/ci-checks.mjs reads; the
    # `baseline` word keeps this name distinct from ci.yml's PR-time job.
    name: CodeQL baseline (${{ matrix.language }}) (advisory)
    runs-on: ubuntu-latest
    # refs #3123: bounds a hang against GitHub's 360-min default.
    # Measured max over the last 6 default-setup runs (javascript-typescript,
    # the slowest language): 479s; timeout = ~2.5x.
    timeout-minutes: 20
    # `security-events: read` is what a fork pull_request token holds for the
    # same analysis; the write scope lives on `upload` below.
    permissions:
      security-events: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - cases
              - tests/fixtures
              - dist
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-sarif-${{ matrix.language }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif-${{ matrix.language }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The only writer (#4077): code scanning accepts the baseline from the
  # default branch or the schedule, never from a branch dispatch. `!cancelled()`
  # keeps one language's upload when the other leg's analysis failed; the
  # missing artifact then reds only that leg's download.
  upload:
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.ref == 'refs/heads/master') }}
    needs: analyze
    # Same `(advisory)` suffix rule as `analyze`'s name above.
    name: CodeQL baseline upload (${{ matrix.language }}) (advisory)
    runs-on: ubuntu-latest
    # SARIF processing is the long part (`wait-for-processing` defaults on);
    # the analysis above measured 479s at most, and this job only uploads.
    timeout-minutes: 10
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif-${{ matrix.language }}
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif-${{ matrix.language }}
          category: "/language:${{ matrix.language }}"
