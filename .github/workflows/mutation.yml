name: Mutation diff

on:
  pull_request:
    branches: [master]

# round 2 T6: without this, pushing twice to the same PR queues two mutation
# runs; the older one's report can still land (and its comment update fire)
# AFTER the newer one's, showing a stale head's result as current.
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  mutation:
    name: mutation (advisory)
    runs-on: ubuntu-latest
    # refs #3123: bounds a hang against GitHub's 360-min default. This job runs
    # on pull_request so --branch master matched no runs; measured max over the
    # last 8 successful runs regardless of branch: 2184s (36m24s, run 35117203202,
    # the stryker-diff.mjs step itself); sized at ~2x + margin.
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The driver mutates only the diff's changed lines and bounds its Stryker
      # child at MUTATION_BUDGET_MINUTES (60), which must stay strictly below
      # this job's timeout-minutes (90): run 36098718085 was cancelled by the
      # runner at the cap, so the driver never regained control and its
      # "no mutants evaluated" report never printed. The 30-minute margin covers
      # npm ci, npm run build, Stryker's in-place sandbox restore on SIGTERM, and
      # the report upload. tests/scripts/stryker-diff.test.ts pins the relation.
      #
      # #3531 rescope: the driver also mutates clients/**/*.ts, tools/**/*.ts,
      # mcp/**/*.ts and index.ts (through their compiled .js -- see
      # scripts/stryker-diff.mjs), building its own tsconfig.mutation.json
      # source maps internally; no separate build step is needed here for that.
      #
      # --head-sha (round 2 T6): a `pull_request` checkout's `git rev-parse
      # HEAD` is the CI MERGE-REF commit, not the PR's own head -- neither
      # stable across re-runs once master moves, nor matchable by a reader to
      # an actual PR commit, and it silently breaks the "the same PR head
      # always samples the same subset" reproducibility claim the whole
      # deterministic-seed design rests on.
      #
      # #3810: the incremental results of the previous push of THIS pull request
      # against THIS base. The exact key carries the head sha (a cache entry is
      # immutable, so each push saves a new one); `restore-keys` is the PR number
      # plus the base sha, so a later push restores the newest entry of the same
      # PR and base and a moved base starts cold. The driver decides whether the
      # restored file may be read (scripts/lib/mutation-test-selection.mjs:
      # `decideIncrementalReuse`): a changed test or other non-mutated file
      # starts cold, because Stryker's own differ would reuse a stale result.
      - name: Restore the incremental mutation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .stryker/incremental.json
            .stryker/incremental.fingerprint
          key: mutation-incremental-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            mutation-incremental-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.sha }}-
      - run: node scripts/stryker-diff.mjs --base "origin/${{ github.base_ref }}" --max-files 6 --head-sha "${{ github.event.pull_request.head.sha }}"
      # Saved even when the driver exits non-zero: a budget kill leaves the
      # partial results Stryker wrote, and the next push resumes from them.
      - name: Save the incremental mutation cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .stryker/incremental.json
            .stryker/incremental.fingerprint
          key: mutation-incremental-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
      # Always runs, even when the step above exited non-zero (a 0-mutant run
      # is not a step failure by itself, but the driver still exits 1 for a
      # genuine Stryker failure such as a budget timeout) -- #3531's "a 0-
      # mutant run must never read as a clean pass" applies to a run that
      # never got this far too, so the summary has to render regardless.
      - name: Render job summary
        if: always()
        run: node scripts/mutation-report.mjs --out "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          if-no-files-found: ignore

  mutation-comment:
    name: mutation comment (advisory)
    needs: mutation
    # Fork PRs: a fork PR's default GITHUB_TOKEN is read-only against this repo
    # regardless of the `permissions:` block below, so `gh api` POST/PATCH
    # below would just 403. Skip the whole job rather than let it fail loudly
    # for something it cannot do; the mutation job's own job summary (written
    # unconditionally, no token scope needed) still covers a fork PR.
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      # #3151 (install-smoke.yml): the comment target is a pull request;
      # `issues: write` alone was refused with 403 "Resource not accessible
      # by integration".
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-report
          path: reports/mutation
        # `mutation`'s own upload step already runs with `if: always()` and
        # `if-no-files-found: ignore` -- this download step failing (or
        # finding nothing) means the mutation job produced NO artifact at all
        # (a crash before writeReport, or the job hit its own 90-minute cap
        # outright), not that this step should abort.
        continue-on-error: true
      - name: Post or update the sticky mutation comment
        if: hashFiles('reports/mutation/mutation.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/mutation-pr-comment.mjs --pr "${{ github.event.pull_request.number }}"
      # round 2 T6: when the artifact never existed, the step above never ran
      # and an EARLIER head's comment -- now about a commit this PR no longer
      # is -- would otherwise just stay up with nothing marking it stale.
      #
      # round 2 R2-4: `needs.mutation.result` (success/failure/cancelled/
      # skipped) is the one signal this job actually has for WHY the artifact
      # is missing -- a `mutation` job the new per-PR concurrency group
      # cancelled reads "cancelled" here, distinct from a genuine crash or
      # time-cap failure, which reads "failure". This job itself runs either
      # way (`if: always()` on the job overrides the default needs-skip).
      - name: Mark the sticky comment stale (no report was produced for this head)
        if: hashFiles('reports/mutation/mutation.json') == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/mutation-pr-comment.mjs --pr "${{ github.event.pull_request.number }}" --stale \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --upstream-result "${{ needs.mutation.result }}"
