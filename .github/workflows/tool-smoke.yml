name: Tool smoke (nightly)

# Live tool + LSP smoke harness (#209). Unlike CI (push/PR, deterministic), this
# installs and SPAWNS real tools/LSP servers and drives pi-lens's real dispatch
# path against per-language fixtures — so it's slow and network-dependent, hence
# nightly + manual only, never a per-PR gate.
#
# The harness exits nonzero on genuine infra failures (timeout / exception /
# server_error) AND on a genuine installer defect: an ensureTool failure for a
# strategy whose toolchain this runner has (npm always, since the harness
# itself runs under Node; pip/gem when confirmed present) reports ✗ and DOES
# fail the run (#2638/#2661 — a dead/renamed npm package used to report the
# same ⚠ a missing toolchain does, and sat unnoticed for months). A tool that
# is declined/skipped by policy, genuinely lacks its toolchain on this runner,
# or hit a transient/offline registry condition (no network, a registry 5xx)
# reports ⚠ and does NOT fail the run — the printed report still shows the ⚠
# counts for review.

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:

jobs:
  tool-smoke:
    name: Live tool + LSP smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit-back branch for the LSP-docs refresh PR (#390)
      pull-requests: write # open/update the auto-refresh PR (#390)
      issues: write # file/update/close the silentOnClean drift tracking issue (#529/#594)
    # The installer hits the GitHub REST API to resolve release assets.
    # Unauthenticated = 60 req/hr per IP, exhausted on shared-IP runners.
    # The auto-provided token raises this to 5000 req/hr; the installer sends it
    # ONLY to api.github.com, never the asset CDN.
    #
    # PI_LENS_HOME/PILENS_DATA_DIR (#2670 review F1): job-level, so the SEVEN
    # `--install` steps below share one tool tree/bin dir across the job
    # instead of each `withScratchHome()` pin minting its own empty one per
    # step — without this, each script re-pulls every managed tool from
    # scratch (measured against the last full nightly, run 32817692457: the
    # shared cache made the format step ~9s; per-step scratch homes would add
    # ~10min across the job and 4-5x the release-asset downloads on this
    # shared-IP runner). A bare `/tmp` path, not `${{ runner.temp }}`: the
    # `runner` context is unavailable at job-level `env:` (actionlint: "context
    # \"runner\" is not allowed here"), and this runner's whole VM — `/tmp`
    # included — is destroyed after the job either way, so this never becomes
    # a second `~/.pi-lens` some other step relies on persisting.
    # `withScratchHome`'s "already pinned" branch is a no-op against an
    # explicit PI_LENS_HOME, so this is the ONLY change these steps need.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PI_LENS_HOME: /tmp/pi-lens-home
      PILENS_DATA_DIR: /tmp/pi-lens-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      # Python provides pip for the pip-distributed tools (ruff, yamllint,
      # sqlfluff, mypy). GitHub-release tools (shellcheck/shfmt/hadolint/taplo/
      # tflint/terraform-ls/rust-analyzer) are fetched by the harness's own
      # --install; ubuntu-latest ships rustup/cargo so rust-analyzer can load.
      # yamllint disable-line rule:line-length
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Toolchain-gated languages. go/rust(rustup)/pwsh/.NET ship on Ubuntu;
      # these set up the rest. All best-effort: a setup failure must NOT red the
      # nightly (the harness already treats an unavailable tool as ⚠, not a
      # failure), so each is continue-on-error.
      # yamllint disable-line rule:line-length
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '21'
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        continue-on-error: true
        with:
          ruby-version: '3.3'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        continue-on-error: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        continue-on-error: true
        with:
          php-version: '8.3'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        continue-on-error: true
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        continue-on-error: true
        with:
          otp-version: '27'
          elixir-version: '1.18'
          gleam-version: '1'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build dist
        run: npm run build:dist

      # `id:` + a captured log (#2723): this is one of the three steps whose
      # outcome can actually turn the job red (no continue-on-error), so the
      # final notify step below needs both this step's `outcome` and its raw
      # log text (for the ✗ row detail) to build a useful tracking-issue
      # body. `tee` still streams to the Actions log unchanged.
      #
      # `set -o pipefail` is LOAD-BEARING, not documentation (#2723 review
      # F4 — corrects a wrong claim this comment used to make): GitHub's
      # default shell for a `run:` step that declares no `shell:` key is
      # `bash -e {0}` — WITHOUT pipefail (`-eo pipefail` is only what an
      # EXPLICIT `shell: bash` gets). Without this line, `node
      # scripts/smoke-tools.mjs ... | tee logfile`'s exit code is `tee`'s
      # (almost always 0), never the node process's — a genuinely red layer
      # would report `outcome: success` to the notify step below, and
      # `layersGenuinelyClean` (scripts/lib/tool-smoke-drift.mjs) is the
      # notify step's own cheap backstop against exactly that: it refuses to
      # close the tracker when a layer's raw outcome says "success" but its
      # own parsed summary still shows a failure. Pinned by
      # tests/config/tool-smoke-notify-gate.test.ts, mutation-proofed by
      # deleting this exact line.
      - name: Tool layer (install + run each tool through real dispatch)
        id: tool_layer
        run: |
          set -o pipefail
          node scripts/smoke-tools.mjs --install --verbose 2>&1 | tee "$RUNNER_TEMP/tool-smoke-tool-layer.log"

      - name: LSP handshake layer (install + spawn + initialize each server)
        id: lsp_handshake
        run: |
          set -o pipefail
          node scripts/smoke-tools.mjs --lsp --install --verbose 2>&1 | tee "$RUNNER_TEMP/tool-smoke-lsp-handshake.log"

      # Gating diagnostic layer (#2780, recurrence #2776): the handshake above
      # proves initialize only. This row family drives the real lsp_diagnostics
      # handler against every installed primary fixture and requires a finding
      # in its PRIMARY bucket. A server-authored source cannot make an
      # auxiliary finding look like primary coverage.
      - name: LSP diagnostics clean-gate (primary finding per installed server)
        id: lsp_gate
        timeout-minutes: 30
        run: |
          set -o pipefail
          node scripts/smoke-tools.mjs --lsp-gate --install --verbose 2>&1 | tee "$RUNNER_TEMP/tool-smoke-lsp-gate.log"

      # Diagnostic-mode matrix (#240): spawn each server and record its
      # advertised mode (pull vs push) — the first cut of the affirmative-clean
      # -signal classification (docs/lsp-capability-matrix.md). Best-effort: the
      # script always exits 0 and a server whose toolchain is absent reports
      # "unavailable", so this never reds the nightly. MERGES into the doc — a
      # server this ubuntu host couldn't spawn keeps its prior (dev-box) row (#390).
      - name: LSP capability matrix (characterize diagnostic mode per server)
        continue-on-error: true
        run: node scripts/characterize-lsp.mjs --install

      # Clean-signal probe (#460): among PUSH-mode servers, split Tier 2
      # (publishes a versioned set on a clean scan — free affirmative signal) from
      # Tier 3 (version-less/silent — the budget-wait case, #458). Merges into the
      # same matrix's clean-behavior column (same dev/ci src + merge-guard as
      # characterize). Best-effort: always exits 0, per-server hard timeouts.
      # #529: also compares each observed clean-behavior against wait-policy
      # /strategies.ts's hand-set `silentOnClean` marker and logs any mismatch to this step's
      # output + a "## silentOnClean drift" footnote in the matrix doc — telemetry
      # only, NEVER a build/CI gate (this step's own continue-on-error covers the
      # probe already; the drift check can't fail the job either way).
      - name: LSP clean-signal probe (Tier 2 vs 3 among push servers) + silentOnClean drift check
        continue-on-error: true
        run: node scripts/probe-clean-signal.mjs --install

      # #594: make a genuine #529 drift finding ACTIONABLE instead of it only
      # living in the step above's stdout + the docs-diff footnote, where
      # nobody has a reason to look. Reads the JSON summary the probe step just
      # wrote and files/updates a SINGLE persistent tracking issue (fixed
      # `nightly-drift` label + title, never a new issue per night) when there
      # IS a finding, or closes a prior open one when the drift has resolved.
      # Reuses the job's existing GITHUB_TOKEN (same one the docs-refresh PR
      # step below already uses) via `gh` — no new auth plumbing. Best-effort:
      # never fails the job either way (continue-on-error, plus the script's
      # own internal try/catch — same "always exit 0, telemetry only" contract
      # as the probe itself).
      - name: Notify on silentOnClean drift (file/update/close tracking issue)
        continue-on-error: true
        run: node scripts/notify-clean-signal-drift.mjs

      # Server capability inventory (#390 item 1): regenerate
      # docs/servercapabilities.md (mode + ws-pull + nav/edit ops + raw caps) —
      # previously never run anywhere, so its ws-pull column (#389) stayed stale.
      # Merges over the prior doc (keeps servers absent on this host).
      - name: LSP server capability inventory (regenerate docs/servercapabilities.md)
        continue-on-error: true
        run: node scripts/server-capabilities.mjs --install

      # Commit-back (#390 item 2): the three steps above regenerate the LSP docs
      # in-place. master has required checks the schedule's GITHUB_TOKEN can't
      # bypass, so we open/UPDATE a single auto-PR (fixed branch, force-pushed each
      # run) instead of pushing to master. Docs change rarely (only when a server's
      # caps/tier change), so this is low-noise. No-ops when nothing changed.
      - name: Open/update LSP-docs refresh PR
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/lsp-docs-refresh
          base: master
          add-paths: |
            docs/lsp-capability-matrix.md
            docs/servercapabilities.md
          commit-message: 'docs(nightly): refresh LSP capability docs'
          title: 'docs(nightly): refresh LSP capability docs'
          body: |
            Automated refresh of the LSP capability docs from the nightly tool-smoke run.

            - `docs/lsp-capability-matrix.md` — `mode` (characterize-lsp) + `clean-behavior` (probe-clean-signal, Tier 2 vs 3) columns (#460) + a `## silentOnClean drift` footnote (#529, telemetry only — never a gate)
            - `docs/servercapabilities.md` — advertised capability inventory incl. ws-pull (#389)

            Rows are **merged**, never blind-overwritten: a server this ubuntu host
            couldn't spawn keeps its prior (dev-box) classification, so the nightly
            can't regress a richer run (#390).

            Refs #460, #390, #529.
          delete-branch: false

      - name: Format layer (select + reformat through formatter pipeline)
        id: format_layer
        run: |
          set -o pipefail
          node scripts/smoke-tools.mjs --format --install --verbose 2>&1 | tee "$RUNNER_TEMP/tool-smoke-format-layer.log"

      # #2723: the ONLY tracking-issue writer this workflow had before this
      # step (`Notify on silentOnClean drift` above) sits behind the LSP
      # handshake layer with `continue-on-error: true` but no `if: always()`,
      # so GitHub skips it — and everything after it — exactly when an
      # earlier step fails, i.e. exactly when a human most needs to hear
      # about it (13 consecutive red nights, 2026-08-26 -> 2026-09-07, with
      # no automated notice). That notifier is also scoped to something
      # unrelated (silentOnClean telemetry, never the job verdict) — see
      # scripts/lib/drift-issue.mjs's module doc. THIS step is a second,
      # independent notifier scoped to the job's actual pass/fail verdict,
      # placed last and gated on `if: always()` so it runs on every outcome,
      # mirroring install-smoke.yml's `Notify install drift` step. Reads the
      # four gating layers' outcomes + captured logs (the only four steps
      # above without `continue-on-error`, so the only four whose outcome
      # can turn the job red) — see scripts/lib/tool-smoke-drift.mjs's module
      # doc. GITHUB_TOKEN is inherited from this job's own env (`issues:
      # write` already granted at job level, #529/#594). Best-effort:
      # continue-on-error PLUS the script's own internal try/catch (always
      # exits 0) — filing/updating/closing an issue must never change the
      # nightly's own conclusion (acceptance #5).
      - name: Notify on tool-smoke red (file/update/close tracking issue)
        if: always()
        continue-on-error: true
        env:
          TOOL_LAYER_OUTCOME: ${{ steps.tool_layer.outcome }}
          TOOL_LAYER_LOG: ${{ runner.temp }}/tool-smoke-tool-layer.log
          LSP_HANDSHAKE_OUTCOME: ${{ steps.lsp_handshake.outcome }}
          LSP_HANDSHAKE_LOG: ${{ runner.temp }}/tool-smoke-lsp-handshake.log
          LSP_GATE_OUTCOME: ${{ steps.lsp_gate.outcome }}
          LSP_GATE_LOG: ${{ runner.temp }}/tool-smoke-lsp-gate.log
          FORMAT_LAYER_OUTCOME: ${{ steps.format_layer.outcome }}
          FORMAT_LAYER_LOG: ${{ runner.temp }}/tool-smoke-format-layer.log
          # #2723 review F3: a job failure BEFORE the three tracked layers
          # even start (checkout, a best-effort setup action, npm install,
          # build:dist — twelve steps, none of which set an *_OUTCOME above)
          # leaves all three "skipped", identically to a genuine
          # cancellation. `job.status` disambiguates: "failure" only when a
          # non-continue-on-error step actually failed somewhere in the job.
          JOB_STATUS: ${{ job.status }}
        run: node scripts/notify-tool-smoke-red.mjs
