name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      republish:
        description: >-
          Publish package.json's version to npm from its EXISTING tag
          (recovers a release whose tag and GitHub release were created but
          whose publish-npm job failed, e.g. v4.1.6 on 2026-09-10). The tag
          and the GitHub release are not recreated.
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
      publish_ref: ${{ steps.meta.outputs.publish_ref }}
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute release metadata
        id: meta
        shell: bash
        env:
          REPUBLISH: ${{ inputs.republish || 'false' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          # Release if the version tag doesn't exist yet. The tag check is the
          # sole guard — no need to also require package.json in the diff, which
          # breaks when the version bump and changelog land in separate commits.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            SHOULD_RELEASE=false
          else
            SHOULD_RELEASE=true
          fi

          # A manual `republish` run publishes the ALREADY-TAGGED tree to npm
          # (the tag and the GitHub release stay as they are); a normal run
          # publishes the commit it releases. Anything else never publishes.
          SHOULD_PUBLISH="$SHOULD_RELEASE"
          PUBLISH_REF="$GITHUB_SHA"
          if [ "$SHOULD_RELEASE" = false ] && [ "$REPUBLISH" = true ]; then
            SHOULD_PUBLISH=true
            PUBLISH_REF="$TAG"
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "should_release=$SHOULD_RELEASE"
            echo "should_publish=$SHOULD_PUBLISH"
            echo "publish_ref=$PUBLISH_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify bump PR rolled up changelog entries
        if: steps.meta.outputs.should_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "Missing CHANGELOG entry for version $VERSION"
            exit 1
          fi
          if find .changelog -maxdepth 1 -type f -name '*.md' ! -name README.md \
               -print -quit | grep -q .; then
            echo "Unrolled .changelog entries remain; run npm run changelog:release in the bump PR"
            exit 1
          fi

      # yamllint disable-line rule:line-length
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: steps.meta.outputs.should_release == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Through the SAME pinned npm the publish-npm job uses (#2940): a dry run
      # on a different npm validates a tarball the release will never pack.
      - name: Install dependencies
        if: steps.meta.outputs.should_release == 'true'
        run: |
          npm_pin="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npx -y "npm@${npm_pin}" install --no-audit --no-fund

      # No registry auth needed here: `npm publish --dry-run` never reaches the
      # actual publish call (npm skips it when --dry-run is set), so it neither
      # needs nor uses credentials — it only validates the tarball contents.
      - name: Dry-run publish (validates tarball)
        if: steps.meta.outputs.should_release == 'true'
        run: |
          npm_pin="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npx -y "npm@${npm_pin}" publish --dry-run

      # The dry-run above runs prepare (tsc → dist/), so the compiled entry now
      # exists in the working tree. Load it to catch a broken/missing-dep entry
      # before we tag and publish (#182).
      - name: Smoke-load compiled entry
        if: steps.meta.outputs.should_release == 'true'
        shell: bash
        run: |
          # This job ran a full `npm install`, so the host-provided packages are
          # present as devDependencies and the entry loads. The allowlist still
          # derives from scripts/lib/host-provided-deps.mjs rather than naming a
          # package here, so it cannot drift from the dependency shape (#1926).
          ALLOW=$(node scripts/supply-host-provided-deps.mjs --allow-pattern)
          ENTRY=$(node -p "require('./package.json').pi.extensions[0]")
          echo "Loading entry: $ENTRY"
          echo "Host-provided allowlist: $ALLOW"
          node "$ENTRY" 2>&1 | tee /tmp/load-output.txt || true
          if grep -q "ERR_MODULE_NOT_FOUND\|Cannot find module" \
               /tmp/load-output.txt \
             && ! grep -Eq "$ALLOW" /tmp/load-output.txt; then
            echo "FAILED: missing module dependency in compiled entry"
            cat /tmp/load-output.txt
            exit 1
          fi
          echo "Compiled entry loads OK"

  release:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
      pull-requests: read
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release body is the curated CHANGELOG section for this version, not
      # the auto-generated PR-title list — so the release reads as a meaningful
      # summary of what changed (especially new features). `prepare` already
      # verified the bump PR already materialized the version heading and
      # consumed every per-entry file.
      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >
          node scripts/changelog-extract.mjs "$VERSION" --summary
          -o "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: >
          gh release create "$TAG" --title "$TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Append contributor thanks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch --tags origin
          node scripts/backfill-release-thanks.mjs --apply --only "$TAG"

  publish-npm:
    runs-on: ubuntu-latest
    needs: [prepare, release]
    # Runs after a real release (release job succeeded) or on a manual
    # `republish` (release job skipped because the tag already exists).
    if: >-
      ${{ !cancelled()
          && needs.prepare.outputs.should_publish == 'true'
          && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: read
      # Required for OIDC trusted publishing: npm exchanges this job's GitHub
      # Actions ID token for a short-lived registry token, so no NPM_TOKEN
      # secret is needed. Configured as the trusted publisher for this package
      # on npmjs.com (repo apmantza/pi-lens, workflow release.yml).
      id-token: write
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.publish_ref }}
          persist-credentials: false

      # yamllint disable-line rule:line-length
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm >= 11.5.1. Node 22's bundled npm
      # isn't guaranteed to be new enough, so pin explicitly. Pinned (not
      # `@latest`) per repo convention (#731/#732): bump by hand after
      # verifying a newer release. 11.18.0 is the latest 11.x release —
      # deliberately not npm 12.x, whose engines requirement
      # (node ^22.22.2 || ^24.15.0 || >=26.0.0) is stricter than what the
      # `node-version: 22` pin above guarantees.
      # npm 11.11 restored libc descriptors in lockfile v3 (#9025), so a
      # release-time install keeps glibc/musl optional-binary metadata intact.
      # Keep this version in sync with the pin in ci.yml
      # (production-install-build job).
      #
      # Required: the `prepare` script builds dist/ (tsc), which needs
      # node_modules. `npm install` runs prepare here, and `npm publish` runs it
      # again before packing. Without the install the build — and the publish —
      # fails. This is also the step that warms the npx cache for the pin.
      - name: Install dependencies
        run: |
          npm_pin="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npx -y "npm@${npm_pin}" install --no-audit --no-fund

      # The runtime half of the #2940 gate, immediately before the publish it
      # guards (the static half is tests/config/release-npm-pin-gate.test.ts).
      # If the npm that answers here is not the pin — a dropped `-y`, a bare
      # `npm`, an npx resolution that fell back to the bundled 10.x — the
      # release stops before the tag's package is pushed, instead of at the
      # registry's E404 with the tag and GitHub release already created.
      - name: Assert the publish toolchain is the pinned npm
        run: |
          npm_pin="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          actual="$(npx -y "npm@${npm_pin}" --version)"
          if [ "$actual" != "$npm_pin" ]; then
            echo "toolchain check failed: npx resolved npm $actual, expected $npm_pin"
            exit 1
          fi

      # Publish through the PINNED npm, not the runner's bundled one: since
      # 9183f39c6 this job only caches npm@<pin> via npx (it no longer installs
      # it globally), so a bare `npm publish` ran Node 22's bundled
      # npm, which has no OIDC trusted-publishing support — the PUT went out
      # unauthenticated and the registry answered E404 (v4.1.6, 2026-09-10:
      # tag and GitHub release created, npm publish failed).
      - name: Publish to npm
        run: |
          npm_pin="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npx -y "npm@${npm_pin}" publish
