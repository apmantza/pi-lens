name: Strict install

# Own file so the pull-request check list carries no skipped row (#5002); the
# trigger set is pinned by tests/config/ci-minutes-5112-workflows.test.ts.
# No `merge_group` (that would add this workflow to the bot-PR dispatch set,
# docs/ci-bot-pr-checks.md).
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: strict-install-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

# #5420: one transient registry 5xx must not red npx or npm install; npm's
# default is 2 retries. The gate (workflow-level, literal, floored) is
# tests/config/release-download-helper-workflow.test.ts.
env:
  npm_config_fetch_retries: 5
  npm_config_fetch_retry_maxtimeout: 120000

jobs:
  # #4064: the ordinary strict installs can inherit a warm runner/npm cache,
  # which lets a nested `npm exec --package` skip its install and hide an
  # uncovered lifecycle script (#4028). Keep this early PR/push signal
  # independent of the required install lanes and make the cache boundary
  # explicit: the job-local directory starts empty and setup-node has no npm
  # cache input.
  #
  # #5112: not a pull_request job. It caught nothing in 30 days (1,410 runner
  # minutes, #3995 slice A) and a pull request that changes the manifests or
  # the lockfile still runs the same strict install through install-smoke.yml's
  # `npm-strict` job (package.json and package-lock.json are in its paths).
  # Master pushes and dispatches keep it.
  #
  # #5002: its own workflow file, with no pull_request trigger. In ci.yml a job
  # `if:` that skips a pull request still posts a SKIPPED check row on every
  # one; a workflow that never starts on a pull request posts none. It no
  # longer runs on merge_group or on ci.yml's bot-PR dispatch (a master push and
  # a manual dispatch keep it).
  strict-install-cold-cache:
    name: Strict install (cold npm cache) (fast-fail)
    runs-on: ubuntu-latest
    # refs #3123: this is a single dependency install plus prepare; keep a
    # bounded runner even if the registry or a lifecycle child hangs.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The `runner` context is not available in job-level `env:` (GitHub
      # rejects the whole workflow), so the cache path is exported here.
      - name: Create empty job-local npm cache
        run: |
          set -eu
          cache="$RUNNER_TEMP/pi-lens-empty-npm-cache"
          test ! -e "$cache"
          mkdir -p "$cache"
          test -z "$(find "$cache" -mindepth 1 -print -quit)"
          echo "npm_config_cache=$cache" >> "$GITHUB_ENV"

      - name: Install dependencies with the pinned npm (cold cache)
        run: |
          set -euxo pipefail
          npm_pin="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
          npx -y "npm@${npm_pin}" install --strict-allow-scripts --no-audit --no-fund
