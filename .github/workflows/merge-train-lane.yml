name: Merge train

# Lands a PR the maintainer has already approved (#2185).
#
# THE REVIEW POLICY IS NOT AUTOMATED HERE. Every PR still gets an adversarial
# review and a same-reviewer verify round before anything merges. Only the
# maintainer applies the `train:approved` label, so the label IS that verdict,
# and this workflow performs only the mechanical last step a session used to
# babysit with a polling loop. Removing the label aborts; a PR without the
# label is never touched and never commented on.
#
# The gate requires POSITIVE evidence on the exact current head: `Unit tests`
# and `Lint & type-check` present, COMPLETED, and SUCCESS, with a healthy
# workflow-run classification (#2184). An absent check, a starved run, and a
# DIRTY PR's silently-skipped checks all read as not-green. A head that moves
# after labeling therefore re-gates on its own: the new head has no concluded
# checks, so the lane comments that it is waiting and merges nothing.
#
# master protection is `strict`, so GitHub refuses to merge a head that is
# behind. A green BEHIND PR gets the update-branch kick instead of a merge;
# that writes a new head, which re-gates on its own checks next cycle.
#
# WHO may approve: the lane reads the PR timeline for the last `labeled`
# event for `train:approved` and requires the actor to be in TRAIN_APPROVERS
# (default: the repository owner). Anyone who can label would otherwise be
# able to merge, which is a much larger grant than this lane intends. An
# unreadable timeline denies, never passes.
#
# A successful merge uses repository_dispatch with the exact merge SHA because
# this workflow authenticates its Git write with GITHUB_TOKEN. GitHub suppresses
# the resulting push event for downstream workflows, while repository_dispatch
# remains eligible. The master-push workflows consume the event and pin every
# checkout to its payload SHA; their per-SHA concurrency groups collapse a
# duplicate event without allowing concurrent validation of one commit.

on:
  schedule:
    - cron: "*/10 * * * *"
  check_suite:
    types: [completed]
  workflow_dispatch: {}

# One lane run at a time: two concurrent runs could both read the same green
# head and race the same merge call.
concurrency:
  group: merge-train-lane
  cancel-in-progress: false

permissions: {}

jobs:
  lane:
    name: Merge train:approved PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write # the merge commit, and the update-branch kick on a BEHIND head
      pull-requests: write # merge the PR object, and comment the verdict
      issues: read # PR timeline events, for train:approved label provenance
      actions: read # workflow-run + job reads for the run-health gate
      checks: read # check-run conclusions on the head commit
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # Comma-separated logins allowed to apply train:approved. Unset means
      # the repository owner only.
      TRAIN_APPROVERS: ${{ vars.TRAIN_APPROVERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Merge approved PRs whose current head concluded green
        run: node scripts/merge-train-lane.mjs
