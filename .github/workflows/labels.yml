name: Sync labels

on:
  push:
    branches: [master]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [merge-train-post-merge]

concurrency:
  group: labels-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-merge-train-dispatch:
    name: Validate merge-train dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'repository_dispatch'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate merge-train dispatch ancestry
        if: github.event_name == 'repository_dispatch'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.repository }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          PAYLOAD_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: node scripts/lib/merge-train-dispatch-validation.mjs

  record-post-merge-validation:
    name: Record post-merge validation
    if: always() && github.event_name == 'repository_dispatch' && needs.validate-merge-train-dispatch.result == 'success'
    needs: [validate-merge-train-dispatch, sync]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Record exact-SHA terminal state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          PAYLOAD_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          SYNC_RESULT: ${{ needs.sync.result }}
        run: |
          set -euo pipefail
          if [[ "$SYNC_RESULT" == success ]]; then state=succeeded;
          elif [[ "$SYNC_RESULT" == failure ]]; then state=failed;
          else exit 0; fi
          marker="<!-- merge-train-post-merge:sha=$PAYLOAD_SHA:workflow=labels.yml:state=$state -->"
          body="Post-merge validation $state for $PAYLOAD_SHA.\n\n$marker"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PAYLOAD_PR_NUMBER/comments" \
            --data "$(jq -n --arg body "$body" '{body:$body}')"

  sync:
    needs: validate-merge-train-dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.ref }}
          persist-credentials: false


      - name: Validate merge-train dispatch payload
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.repository }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          if [[ "$PAYLOAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::repository_dispatch repository does not match this repository"
            exit 1
          fi
          if [[ ! "$PAYLOAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::repository_dispatch SHA must be a 40-hex commit"
            exit 1
          fi
          checked_sha="$(git rev-parse --verify HEAD)"
          if [[ "${PAYLOAD_SHA,,}" != "$checked_sha" ]]; then
            echo "::error::checkout does not match the repository_dispatch SHA"
            exit 1
          fi

      # #2614: the syncer below DELETES labels with `prune: true`, and its
      # deletions are otherwise silent — run 34042925533 logged "label:
      # priority:p3 deleted from: apmantza/pi-lens" (then p1, p2) while the
      # post-merge validation recorded success. Snapshot the live label set
      # first so the validation step after the syncer can detect a deletion
      # as before-vs-after drift: the deleted labels are absent from the
      # manifest by definition, so a manifest-only diff cannot see them.
      - name: Snapshot live labels before sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json name --jq '.[].name' \
            | tr '[:upper:]' '[:lower:]' | LC_ALL=C sort \
            > "$RUNNER_TEMP/labels-before.txt"

      # yamllint disable-line rule:line-length
      - uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1
        with:
          manifest: .github/labels.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          # Explicit, though the pinned action already defaults `prune` to
          # true: any live label absent from the manifest above is DELETED
          # on every run of this workflow (#2553).
          prune: true

      # #2614: fail the sync when it deleted or lost any label. `deleted`
      # is before-vs-after drift (the #2553 recurrence — pruned labels are
      # manifest-absent, so this is the only observable they leave);
      # `missing` is a manifest label the live set does not carry after the
      # sync. Names are case-folded before comparison because GitHub label
      # names are unique case-insensitively. Listing here fails closed: if
      # the live set cannot be read, the step fails rather than reads as
      # clean. `LC_ALL=C` pins the sorts and comm to the same byte order:
      # under a non-C locale sort collates while comm compares bytes, so a
      # non-ASCII label name leaves the files unsorted for comm and the
      # named-labels report is lost (exit 1, no ::error:: line).
      - name: Validate label sync results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json name --jq '.[].name' \
            | tr '[:upper:]' '[:lower:]' | LC_ALL=C sort \
            > "$RUNNER_TEMP/labels-after.txt"
          sed -n "s/^[[:space:]]*-[[:space:]]*name:[[:space:]]*//p" \
            .github/labels.yml \
            | tr -d "\"'" | tr '[:upper:]' '[:lower:]' | LC_ALL=C sort \
            > "$RUNNER_TEMP/manifest-labels.txt"
          deleted="$(LC_ALL=C comm -23 "$RUNNER_TEMP/labels-before.txt" \
            "$RUNNER_TEMP/labels-after.txt")"
          missing="$(LC_ALL=C comm -23 "$RUNNER_TEMP/manifest-labels.txt" \
            "$RUNNER_TEMP/labels-after.txt")"
          names=""
          if [[ -n "$deleted" ]]; then
            names="deleted: $(printf '%s\n' "$deleted" | paste -sd, -)"
          fi
          if [[ -n "$missing" ]]; then
            names="${names:+$names }missing: $(printf '%s\n' "$missing" | paste -sd, -)"
          fi
          if [[ -n "$names" ]]; then
            echo "::error::label sync deleted or missing labels: $names"
            exit 1
          fi
